<!DOCTYPE html>
<html lang="zh-CN" data-fruit-defense-host="portrait-contain-v1">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="stylesheet" href="TemplateData/fruit-defense-host.css">
#if SHOW_DIAGNOSTICS
    <link rel="stylesheet" href="<<<TemplateData/diagnostics.css>>>">
    <script src="<<<TemplateData/diagnostics.js>>>"></script>
#endif
  </head>
  <body>
    <main id="unity-host" aria-label="{{{ PRODUCT_NAME }}}">
      <section id="unity-container" data-host-layout="pending">
        <canvas id="unity-canvas" width={{{ WIDTH }}} height={{{ HEIGHT }}} tabindex="-1"></canvas>
        <div id="unity-loading-bar" role="status" aria-live="polite">
          <div id="unity-loading-label">正在加载…</div>
          <div id="unity-progress-track"><div id="unity-progress-bar-full"></div></div>
        </div>
        <div id="unity-warning" aria-live="assertive"></div>
      </section>
    </main>
    <script src="TemplateData/fruit-defense-host.js"></script>
    <script>
      const canvas = document.querySelector("#unity-canvas");
      const host = window.fruitDefenseWebGLHost.mount({
        host: document.querySelector("#unity-host"),
        container: document.querySelector("#unity-container"),
        canvas: canvas,
        logicalWidth: {{{ WIDTH }}},
        logicalHeight: {{{ HEIGHT }}}
      });

      function unityShowBanner(message, type) {
        const warning = document.querySelector("#unity-warning");
        const item = document.createElement("div");
        item.textContent = message;
        item.className = type === "error" ? "error" : "warning";
        warning.appendChild(item);
        warning.style.display = "block";
        if (type !== "error") {
          window.setTimeout(() => {
            item.remove();
            warning.style.display = warning.children.length ? "block" : "none";
          }, 5000);
        }
      }

      const buildUrl = "Build";
      const loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      const config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
        matchWebGLToCanvasSize: !host.usesFixedRenderTarget
      };

#if BACKGROUND_FILENAME
      canvas.style.background = "url('" + buildUrl + "/{{{ BACKGROUND_FILENAME.replace(/'/g, '%27') }}}') center / cover";
#else
      canvas.style.background = "{{{ BACKGROUND_COLOR }}}";
#endif
      const loadingBar = document.querySelector("#unity-loading-bar");
      loadingBar.style.display = "grid";
      const loader = document.createElement("script");
      loader.src = loaderUrl;
      loader.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = `${100 * progress}%`;
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
#if SHOW_DIAGNOSTICS
          window.fruitDefenseUnityDiagnostics = () => unityDiagnostics.openDiagnosticsDiv(unityInstance.GetMetricsInfo);
#endif
        }).catch((message) => {
          unityShowBanner(String(message), "error");
        });
      };
      document.body.appendChild(loader);
    </script>
  </body>
</html>
