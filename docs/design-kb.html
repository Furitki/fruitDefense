<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Design Knowledge Base</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --sidebar: #f7f7f8;
      --hover: #ececf1;
      --selected: #e7f5f1;
      --line: #e5e7eb;
      --text: #2d333a;
      --muted: #6b7280;
      --accent: #10a37f;
      --accent-hover: #0d8f70;
      --accent-text: #0a765d;
      --brand-bg: #2d333a;
      --brand-text: #ffffff;
      --button-hover: #f9fafb;
      --code: #f4f4f5;
      --code-text: #374151;
      --toggle-hover: rgba(0, 0, 0, 0.05);
      --warning: #b45309;
    }
    body[data-theme="dark"] {
      --bg: #212121;
      --sidebar: #171717;
      --hover: #2f2f2f;
      --selected: #263d37;
      --line: #3d3d3d;
      --text: #ececec;
      --muted: #a3a3a3;
      --accent: #19c37d;
      --accent-hover: #16ad70;
      --accent-text: #5ee0b5;
      --brand-bg: #ececec;
      --brand-text: #171717;
      --button-hover: #2f2f2f;
      --code: #2f2f2f;
      --code-text: #e5e7eb;
      --toggle-hover: rgba(255, 255, 255, 0.08);
      --warning: #f0b35a;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.68 Inter, ui-sans-serif, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    button, input, select, textarea { font: inherit; }
    button {
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
      padding: 0.46rem 0.68rem;
    }
    button:hover { background: var(--button-hover); }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid rgba(16, 163, 127, 0.32); outline-offset: 1px; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #ffffff; }
    button.primary:hover { background: var(--accent-hover); }
    button:disabled { cursor: not-allowed; opacity: 0.48; }
    .app { min-height: 100%; display: grid; grid-template-rows: auto 1fr auto; }
    .topbar {
      align-items: center;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
      display: flex;
      gap: 0.85rem;
      justify-content: space-between;
      padding: 0.65rem 0.9rem;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .brand { display: flex; align-items: center; gap: 0.62rem; min-width: 0; }
    .brand-mark {
      align-items: center;
      background: var(--brand-bg);
      border-radius: 7px;
      color: var(--brand-text);
      display: flex;
      font-size: 0.72rem;
      font-weight: 700;
      height: 2rem;
      justify-content: center;
      letter-spacing: 0.03em;
      width: 2rem;
    }
    .brand h1 { font-size: 1rem; font-weight: 600; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .actions { align-items: center; display: flex; flex-wrap: wrap; gap: 0.4rem; justify-content: flex-end; }
    .theme-switch {
      background: var(--sidebar);
      border-color: var(--line);
      border-radius: 999px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-width: 9.5rem;
      padding: 0.2rem;
      position: relative;
    }
    .theme-switch::before {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 999px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
      content: "";
      inset: 0.2rem 50% 0.2rem 0.2rem;
      position: absolute;
      transition: transform 160ms ease;
    }
    .theme-switch[aria-checked="true"]::before { transform: translateX(100%); }
    .theme-switch:hover { background: var(--sidebar); }
    .theme-switch-option {
      align-items: center;
      color: var(--muted);
      display: flex;
      font-size: 0.78rem;
      gap: 0.28rem;
      justify-content: center;
      padding: 0.16rem 0.44rem;
      position: relative;
      transition: color 160ms ease;
      z-index: 1;
    }
    .theme-switch[aria-checked="false"] .theme-switch-day,
    .theme-switch[aria-checked="true"] .theme-switch-night { color: var(--text); font-weight: 600; }
    .workspace {
      display: grid;
      grid-template-columns: minmax(16rem, 20rem) minmax(0, 1fr);
      min-height: 0;
    }
    .sidebar { background: var(--sidebar); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
    .sidebar-head { padding: 0.8rem 0.75rem 0.55rem; }
    .sidebar-head label { color: var(--muted); display: block; font-size: 0.72rem; margin-bottom: 0.3rem; }
    .sidebar-head input {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--text);
      padding: 0.5rem 0.62rem;
      width: 100%;
    }
    .sidebar-meta { align-items: center; color: var(--muted); display: flex; font-size: 0.7rem; gap: 0.6rem; justify-content: space-between; padding: 0.15rem 0.55rem 0.35rem 0.82rem; }
    .sidebar-stats { align-items: center; display: flex; gap: 0.65rem; min-width: 0; }
    .icon-button {
      align-items: center;
      background: transparent;
      border: 0;
      display: inline-flex;
      flex: 0 0 auto;
      justify-content: center;
      padding: 0;
    }
    .sidebar-create { border-radius: 6px; font-size: 1.45rem; height: 2rem; line-height: 1; width: 2rem; }
    .sidebar-create:hover { background: var(--toggle-hover); }
    .tree { overflow: auto; padding: 0.2rem 0.45rem 0.8rem; }
    .tree-list { list-style: none; margin: 0; padding-left: 1rem; }
    .tree-list.root { padding-left: 0; }
    .tree-row {
      align-items: center;
      background: transparent;
      border-radius: 7px;
      display: flex;
      margin: 0.06rem 0;
      min-width: 0;
    }
    .tree-row:hover { background: var(--hover); }
    .tree-row.active { background: var(--selected); }
    .tree-toggle, .tree-spacer {
      align-items: center;
      align-self: stretch;
      display: flex;
      flex: 0 0 1.75rem;
      justify-content: center;
      min-height: 2.1rem;
      width: 1.75rem;
    }
    .tree-toggle {
      background: transparent;
      border: 0;
      border-radius: 6px;
      color: var(--muted);
      padding: 0;
    }
    .tree-toggle:hover { background: var(--toggle-hover); color: var(--text); }
    .tree-toggle::before {
      border-bottom: 4px solid transparent;
      border-left: 5px solid currentColor;
      border-top: 4px solid transparent;
      content: "";
      transform: rotate(0deg);
      transition: transform 120ms ease;
    }
    .tree-toggle[aria-expanded="true"]::before { transform: rotate(90deg); }
    .tree-select {
      background: transparent;
      border: 0;
      border-radius: 0;
      flex: 1;
      min-width: 0;
      padding: 0.43rem 0.5rem 0.43rem 0;
      text-align: left;
    }
    .tree-select:hover { background: transparent; }
    .tree-select.active { color: var(--accent-text); font-weight: 600; }
    .tree-title { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .content { background: var(--bg); min-height: 0; overflow: auto; padding: clamp(1.2rem, 3vw, 3rem); }
    .document-head, .preview, .editor { margin-left: auto; margin-right: auto; max-width: 52rem; }
    .document-head { border-bottom: 1px solid var(--line); margin-bottom: 1.5rem; padding-bottom: 1rem; }
    .document-title-row { align-items: flex-start; display: flex; gap: 0.75rem; justify-content: space-between; }
    .document-head h2 { flex: 1; font-size: clamp(1.45rem, 3vw, 2rem); font-weight: 650; line-height: 1.28; margin: 0 0 0.38rem; min-width: 0; }
    .document-edit { border-radius: 6px; height: 2.25rem; margin-top: 0.05rem; width: 2.25rem; }
    .document-edit-icon { height: 1.08rem; width: 1.08rem; }
    .document-edit:hover { background: var(--button-hover); }
    .document-path { color: var(--muted); font-family: Consolas, monospace; font-size: 0.75rem; overflow-wrap: anywhere; }
    .chips { display: flex; flex-wrap: wrap; gap: 0.65rem; margin-top: 0.65rem; }
    .chip { color: var(--muted); font-size: 0.7rem; }
    .preview { overflow-wrap: anywhere; }
    .preview h1, .preview h2, .preview h3 { line-height: 1.3; margin: 1.5em 0 0.55em; }
    .preview h1 { font-size: 1.75rem; }
    .preview h2 { border-bottom: 1px solid var(--line); font-size: 1.38rem; padding-bottom: 0.35rem; }
    .preview h3 { font-size: 1.12rem; }
    .preview p { margin: 0.72rem 0; }
    .preview a { color: var(--accent-text); }
    .preview code { background: var(--code); border-radius: 4px; color: var(--code-text); padding: 0.12rem 0.3rem; }
    .preview pre { background: var(--code); border: 1px solid var(--line); border-radius: 7px; overflow: auto; padding: 0.85rem; }
    .preview pre code { background: transparent; padding: 0; }
    .preview blockquote { border-left: 3px solid var(--line); color: var(--muted); margin-left: 0; padding-left: 0.9rem; }
    .preview table { border-collapse: collapse; display: block; overflow-x: auto; width: 100%; }
    .preview th, .preview td { border: 1px solid var(--line); padding: 0.45rem 0.6rem; text-align: left; }
    .preview th { background: var(--sidebar); }
    .preview hr { border: 0; border-top: 1px solid var(--line); margin: 1.5rem 0; }
    .preview[hidden], .editor[hidden] { display: none; }
    .editor { display: grid; gap: 1rem; }
    .editor-grid { display: grid; gap: 0.8rem; grid-template-columns: minmax(0, 1.6fr) minmax(8rem, 1fr); }
    .editor-field { display: grid; gap: 0.28rem; }
    .editor-field.full { grid-column: 1 / -1; }
    .editor-field span { color: var(--muted); font-size: 0.75rem; }
    .editor input, .editor select, .editor textarea {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--text);
      padding: 0.55rem 0.65rem;
      width: 100%;
    }
    .editor input:disabled { background: var(--sidebar); color: var(--muted); }
    .editor textarea { font-family: Consolas, "SFMono-Regular", monospace; line-height: 1.55; min-height: 26rem; resize: vertical; }
    .editor-actions { display: flex; gap: 0.5rem; justify-content: flex-end; }
    .statusbar {
      align-items: center;
      background: var(--bg);
      border-top: 1px solid var(--line);
      color: var(--muted);
      display: flex;
      font-size: 0.75rem;
      justify-content: space-between;
      padding: 0.48rem 1rem;
    }
    .status.success { color: var(--accent); }
    .status.warning { color: var(--warning); }
    .empty { color: var(--muted); padding: 1rem; }
    @media (max-width: 820px) {
      .topbar { align-items: flex-start; flex-direction: column; }
      .actions { justify-content: flex-start; }
      .workspace { grid-template-columns: 1fr; }
      .sidebar { border-bottom: 1px solid var(--line); border-right: 0; max-height: 42vh; }
    }
    @media (max-width: 540px) {
      .actions { width: 100%; }
      .actions > button:not(.theme-switch) { flex: 1 1 auto; }
      .theme-switch { margin-left: auto; }
      .content { padding: 1rem; }
      .statusbar { align-items: flex-start; flex-direction: column; }
      .editor-grid { grid-template-columns: 1fr; }
      .editor-field.full { grid-column: auto; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">KB</div>
        <div>
          <h1 id="app-title">Design Knowledge Base</h1>
        </div>
      </div>
      <div class="actions">
        <button id="connect-project" class="primary" type="button">连接当前项目</button>
        <button id="refresh-project" type="button" disabled>刷新</button>
        <button id="theme-toggle" class="theme-switch" type="button" role="switch" aria-checked="false" aria-label="日间与夜间模式切换">
          <span class="theme-switch-option theme-switch-day"><span aria-hidden="true">☀</span>日间</span>
          <span class="theme-switch-option theme-switch-night"><span aria-hidden="true">☾</span>夜间</span>
        </button>
      </div>
    </header>
    <main class="workspace">
      <aside class="sidebar">
        <div class="sidebar-head">
          <label for="search">搜索标题、ID、状态或路径</label>
          <input id="search" type="search" autocomplete="off" placeholder="搜索知识库">
        </div>
        <div class="sidebar-meta">
          <div class="sidebar-stats"><span id="document-count">0 篇</span><span id="digest"></span></div>
          <button id="new-document" class="icon-button sidebar-create" type="button" aria-label="新建文档" title="新建文档" disabled><span aria-hidden="true">+</span></button>
        </div>
        <nav id="tree" class="tree" aria-label="文档树"></nav>
      </aside>
      <section class="content">
        <div id="document-head" class="document-head">
          <div class="document-title-row">
            <h2 id="document-title">未选择文档</h2>
            <button id="edit-document" class="icon-button document-edit" type="button" aria-label="编辑当前文档" title="编辑当前文档" disabled>
              <svg class="document-edit-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                <path d="M4 20l4.25-1L19.1 8.15a2.2 2.2 0 0 0-3.1-3.1L5.15 15.9 4 20Z"></path>
                <path d="m14.5 6.5 3 3"></path>
              </svg>
            </button>
          </div>
          <div id="document-path" class="document-path"></div>
          <div id="chips" class="chips"></div>
        </div>
        <article id="preview" class="preview"></article>
        <form id="editor" class="editor" hidden>
          <div class="editor-grid">
            <label class="editor-field full"><span>仓库内路径</span><input id="editor-path" type="text" autocomplete="off" spellcheck="false"></label>
            <label class="editor-field"><span>文档 ID</span><input id="editor-id" type="text" autocomplete="off" spellcheck="false"></label>
            <label class="editor-field"><span>父文档</span><select id="editor-parent"></select></label>
            <label class="editor-field"><span>顺序</span><input id="editor-order" type="number" step="1"></label>
            <label class="editor-field"><span>状态</span><select id="editor-status"><option value="draft">draft</option><option value="active">active</option><option value="deprecated">deprecated</option><option value="archived">archived</option></select></label>
            <label class="editor-field full"><span>Markdown 内容（不含 front matter）</span><textarea id="editor-body" spellcheck="false"></textarea></label>
          </div>
          <div class="editor-actions">
            <button id="cancel-edit" type="button">取消</button>
            <button id="save-document" class="primary" type="submit">保存 Markdown</button>
          </div>
        </form>
      </section>
    </main>
    <footer class="statusbar">
      <span id="status" class="status">当前显示内嵌快照；连接项目后可读取和编辑最新 Markdown。</span>
      <span id="workspace-mode">静态快照</span>
    </footer>

  <script id="design-kb-data" type="application/json">{"schemaVersion":1,"kitVersion":"0.2.1","projectId":"600115a0-6e2b-43be-bf0e-407d6860b611","title":"furitDefense 设计知识库","contentDigest":"1e99e731c361884571d7b6abc03aa1456bbeb2b0f7c38d85c6e517ae2c6b1ed4","documents":[{"path":"docs/art/dual-grid-tile-generation-pipeline.md","title":"Dual-Grid 地图图块生成技术分支","id":"dual-grid-tile-generation-pipeline","parent":"design-kb-home","order":55,"status":"active","source":"---\nid: dual-grid-tile-generation-pipeline\nparent: design-kb-home\norder: 55\nstatus: active\n---\n\n# Dual-Grid 地图图块生成技术分支\n\n本文是 [地图图块统一生产管线](map-tile-production-pipeline.md) 下的 Dual-Grid 技术分支，只负责拓扑输入、16 Mask、确定性派生、压力测试和 Unity 笔刷包。所有地图图块必须先遵守统一管线的风格候选、游戏内方格预演、两次人工门禁、资产隔离、单关接入和真实 WebGL 验收；本文不能单独授权生产或发布。\n\nA、B 两条路线只在模型输入和 16 Mask 取得方式上不同；模型返图之后的命名、Runtime 下采样、图集、压力图、证据和机械 QA 共用同一套脚本。若本文与统一管线的阶段顺序、审核边界或发布门禁冲突，以统一管线为准。\n\n本管线只生产版本化候选和审核证据。机械 QA 通过不等于美术通过、接缝安全或已经接入 Unity。人工审核和接缝门禁通过前，输出只能位于 `Builds/Evidence`，不得复制到生产 `Resources`、发布场景或可玩目录。\n\n## 1. Dual-Grid 技术流程\n\n下列流程产生的 Raw、Mask、图集和压力图在统一管线第二次人工门禁前都只是候选证据，不得因完成 Finalize 或 Validate 就提前提升为生产资源。\n\n```text\n复制并填写材质 profile\n  -> Prepare 机械生成无网格拓扑和提示词\n  -> 图像模型单次整图重绘，原样保存 Raw\n  -> Finalize 按路线归一化、裁切或重建 Mask00..15\n  -> 共用后处理生成 Review256、描述符指定的 Runtime64、数字序图集和卍字图\n  -> 独立保留 Runtime32 作为固定尺寸压力图采样源\n  -> 共用压力测试生成 1 张 1024×1024 紧凑总图\n  -> 穷举横向 64 对、纵向 64 对合法邻接并记录真实 mismatch\n  -> Validate 复核 hash、尺寸、alpha 和解码像素\n  -> 人工视觉审核\n  -> 审核通过后另行进入 Unity 导入/发布流程\n```\n\n模型调用是明确的桥接步骤，不在确定性脚本内部。脚本不得生成伪 Raw，也不得用旧图或程序图替代失败的模型结果。\n\n## 2. 两条入口路线\n\n| 项目 | A：材质母图路线 | B：拓扑外圈路线 |\n|---|---|---|\n| 适合 | 需要从一块完整材质样本提取表面和交界 | 需要整张控制复杂风车头、上下文和裁切 |\n| Prepare 输出 | 1024×1024 无网格拓扑 | 1536×1536 无网格 6×6 overscan 拓扑 |\n| 结构 | 中央连续 3×3 landform，四边半格 base 边距 | 7×7 顶点格生成 6×6 frame，中央 4×4 是 canonical 卍字 |\n| 模型动作 | 把整块母图重绘为两种材质 | 把整张 overscan 拓扑重绘为两种材质 |\n| Finalize | 归一化为 1024；采集 landform、base、四向交界带；使用机器拓扑权威图重建 Mask00..15 | 归一化为 1536；固定裁 `x=256,y=256,w=1024,h=1024`；按 canonical 布局切 Mask00..15 |\n| 拓扑归属 | `SquareContourTopologyGuide.png` 最终拥有 16 Mask 拓扑 | 6×6 overscan 和固定中央裁区拥有 frame 分布；模型仍需人工检查内部轮廓漂移 |\n\n### 2.1 A 路线固定拓扑\n\n左上原点，NW=`1`、NE=`2`、SE=`4`、SW=`8`：\n\n```text\n04 12 12 08\n06 15 15 09\n06 15 15 09\n02 03 03 01\n```\n\n它表达一块完整草皮式母图：中央连续 3×3 landform，四周各有半格 base 边距。它不是最终 16 Mask 图集；Finalize 必须从母图提取材质，再结合机器拓扑权威图重建完整 `Mask-00..15`。\n\n### 2.2 B 路线固定拓扑\n\n7×7 顶点占用：\n\n```text\n0000000\n0001000\n0101110\n0011100\n0000100\n0001000\n0000000\n```\n\n生成的 6×6 mask：\n\n```text\n00 00 04 08 00 00\n04 08 06 13 12 08\n02 05 14 15 11 01\n00 02 03 07 09 00\n00 00 04 10 01 00\n00 00 02 01 00 00\n```\n\n固定裁取中央行列 `1..4` 后得到 canonical 卍字：\n\n```text\n08 06 13 12\n05 14 15 11\n02 03 07 09\n00 04 10 01\n```\n\n上端和右端的“头”必须来自 6×6 外圈中的完整上下文，不允许只画 4×4 后由模型猜测。\n\n## 3. 稳定入口\n\n| 职责 | 文件 |\n|---|---|\n| PowerShell 入口 | `scripts/dual-grid-tile-pipeline.ps1` |\n| 确定性图像核心 | `scripts/dual_grid_tile_pipeline.py` |\n| A 草土样例配置 | `scripts/dual-grid-profiles/A-grass-soil.json` |\n| B 石水样例配置 | `scripts/dual-grid-profiles/B-stone-water.json` |\n| A 机器拓扑权威图 | `Assets/LayeredTerrain/GrassSoil/Square/Topology/SquareContourTopologyGuide.png` |\n\n运行环境需要 PowerShell、Python 3 和 Pillow 10–12。若缺少 Pillow：\n\n```powershell\npython -m pip install \"Pillow>=10,\u003c13\"\n```\n\n## 4. 新建一套地图图块\n\n先复制最接近的 profile，修改以下字段：\n\n- `id`：候选的稳定标识；\n- `route`：`A` 或 `B`；\n- `landformLabel`、`baseLabel`：两种材质名称；\n- `stylePrompt`：只描述材质和风格，不改结构契约；\n- A 路线可调整 `boundaryBandWidth`，默认 12；除非拓扑规格升级，不改尺寸和 mask 常量。\n- `candidateMode`：`route-default`、`pure-model` 或 `protected-hybrid`；\n- `protectedReviewWidth`、`crossoverWidth`：保护边缘分支的可信外框和交叉带宽度。\n- `unityBrush`：Unity 一键导入所需的稳定笔刷 ID、目录名、显示名、前景/背景 Surface、轮廓、边缘样式和端点 Mask。新增笔刷只改 profile，不改 Unity 导入器。\n\n每轮使用新的版本化输出目录：\n\n```powershell\n$RunRoot = \"Builds/Evidence/dual-grid-runs/\u003cdate>-\u003ccandidate>\"\n```\n\n### 4.1 Prepare\n\nA 示例：\n\n```powershell\n./scripts/dual-grid-tile-pipeline.ps1 `\n  -Stage Prepare `\n  -Profile scripts/dual-grid-profiles/A-grass-soil.json `\n  -OutputRoot \"$RunRoot/A-grass-soil\"\n```\n\nB 示例：\n\n```powershell\n./scripts/dual-grid-tile-pipeline.ps1 `\n  -Stage Prepare `\n  -Profile scripts/dual-grid-profiles/B-stone-water.json `\n  -OutputRoot \"$RunRoot/B-stone-water\"\n```\n\nPrepare 生成：\n\n```text\nsource/Source-A-PatchTopology-1024.png\n或 source/Source-B-OverscanTopology-1536.png\nsource/topology.json\nrequest/pipeline-prompt.txt\n```\n\n拓扑图必须完全不透明，只含两种 semantic 颜色，不带网格、标签、边框、gutter 或文字。\n\n### 4.2 模型桥接\n\n把 `source/*.png` 作为精确结构输入，把 `request/pipeline-prompt.txt` 作为提示词基础。可增加材质参考图，但不得删除提示词中的结构约束。真实返回原样保存，不要提前裁剪或修补。\n\n模型阶段必须写入 `request/model-call.json`，至少记录：\n\n```json\n{\n  \"tool\": \"\u003c实际工具>\",\n  \"toolMode\": \"\u003c实际模式>\",\n  \"useCase\": \"precise-object-edit\",\n  \"inputPath\": \"\u003c本 run 的 source topology>\",\n  \"inputSha256\": \"\u003csha256>\",\n  \"promptPath\": \"\u003c本 run 的 pipeline-prompt.txt>\",\n  \"promptSha256AtCall\": \"\u003csha256>\",\n  \"callCountExecuted\": 1,\n  \"retryCount\": 0,\n  \"fallbackUsed\": false,\n  \"rawPath\": \"\u003c真实 Raw.png>\",\n  \"rawSha256\": \"\u003csha256>\",\n  \"executedAt\": \"\u003cUTC ISO-8601>\",\n  \"visualInspectionPerformed\": false\n}\n```\n\nFinalize 会强制核对 input、prompt 和 raw 的路径与 hash，并要求一次调用、零重试、无 fallback。历史回归可以显式使用 `-AllowMissingModelCall`，manifest 会记录 `legacy-regression-explicitly-allowed`；该开关不得用于新候选或生产候选。\n\n模型失败、Raw 不可解码、不是正方形或存在透明像素时必须保存失败证据并停止。不得用拓扑输入、旧候选或脚本生成图冒充 Raw。\n\n### 4.3 Finalize\n\nA 示例：\n\n```powershell\n./scripts/dual-grid-tile-pipeline.ps1 `\n  -Stage Finalize `\n  -Profile scripts/dual-grid-profiles/A-grass-soil.json `\n  -OutputRoot \"$RunRoot/A-grass-soil\" `\n  -RawImage \"\u003c真实模型 Raw.png>\" `\n  -ModelCall \"$RunRoot/A-grass-soil/request/model-call.json\"\n```\n\nB 示例：\n\n```powershell\n./scripts/dual-grid-tile-pipeline.ps1 `\n  -Stage Finalize `\n  -Profile scripts/dual-grid-profiles/B-stone-water.json `\n  -OutputRoot \"$RunRoot/B-stone-water\" `\n  -RawImage \"\u003c真实模型 Raw.png>\" `\n  -ModelCall \"$RunRoot/B-stone-water/request/model-call.json\"\n```\n\n如果目标文件已存在但内容不同，脚本会拒绝覆盖。只有明确重建同一个 run 时才允许增加 `-Force`；常规迭代应新建版本目录。\n\nRaw 归一化只能使用整图中心寻址 Point 公式：\n\n```text\nsourceX = min(Ws-1, floor(((2*x+1)*Ws)/(2*Wt)))\nsourceY = min(Hs-1, floor(((2*y+1)*Hs)/(2*Ht)))\nnormalized[x,y] = raw[sourceX,sourceY]\n```\n\n禁止单格对齐、裁边、补边、bilinear/bicubic、抗锯齿、调色、锐化、alpha 修补或基于画面内容移动边界。Validate 会从 Raw 独立重算 normalized 并逐像素比较。\n\n### 4.4 Validate\n\n```powershell\n./scripts/dual-grid-tile-pipeline.ps1 `\n  -Stage Validate `\n  -OutputRoot \"$RunRoot/A-grass-soil\"\n```\n\nValidate 会按 manifest 重新检查所有 PNG 的文件 hash、解码 RGBA hash、尺寸和 alpha。任何缺图或像素变化都会失败。\n\n### 4.5 Package：生成 Unity 一键导入契约\n\nFinalize 会自动生成 `candidate/BrushImport.json`。历史候选需要补包而不重做图像时，运行：\n\n```powershell\n./scripts/dual-grid-tile-pipeline.ps1 `\n  -Stage Package `\n  -Profile scripts/dual-grid-profiles/\u003cprofile>.json `\n  -OutputRoot \"$RunRoot/\u003ccandidate>\"\n```\n\n`BrushImport.json` 是 Unity 注册语义的唯一输入，包含 `brushId`、`assetFolderName`、显示名、前景/背景 Surface、`contourStyleId`、`edgeStyleId`、前后景端点 Mask、`runtimeTileSize` 和 Runtime 相对路径。Package 会核对 profile、管线 manifest 和完整 16 Mask，不重新生成或修改任何图片。\n\n### 4.6 Repackage：从已验收 Review 提升运行时清晰度\n\n不重新调用模型、不改 Review256、拓扑或压力图，只升级运行时采样时，使用新的版本化输出目录：\n\n```powershell\n./scripts/dual-grid-tile-pipeline.ps1 `\n  -Stage Repackage `\n  -Profile scripts/dual-grid-profiles/\u003cprofile>.json `\n  -SourceRoot \"$AcceptedRun/\u003ccandidate>\" `\n  -OutputRoot \"$NewRun/\u003ccandidate>\"\n```\n\nRepackage 会先完整 Validate 来源 run，再复制其证据链；随后按 profile 从原封不动的 Review256 生成 Runtime64、更新 manifest/BrushImport 并再次 Validate。输出目录必须是不存在的新目录，禁止覆盖历史验收 run。\n\n此外会独立重算并比较：\n\n- Raw → normalized；\n- B 的中央固定裁区；\n- A 的 normalized → Main Board；\n- Review → Runtime 中心采样；\n- 数字序图集和 canonical 卍字图；\n- 单张压力总图及其中四个固定分区；\n- Review 与 Runtime 的 64+64 合法邻接数据；\n- 每个 Mask 的像素所有权合计与 fallback 数量。\n\n## 5. 共用确定性产物\n\n```text\n\u003cRunRoot>/\n  source/\n    Source-*.png\n    topology.json\n  request/\n    pipeline-prompt.txt\n    model-call.json\n  model/\n    Raw.png\n    Normalized-*.png\n    CentralCrop-1024.png       # B\n    Samples/                   # A\n  candidate/\n    BrushImport.json\n    Main-Board-1024.png        # A\n    Review256/Mask-00..15.png\n    Runtime64/Mask-00..15.png  # Unity 正式运行资源，profile/描述符控制尺寸\n    Runtime32/Mask-00..15.png  # 仅供固定 1024 压力图机械重建\n    ReviewAtlas-1024.png\n    RuntimeAtlas-256.png\n    RuntimeAtlas-Upscaled1024.png\n    SwastikaLayout-1024.png\n    Stress-All-1024.png\n    manifest.json\n  evidence/\n    ready.json\n```\n\nRuntime64 使用 Review256 的确定性 Lanczos 缩小；固定压力图仍使用中心采样：\n\n```text\nUnity 底部原点：Stress32[x,y] = Review[8*x+4, 8*y+4]\nPNG 顶部原点：  Stress32[x,y] = Review[8*x+4, 8*y+3]\n```\n\n## 6. 候选像素分支\n\n### 6.1 Route Default\n\nA 默认使用母图材质采样、四向交界带和机器拓扑 alpha 重建完整 Mask00..15。B 默认将中央 4×4 纯返图按 canonical frame 切片。每个 Mask 都记录：\n\n```text\nrouteDerivedPixels\nhistoricalPixels\nfallbackPixels\ntotalPixels\n```\n\n任一 Mask 的三类来源合计必须为 65,536，`fallbackPixels` 必须为零。\n\n### 6.2 Pure Model\n\n纯返图分支不回填历史像素：\n\n```text\nrouteDerivedPixels = 65536\nhistoricalPixels = 0\nfallbackPixels = 0\n```\n\n纯返图不等于无缝。真实 mismatch 必须保留，`seamSafetyClaimed=false`。\n\n### 6.3 Protected Hybrid\n\n当已有经过机械验证的可信 `Mask-00..15` socket 时，可选择 `candidateMode=protected-hybrid`，并在 Finalize 传入：\n\n```powershell\n-TrustedMaskRoot \"\u003c可信 Review256 目录>\"\n```\n\n默认参数：外围 32px 完全来自可信历史 Mask，接下来的 16px 使用固定 8×8 Bayer 阈值在可信像素和 route-derived 像素之间选择完整 RGBA，中心来自 route-derived 候选。流程不做通道混合。\n\n```text\nedgeDistance = min(x,255-x,y,255-y)\n\nedgeDistance \u003c 32:\n  historical\n32 \u003c= edgeDistance \u003c 48:\n  threshold = ((15-(edgeDistance-32))*64)/16\n  historical when Bayer8[y&7,x&7] \u003c threshold, otherwise route-derived\nedgeDistance >= 48:\n  route-derived\n```\n\n可信 Mask 必须为完整 16 张、256×256、全不透明；脚本逐像素记录所有权。ProtectedHybrid 只保护 socket，不替代人工检查内部拓扑和风格。\n\n## 7. 单图全验压力测试\n\n四个压力场分别由 17×17 逻辑顶点场生成 16×16 个 Runtime tile。每个 Runtime tile 始终保持原生 32×32 像素，所以每个场景为 512×512：\n\n1. 纯 landform 重复；\n2. landform 中央 base 洞；\n3. base 中央 landform 岛；\n4. 对角混合、棋盘和十字叠加。\n\n逻辑顶点函数固定为：\n\n```text\npureLandform(x,y) = true\n\nlandformWithCentralBaseHole(x,y) =\n  x \u003c 5 or x > 11 or y \u003c 5 or y > 11\n\nbaseWithCentralLandformIsland(x,y) =\n  5 \u003c= x \u003c= 11 and 5 \u003c= y \u003c= 11\n\nchecker = (((floor(x/2)+floor(y/2)) & 1) == 0)\ncross = ((6 \u003c= x \u003c= 10) or (6 \u003c= y \u003c= 10))\ndiagonalMixed(x,y) = checker XOR cross\n```\n\nPNG 脚本使用左上原点的 17×17 逻辑顶点场。每个输出 tile 由四个逻辑顶点按 NW=`1`、NE=`2`、SE=`4`、SW=`8` 计算 Mask，再原样放置对应 Runtime32。四个场景合计必须覆盖全部 `Mask00..15`。修改阈值、XOR、尺寸或坐标原点即形成新测试版本，不得沿用旧 manifest。\n\nFinalize 不再输出四个独立文件，而是组装一张 `Stress-All-1024.png`。固定分区如下，坐标均为 PNG 左上原点的 `[x,y,width,height]`：\n\n| 分区 | 场景 | 矩形 |\n|---|---|---|\n| 左上 | `pureLandform` | `[0,0,512,512]` |\n| 右上 | `landformWithCentralBaseHole` | `[512,0,512,512]` |\n| 左下 | `baseWithCentralLandformIsland` | `[0,512,512,512]` |\n| 右下 | `diagonalMixed` | `[512,512,512,512]` |\n\n总图内部禁止缩放 Runtime tile，也禁止滤波、标签、边框、网格、间距或覆盖层，因此四个分区都能逐像素裁回确定性的 512 图。manifest 的 `stressAtlas` 是唯一图例，记录总图路径、尺寸、`tileGridSize=16×16`、`logicalVertexSize=17×17`、`runtimeTileSize=32×32`、布局版本，以及每个分区的 id、公式、矩形、解码 RGBA hash 和 alpha 状态。\n\nValidate 先从 Runtime32 独立重建四个场景和完整总图，再同时执行：\n\n- 1024×1024 整图逐像素比较，用于发现交换分区、额外像素或布局漂移；\n- 四个固定分区分别裁切、逐像素比较并核对各自 hash，用于定位具体失败场景。\n\n紧凑规格只把每个场景的重复密度从 32×32 降到 16×16，不缩放任何 Runtime tile。四场景总放置数由 4096 降为 1024，仍提供横向 960 次和纵向 960 次可见接缝；完整 socket 覆盖继续由独立的 64+64 穷举保证。\n\n脚本同时穷举所有合法邻接：横向 64 对、纵向 64 对。记录：\n\n- `legalPairCount`；\n- `pairMismatchCount`；\n- `pixelMismatchCount`。\n\n`mismatch > 0` 必须保留真实数值。管线固定写入 `seamSafetyClaimed=false`，不得因为图集、尺寸或 alpha 通过就自动宣布无缝。\n\n单张压力总图必须能由 Runtime32 和上述公式整图及逐分区重建。总图用于一次查看四个代表性场景；64+64 穷举邻接才覆盖全部 socket 数据，但二者都不能替代人工美术审核。\n\n## 8. 自动门禁与失败处理\n\nFinalize 前置门禁：\n\n1. topology 与 prompt 存在且 hash 与调用记录一致；\n2. Raw 来自真实模型调用、可解码、正方形、全不透明；\n3. 调用记录为一次调用、零重试、无 fallback；\n4. 输出目录与只读输入隔离；\n5. A 的机器拓扑权威图存在且 hash 可记录；\n6. ProtectedHybrid 的可信 16 Mask 完整且未被改写。\n\n以下情况必须失败或保持“仅供人工审核”，不得自动修图：\n\n- mask 排列重复、遗漏或 Y 轴双重翻转；\n- Raw → normalized 无法按中心公式重建；\n- Runtime、图集、压力总图或任一压力分区不能逐像素重建；\n- ProtectedHybrid 的历史保护像素或所有权不符合契约；\n- PureModel 出现 historical/fallback 像素；\n- 源拓扑、prompt、model-call 或可信 Mask 在运行中改变；\n- 任意声明 PNG 的 hash、尺寸或 alpha 与 manifest 不一致；\n- seam mismatch 非零：保留数字、维持 `seamSafetyClaimed=false`，交给人工。\n\n如果要求智能体不看图，`visualInspectionPerformed=false`；机械解码、hash、尺寸、alpha 和逐像素比较不算视觉检查。交付时仍需把主要过程图和单张压力总图直接交给人工。\n\n## 9. 多候选总览\n\n候选比较使用脚本的 `Overview` 阶段：\n\n```powershell\n./scripts/dual-grid-tile-pipeline.ps1 `\n  -Stage Overview `\n  -OutputRoot \"$RunRoot\" `\n  -Columns 2 `\n  -Candidate @(\n    \"A=$RunRoot/A/candidate/SwastikaLayout-1024.png\",\n    \"B=$RunRoot/B/candidate/SwastikaLayout-1024.png\"\n  )\n```\n\n输出 `overview/All-Candidates-Swastika.png` 和 `overview/manifest.json`，记录 `panelIndex → candidateId → sourcePath → sourceSha256`。总览中的缩放和标签仅供人工横向比较，禁止作为 Runtime、切片或逐像素验收输入。\n\n## 10. Unity 接入门禁\n\n本管线在人工视觉批准前只生产 Evidence。获批后进入独立 Unity 接入步骤：\n\n1. 将 16 张 Runtime 或批准的原生尺寸 Mask 导入版本化素材目录；\n2. 固定 Sprite PPU、Filter、Wrap、Compression、MipMap 和 alpha 契约；\n3. 创建或更新 16 槽 `DualGridTileSet`，Mask00..15 不得错位；\n4. 验证每个 Tile 指向正确 Sprite/GUID；\n5. 运行项目统一 `Fruit Defense/Validation/...` 门禁和实际地图 Play Mode；\n6. 只有接缝、拓扑、人工视觉和运行时命中都通过，才允许进入发布清单。\n\n静态文件存在、普通 WebGL 成功或压力总图可生成，都不能单独证明 TileSet 已实装或小游戏平台已适配。\n\n## 11. 当前回归基线\n\n单图压力回归根目录：\n\n```text\nBuilds/Evidence/dual-grid-stress-atlas-16x16-regression-20260730/\n```\n\n使用现有 A/B 真实 Raw 回归得到：\n\n| 路线 | PNG 检查数 | Review256 与原实验 | Runtime32 与原实验 | Validate |\n|---|---:|---:|---:|---:|\n| A 草＋土 | 47 | 16/16 解码像素一致 | 16/16 解码像素一致 | pass |\n| B 石头＋水 | 41 | 16/16 解码像素一致 | 16/16 解码像素一致 | pass |\n\nA 的新无网格拓扑位于：\n\n```text\nBuilds/Evidence/dual-grid-stress-atlas-16x16-regression-20260730/\n  A-grass-soil/source/Source-A-PatchTopology-1024.png\n```\n\n回归只证明确定性步骤可复现，未执行视觉检查，也不改变原 A/B 候选的 `seamSafetyClaimed=false` 状态。\n\n当前 Runtime64 清晰度修正根目录：\n\n```text\nBuilds/Evidence/dual-grid-runtime64-20260731/\n```\n\n两条路线的 Review256 16/16 与上述回归逐字节一致，`Stress-All-1024.png` 也逐字节一致；只新增描述符声明的 Runtime64 和对应 256 像素运行图集。机械验证通过不升级视觉检查或接缝安全声明。\n\n## 12. 自动测试\n\n仓库测试入口：\n\n```powershell\npython -m unittest scripts.tests.test_dual_grid_tile_pipeline -v\n```\n\n至少覆盖 A/B 静态拓扑、中心寻址归一化、ProtectedHybrid 完整像素来源、model-call 强制契约、16×16 压力密度、17×17 顶点公式、16 Mask 合集、总图固定布局、四区确定性像素和篡改失败。样本回归继续使用 `Prepare/Finalize/Validate` 检查全部派生图。\n\n## 13. 禁止事项\n\n- 不把带网格、标签或 gutter 的图交给模型；\n- 不从模型返图猜测 mask 排列；\n- 不把 A 母图的 16 个位置块冒充完整 Mask00..15；\n- 不在 B 路线跳过 6×6 overscan 而直接生成 4×4；\n- 不覆盖已审核或待审核 run；\n- 不用脚本生成图冒充 AI Raw；\n- 不把机械 QA 当作美术、拓扑或接缝验收；\n- 不在人工批准前把候选写入生产资源。\n\n## 14. 已授权候选的一键正式导入\n\n候选通过机械门禁、并由用户明确要求实装后，使用 Unity 菜单 `Fruit Defense/地图工具/导入 Dual-Grid 笔刷包...`，选择 run 根目录或其中的 `candidate` 目录。通用导入器读取 `BrushImport.json`，只复制描述符指定的 Runtime Mask、原始 `manifest.json` 和导入描述，不会重新生成、补画、调色或视觉修复。\n\n当前两个正式笔刷为：\n\n| 笔刷 | 前景 / 底层 | 生产 TileSet | 纯材质端点 |\n|---|---|---|---|\n| A 草地 + 泥土 | `surface.grass` / `surface.soil` | `Assets/LayeredTerrain/CompositeBrushes/GrassSoil/GrassSoilCompositeTileSet.asset` | Mask15 草地；Mask00 泥土 |\n| B 石头 + 水 | `surface.stone-road` / `surface.water` | `Assets/LayeredTerrain/CompositeBrushes/StoneWater/StoneWaterCompositeTileSet.asset` | Mask15 石头；Mask00 水面 |\n\n导入器按 `runtimeTileSize` 配置 PPU；当前正式包为 64 PPU、居中 FullRect、Bilinear、无压缩、无 Mipmap。它重建 16 槽 `DualGridTileSet`，并创建或更新一个 `TerrainBrushDefinition`。描述文件声明的前后景端点使用 Repeat，其余合成 Mask 使用 Clamp。重复导入同一 `brushId` 会更新原资产、不新增重复入口；新分辨率成功绑定后，只移除该笔刷自己的旧 Runtime 分辨率目录。\n\n`TerrainBrushDefinition` 是后续唯一注册表：`OrchardDefaultTerrainPalette` 从中合并底层端点与精确组合边缘；关卡地图编辑器和地貌素材实验室都按稳定 ID 顺序自动列出同一批笔刷，不再为草土、石水或后续组合新增硬编码按钮。地图编辑器按钮只选择语义组合，实际写格仍走原有区域工具、Undo、地图编译与发布门禁。\n\n地貌实验室在同一个可滚动预览库中按稳定 ID 顺序同时显示全部已注册笔刷；每张卡直接用该定义的正式 16-Mask TileSet 拼出组合预览，并标明单向或双向能力，不需要先切换目标才能发现其他笔刷。卡片在标题栏上方预留居中的正方形画面区，只做等比缩放，不再把横纵方向拉成不同倍率。点卡片后，前景映射为 Material A、背景映射为 Material B，并从正式 Palette 解析可复用地貌；卡片下方的当前方向工具负责实际试画。为避免把旧 A/B 标记静默解释成另一组语义，非空实验画布仍完整显示预览库，但切换会被拒绝并提示先点击“清空实验画布”。石覆水只新增水面底层，不虚构透明水地貌，因此卡片标为单向并只开放“石头覆水”；没有真实水地貌时，“水覆石”保持禁用。\n\n聚焦 Smoke 会复核：描述文件与 manifest 身份、16 张 Runtime64、64 PPU、导入参数、声明端点、旧 Runtime32 生产目录清理、注册表唯一性、Palette 精确绑定、地图编辑器与实验室共同枚举、统一预览库的全量稳定布局与正方形画面区、草土双向可用、石覆水单向规则以及非空画布拒绝。安装不把 `seamSafetyClaimed=false` 改成 true；本轮按要求不执行智能体视觉检查，视觉结论仍由人工负责。普通笔刷编辑不再默认触发 WebGL 构建；只有进入发布门禁时才运行发布构建。\n"},{"path":"docs/art/map-tile-production-pipeline.md","title":"地图图块统一生产管线","id":"map-tile-production-pipeline","parent":"design-kb-home","order":50,"status":"active","source":"---\nid: map-tile-production-pipeline\nparent: design-kb-home\norder: 50\nstatus: active\n---\n\n# 地图图块统一生产管线\n\n本文是 FruitDefense 后续地图图块设计、生成、审核、生产化、关卡接入和实机验收的唯一总入口。纯方块基层与 Dual-Grid 共用本文的阶段和门禁；两者只在候选拆分、连续性证明和 Unity 资产结构上分支。\n\n目标不是让一张独立图块“看起来不错”，而是稳定获得与现有清爽果园风格协调、在真实方格地图中连续、进入目标关卡后仍然好看的结果。\n\n若其他地图图块文档与本文冲突，以本文的阶段顺序、审核边界、资产隔离和发布门禁为准。Dual-Grid 的具体拓扑、Mask、脚本和压力图规则由 [Dual-Grid 地图图块生成技术分支](dual-grid-tile-generation-pipeline.md) 继续负责。\n\n## 1. 不可跳过的总流程\n\n```text\n锁定目标关卡、地形语义与表现类型\n  -> 生成差异充分的风格方向候选\n  -> 人工选定方向（例如 S1）\n  -> 制作真实方格地图的游戏内预演\n  -> 第一次人工门禁：批准整体配色、质感、格子节奏和游戏内观感\n  -> 在 Evidence/Trials 中完成候选拆分、归一化和连续性验证\n  -> 制作使用最终候选图块的真实运行时地图\n  -> 第二次人工门禁：批准最终平铺、边界、玩法可读性和 UI 协调性\n  -> 提升为生产资源并绑定独立 Palette\n  -> 聚焦 Smoke、全量 Smoke、普通 WebGL 构建\n  -> 从 Bootstrap → Lobby → 目标 Battle 的真实竖屏画布截图验收\n```\n\n第一次人工门禁之前，不得把候选当成正式图块；第二次人工门禁之前，不得进入发布依赖图。机械 QA、模型返图、独立图块预览或普通构建成功都不能替代这两次视觉门禁。\n\n候选处理为了制作预演可以在 `Builds/Evidence` 或 `Assets/.../Trials` 中生成临时切片或 Mask；这不算正式拆分和实装。用户批准后，才允许从已批准候选确定性地产生或复制生产资源。\n\n## 2. 第一阶段：锁定设计输入\n\n开始生成前必须明确记录：\n\n- 目标关卡、地图尺寸、主要地形分布和支持的竖屏视口；\n- 每种材质的语义 ID，而不是“绿色块”“棕色块”等临时名称；\n- 使用 `BaseOnlySquare` 还是 `DualGrid`；\n- 哪些现有游戏截图、批准稿或生产色板是视觉权威；\n- 本轮只改哪些关卡，哪些关卡必须保持不变；\n- 不允许改变的玩法数据：路线、种植区、核心、标记、投影、命中和模拟结果。\n\n没有明确目标地图的“通用素材图”不能直接进入生产。地图尺寸和地形分布未知时，只能做风格探索，不能宣称可接入。\n\n### 2.1 表现类型选择\n\n| 类型 | 适合情况 | 核心结构 | 连续性责任 |\n|---|---|---|---|\n| `BaseOnlySquare` | 清楚的棋盘感、每格独立、清爽低噪声地图 | 每个格子只有一个完整基层材质 | 每张图块自身可平铺；相邻格不依赖额外边缘图 |\n| `DualGrid` | 需要有机地貌轮廓、材质覆盖和方向性边界 | 基层 + 可选地貌 + 轮廓 + 可选有向边缘 | 完整 16 Mask、socket、合法邻接和压力图共同负责 |\n\n类型必须写入 canonical map 的视觉格数据或明确的创作配置。禁止由渲染器根据关卡 ID、纹理路径、颜色或缺失资产猜测类型。\n\n## 3. 统一视觉规则\n\n### 3.1 风格基线\n\n- 总体方向为清爽、明亮、卡通、轻手绘，不追求写实材质扫描感。\n- 使用大块面和低频纹理；避免细碎噪点、密集颗粒、尖锐高频划痕和过度锐化。\n- 草地、泥土、石路、水面等必须来自同一套光照方向、明度区间、饱和度逻辑和笔触尺度。\n- 优先与游戏现有奶油纸面、嫩绿操作色和暖黄强调色协调，不孤立追求素材本身的高饱和或强对比。\n- 格线属于地图交互与投影层，不得画进地表纹理。\n- 玩法单位、花盆、路线提示和状态反馈必须比地表更容易识别；地形不能成为第一视觉焦点。\n\n### 3.2 候选差异\n\n一轮风格探索应提供方向差异充分的候选，而不是只改少量色相或纹理随机种子。可拉开的维度包括：\n\n- 笔触概括程度；\n- 色温与明度关系；\n- 纹理密度；\n- 卡通轮廓强弱；\n- 草地与泥土的对比方式。\n\n每个候选必须有稳定版本名和对应提示词。用户选定的方向成为本轮唯一视觉权威；后续拆分和导入不得擅自调色、补纹理或混入未批准候选。\n\n## 4. 游戏内方格预演门禁\n\n风格图之后必须制作“游戏内方格地图版”预演，不能只展示素材表、双瓦片拼图、单格放大图或脱离 UI 的平铺墙。\n\n预演至少满足：\n\n- 使用目标地图的真实行列数、草地/道路分布和格子比例；\n- 使用目标竖屏视口或等价的游戏内页面构图；\n- 显示真实格线、舞台边框以及足以判断层级的 Header/控制区环境；\n- 按游戏内缩放展示，不用局部放大掩盖整体问题；\n- 不绘制会被误拆进图块的单位、文字、网格或装饰；\n- 对比现有 UI 的色温、饱和度和明度，明确检查地图是否“贴进去”而不是“浮出来”。\n\n第一次人工门禁只回答整体方向是否成立。出现以下任一问题就返回风格阶段，不进入正式拆分：\n\n- 纹理太细、太写实或缺少卡通手绘感；\n- 草地与泥土来自不同光照或不同色板；\n- 地图比 UI 更脏、更暗、更艳或更重；\n- 方格节奏断裂、边缘噪声抢眼；\n- 只有单图好看，组合地图不好看。\n\n## 5. 纯方块基层分支\n\n### 5.1 生产结构\n\n- 一个文件只表达一种完整方形地表，不生成左右拼接或“草地＋泥土”双瓦片作为 Runtime 输入。\n- 当前生产基准为 `64×64`、完全不透明、FullRect、64 PPU、Repeat、Bilinear、无 Mipmap、无压缩；规格升级必须形成新版本并重新验收。\n- 草地格直接使用草地基层，泥土格直接使用泥土基层。\n- `LandformSurfaceId`、`ContourStyleId` 和 `EdgeStyleId` 必须为空；纯方块不能偷偷叠加 Dual-Grid 遮罩修边。\n- 每张图块必须独立成立，不能依赖相邻格补齐阴影、边缘、图案或光照。\n\n### 5.2 连续性检查\n\n至少检查：\n\n- 同材质横向、纵向和大面积重复；\n- 草地与泥土交界时是否出现双亮边、双暗边或假立体墙；\n- 四角相接时是否形成明显十字或亮点；\n- 真实地图缩放下是否出现重复花纹、摩尔纹或高频闪烁；\n- 单格边缘像素、wrap、filter 和压缩是否与生产导入契约一致。\n\n纯方块的连续性来自完整基层，不通过生成额外过渡块掩盖问题。基础纹理本身不合格时应回到候选阶段。\n\n## 6. Dual-Grid 分支\n\nDual-Grid 候选同样必须先通过本文的风格方向和游戏内方格预演门禁。其候选 Mask、图集和压力图在批准前全部属于 Evidence，不得因为 16 Mask 已生成就直接导入生产。\n\n获批方向按 [Dual-Grid 地图图块生成技术分支](dual-grid-tile-generation-pipeline.md) 完成：\n\n- A/B 拓扑路线选择；\n- Raw、Normalized、Review256、Runtime64 和 Runtime32 的确定性派生；\n- 完整 `Mask-00..15` 与 socket 验证；\n- 横纵合法邻接穷举、压力图和真实 mismatch 记录；\n- `BrushImport.json`、`TerrainBrushDefinition` 和生产 TileSet 导入。\n\n`seamSafetyClaimed=false` 不能被机械通过、人工喜欢或普通 WebGL 成功自动改写。第二次游戏内门禁仍必须检查最终 Runtime Mask 在真实目标地图中的轮廓连续性。\n\n## 7. 两套表现的兼容约束\n\n- 两套表现共用同一个 canonical battlefield aggregate、`BattlefieldProjection`、玩法格、路线、标记和命中几何，不建立第二套地图坐标源。\n- 一个地图或连通地貌区域必须显式选择表现类型。\n- 同一种 semantic surface 如果共享边或顶点，不得一部分用纯方块基层、一部分用 Dual-Grid landform 表示。\n- 两套表现可以用于不同关卡，或用于彼此断开的地貌区域。\n- Palette 必须按稳定语义 ID 解析；缺失精确材质、轮廓或有向边缘绑定时明确失败，不回退到另一套表现。\n- 不覆盖全局默认 Palette 来试验单关效果。每个获批的关卡视觉变体使用独立 Palette ID，未批准关卡保持原样。\n- Palette 保持完整生产绑定；完整不等于允许回退，运行时仍只使用地图明确请求的绑定。\n\n## 8. 资产隔离与提升\n\n### 8.1 审核资产\n\n以下内容只属于 `Builds/Evidence` 或 `Assets/.../Trials`：\n\n- 风格候选、提示词、模型调用记录和 provenance；\n- 整图预演、比较板和审核标注；\n- 候选切片、临时 Mask、压力图和失败证据；\n- 尚未通过第二次人工门禁的 Unity 试验场景或 Palette。\n\n### 8.2 生产资产\n\n批准后将最终候选确定性地复制或派生到生产目录，并记录：\n\n- 稳定语义 ID、资产路径和 Unity GUID；\n- 源候选与生产文件的 SHA-256；\n- 尺寸、PPU、Filter、Wrap、Compression、MipMap 和 alpha；\n- Palette、TileSet、关卡 Theme 和 Battle 场景的绑定关系。\n\n正式 Battle、发布场景、`Resources` 和可玩目录不得依赖 Trials、提示词、provenance、审核母图或试验 Palette。生产文件不得在提升后继续手工修图；需要修改时创建新候选并重新走完整流程。\n\n## 9. 关卡接入约束\n\n1. 只绑定用户批准的目标关卡；其他关卡保持当前 Palette 和视觉构成。\n2. 视觉格变化不得改变 gameplay fingerprint、路线、植物可放置格、核心、标记、投影、命中或确定性模拟结果。\n3. Theme 通过稳定 Palette ID 选择表现；场景注册所有被发布目录引用的 Palette。\n4. 不在 Presenter 或 renderer 中加入关卡 ID 特判、纹理路径判断、fallback 或迁移兼容层。\n5. 先在单关端到端跑通，再逐关批准和扩展；一次审核不自动授权全局替换。\n\n## 10. 必须完成的验证\n\n### 10.1 机械与编辑器验证\n\n- 源候选、生产图块和 manifest 的 hash/尺寸/alpha 一致性；\n- Unity import 参数、Sprite/GUID、Palette/TileSet 精确绑定；\n- 地图每格视觉覆盖、表现类型兼容和目标格子数量；\n- 目标关卡使用新 Palette，非目标关卡仍使用原 Palette；\n- 正式场景和 Palette 无 Trials 依赖；\n- 玩法 fingerprint、路线、标记、格子能力和确定性结果不变；\n- 变更专属聚焦 Smoke；\n- `FruitDefense.Editor.ProjectSetup.SmokeValidate` 全量 Smoke。\n\n### 10.2 实机视觉验证\n\n- 使用普通发布基线的 WebGL 构建，不以隔离试验构建代替；\n- 从 `Bootstrap → Lobby` 选择目标关卡，再进入真实 `Battle`；\n- 在 402×874 参考视口取证，并按风险补充 360×800、375×812、430×932；\n- 截图必须包含完整地图、Header 和操作区，以便同时判断配色、层级和玩法可读性；\n- 检查缺图、接缝、重复纹理、格线、边缘、单位遮挡、safe area 和 palette 诊断；\n- 保存构建日志、截图路径、SHA-256 和已知平台能力限制。\n\n普通 WebGL 通过只证明共享发布基线；不能据此声称抖音或微信转换成功。\n\n## 11. 失败与返工规则\n\n出现以下情况必须退回对应阶段：\n\n- 方向不协调、纹理太细、不够卡通或不够清爽：回到风格候选；\n- 整图预演不成立：调整配色和笔触后重新预演，不能先拆图再赌组合效果；\n- 候选拆分后出现接缝或拓扑问题：回到候选/拆分阶段，不在生产资源上局部补丁；\n- 实机与批准预演明显不同：检查投影、导入、Palette 和缩放，修正后重新走第二次人工门禁；\n- 玩法 fingerprint 或命中变化：停止发布并修复 canonical map 接入；\n- 只有机械 QA 通过但没有人工批准：保持 Evidence 状态。\n\n禁止通过模糊、加噪、画死格线、增加黑边、静默调色、运行时叠色或 Palette fallback 掩盖问题。\n\n## 12. 当前批准参考\n\n第一关 `orchard-01` 是纯方块基层分支的参考实现：8×7 地图由 35 个 base-only 草地格和 21 个 base-only 泥土格组成，使用独立 `palette.orchard-01.square-grid`，第二、三关继续使用原默认 Palette。\n\n正式资源位于：\n\n```text\nAssets/Battlefield/Terrain/Orchard01SquareGrid/\n```\n\n具体实现与验收合同见：\n\n```text\nopenspec/changes/archive/2026-08-31-apply-square-terrain-to-first-level/\n```\n\n该参考锁定的是流程、表现结构和批准后的生产像素，不授权后续关卡直接复制第一关配色。每个新主题仍需重新完成游戏内预演和两次人工门禁。\n"},{"path":"docs/art/whole-map-visual-refinement-pipeline.md","title":"AI 整图地图精修与 Unity 接入管线","id":"whole-map-visual-refinement-pipeline","parent":"design-kb-home","order":56,"status":"active","source":"---\nid: whole-map-visual-refinement-pipeline\nparent: design-kb-home\norder: 56\nstatus: active\n---\n\n# AI 整图地图精修与 Unity 接入管线\n\n本文定义完整地图视觉底图的生成、审核和 Unity 接入契约。它与 Dual-Grid 图块生成是两条独立管线：整图候选只替换视觉绘制，不生成 Mask，不拥有玩法拓扑，也不能反向修改路线、碰撞、种植合法性、点位或战斗模拟。\n\n当前仓库没有通用的整图生成/绑定自动化入口。本文先作为后续实现必须遵守的正式契约；任何整图候选要进入生产资源，必须通过独立 OpenSpec 变更实现参数化工具、绑定、回滚和 Play Mode 验收。普通图片生成或静态绑定不能冒充已实装。\n\n## 1. 权威边界\n\n整图视觉不得拥有或推导以下数据：\n\n- `mapId`、逻辑网格尺寸和地图版本；\n- 怪物路线、刷怪点、路线目标和核心；\n- 种植能力、碰撞、道具或触发点；\n- 战斗随机种子、内容版本、快照和模拟结果。\n\n这些信息继续由版本化地图聚合、玩法拓扑、路线和点位数据拥有。整图只消费已发布地图的投影视觉参考。视觉拒绝只能否决候选，不得通过移动玩法数据迁就图片。\n\n## 2. 版本化工作包\n\n每个候选使用独立目录：\n\n```text\nBuilds/Evidence/whole-map-runs/\u003cdate>-\u003cmapId>-\u003ccandidate>/\n  source/\n    RoughMap.png\n    rough-map-manifest.json\n  request/\n    pipeline-prompt.txt\n    model-call.json\n  model/\n    Raw.png\n    Runtime.png\n  integration/\n    candidate-manifest.json\n    unity-import.json\n    runtime-hit.json\n  evidence/\n    mechanical-qa.json\n    visual-review.json\n    ready.json\n```\n\n不得覆盖已审核或待审核候选。失败重试创建 sibling run，并保留失败的 prompt、调用记录和 Raw。\n\n## 3. 从真实地图生成粗图\n\n粗图必须由当前版本化地图、正式方格投影和选定表现主题生成，不能用手画参考替代。`rough-map-manifest.json` 至少记录：\n\n```text\nmapId\nmapVersion\nlogicalGridWidth / logicalGridHeight\ncellPixels\noutputWidth / outputHeight\ngameplayFingerprint\nroute / spawn / goal / core identifiers\nterrain theme or palette identity\nall protected gameplay source hashes\nrough path / hash / decoded-pixel hash\nopaque pixel count\nvisualInspectionPerformed\n```\n\n粗图必须可解码、全不透明、无额外边框，并与地图画布宽高比严格一致。地图数据、主题或投影发生变化时必须生成新候选，不能刷新旧 manifest 接受变化。\n\n## 4. 模型桥接\n\n模型输入角色固定为：真实地图渲染得到的精确结构参考。提示词至少约束：\n\n```text\nUse case: sketch-to-render\nAsset type: whole-map terrain artwork for a Unity tower-defense board\nPreserve: full canvas aspect ratio, orthographic top-down camera, exact logical-grid\nregistration, route silhouette, terrain-region boundaries, every corner and turn\nChange only: terrain surface style\nAvoid: crop, padding, border, transparency, perspective drift, moved or added paths,\nUI, text, labels, watermark, characters, enemies, towers, plants, pots, buildings,\nprops, obstacles, spawn/core icons and route arrows\nOutput: one fully opaque edge-to-edge image and no explanation\n```\n\n风格描述只能补充颜色、形状、材质和细节密度，不能放松结构契约。使用知名作品描述方向时，应拆成通用视觉特征并要求原创，不复制角色、Logo、UI 或具体素材。\n\n`model-call.json` 必须记录真实工具、模式、use case、input/prompt/raw 路径与 hash、一次调用、重试、fallback、原始尺寸、alpha、执行时间和视觉检查状态。模型失败、Raw 不可解码或存在非预期透明时停止；不得用粗图、旧候选或脚本输出冒充 Raw。\n\n## 5. Raw 与 Runtime\n\nRaw 原样保存。Runtime 只能对整张图执行一次明确的尺寸归一化：\n\n1. 保持完整画布，不裁剪、不补边；\n2. 不做局部对齐、拓扑修补、调色或重绘；\n3. 普通连续色整图默认使用高质量 bilinear；像素风候选必须在 profile 中显式改为 Point；\n4. 输出尺寸由 `logicalGrid × cellPixels` 唯一得到；\n5. manifest 记录算法、Raw/Runtime 尺寸、hash 和解码像素 hash；\n6. 机械 QA 从 Raw 独立重算 Runtime 并逐像素比较。\n\n整图管线的缩放规则与 Dual-Grid Runtime32 中心采样不同，二者不得共用默认插值方式。\n\n## 6. Unity 导入契约\n\n连续色整图的默认导入设置：\n\n| 设置 | 默认值 |\n|---|---|\n| Texture Type | Default |\n| sRGB | true |\n| Alpha Source | None |\n| Alpha Is Transparency | false |\n| Mip Maps | disabled |\n| Filter Mode | Bilinear |\n| Wrap Mode | Clamp |\n| Compression | Uncompressed |\n| NPOT Scale | None |\n| Max Size | 不小于 Runtime 最大边 |\n\n像素风整图可以使用 Point，但必须在候选 profile 和 `unity-import.json` 中明确记录。导入后记录 Texture GUID、资产路径和实际 importer 设置。文件存在不等于 Unity 引用了正确 GUID。\n\n## 7. 按地图绑定\n\n绑定必须是显式、版本化且可回滚的：\n\n```text\nmapId -> presentation theme/palette -> whole-map Texture2D -> enabled\n```\n\n要求：\n\n- 一个绑定只服务一个明确 `mapId` 和地图版本；\n- 找不到绑定时回退正式 TileSet 表现，不改变玩法；\n- 多 palette 场景不得选择“任意第一个”候选；\n- 正式 `Bootstrap → Lobby → Battle → Settlement` 与本地直接 Battle 验收必须明确区分；\n- 直接 Battle fallback 只能存在于明确的本地开发模式；\n- 禁用整图绑定即可非破坏性回滚到 TileSet。\n\n当前仓库尚未提供这一通用绑定层。未来实现时必须放在稳定的 `Assets/Editor/Tools` 工作流中，并在 `Assets/Editor/Tests` 增加自动验证。\n\n## 8. 运行时命中证明\n\n静态引用通过不能证明玩家看到了目标图片。Play Mode 必须记录并核对：\n\n```text\nmapId\nmapVersion\ntheme/palette id\nselected texture asset path and GUID\nselected texture name and dimensions\nruntime draw branch\ngameplayFingerprint before/after\n```\n\n以下情况都不能判为已实装：\n\n- 只有绑定成功，没有 Runtime draw hit；\n- 命中旧纹理、旧程序集或 TileSet fallback；\n- 在 Scene 视图、错误 Unity 进程或错误地图中检查；\n- gameplay fingerprint、路线、碰撞或种植规则发生变化；\n- 只完成普通 WebGL 构建，没有目标平台自己的转换和设备证据。\n\n## 9. 人工视觉验收\n\n人工在实际 Game 视图检查：\n\n1. 道路、草地、土壤、水面等区域是否与玩法地图一致；\n2. 转角、边缘和交界是否出现模型漂移；\n3. 是否出现意外文字、UI、角色、塔、防御物或新增路径；\n4. Runtime 缩放是否造成拉伸、模糊或形变；\n5. 交互提示是否仍对应逻辑格；\n6. 风格是否达到候选目标。\n\n视觉审核结果写入独立 `visual-review.json`。智能体被要求不看图时只能进行机械验证，必须记录 `visualInspectionPerformed=false` 并把图片直接交给人工。\n\n## 10. 机械验收\n\n| 阶段 | 必须满足 |\n|---|---|\n| Rough | 来自真实地图；尺寸、alpha、fingerprint、受保护 hash 完整 |\n| Model call | input/prompt/raw 路径与 hash 一致；调用、重试、fallback 真实 |\n| Raw | 原样保留、可解码、alpha 契约成立 |\n| Runtime | 仅整图缩放，可从 Raw 逐像素重建 |\n| Unity Import | GUID 和实际 importer 设置与 manifest 一致 |\n| Binding | mapId、地图版本、主题和目标 Texture2D 精确匹配 |\n| Gameplay | fingerprint、路线、碰撞、种植和模拟不变 |\n| Play Mode | 目标纹理的 Runtime draw hit 已记录 |\n| Visual | 由人工审核，不由尺寸或 hash 替代 |\n\n## 11. 诊断顺序\n\n| 现象 | 优先检查 |\n|---|---|\n| 仍显示旧地貌 | Runtime draw hit、主题解析、绑定是否 enabled |\n| 静态绑定通过但画面不变 | 命中的纹理名、GUID、程序集和 Unity 进程 |\n| 图片与交互格错位 | 投影画布、宽高比、grid size、cellPixels；不要改碰撞迁就图片 |\n| AI 移动道路或边界 | 人工拒绝候选，新建 sibling run |\n| Raw 尺寸不同 | 保留 Raw，按 profile 整图归一化 |\n| 模型调用失败 | 保留失败，不得回填粗图或旧图 |\n| 整图覆盖了交互提示 | 调整表现层绘制顺序，不改变玩法判定 |\n\n## 12. 回滚\n\n首选非破坏性回滚：\n\n1. 禁用当前 mapId 的整图绑定；\n2. 保留 Rough、prompt、model-call、Raw、Runtime、manifest 和审核记录；\n3. 重新加载资产并进入 Play Mode；\n4. 确认命中正式 TileSet fallback；\n5. 重跑地图、战斗和发布前 smoke。\n\n回滚不得修改玩法地图、路线、关卡目录或碰撞数据。\n\n## 13. 实现门禁\n\n要把本契约变成可用生产工具，独立变更至少需要实现：\n\n- mapId、grid size、cellPixels、输出目录、候选名和 palette 的 profile；\n- 从正式地图生成 Rough 和 gameplay fingerprint；\n- Raw → Runtime 共用归一化及独立验证；\n- candidate/integration manifest schema；\n- 精确 mapId/palette/Texture2D 绑定与启用/禁用；\n- direct-Battle 本地模式边界；\n- Play Mode 目标纹理命中测试；\n- 无损回滚和正式 TileSet fallback；\n- 人工视觉审核门禁。\n\n这些能力完成前，整图候选只能作为 Evidence，不得写入发布 palette 或被宣称为当前运行时能力。\n"},{"path":"docs/build-and-release-pipelines.md","title":"Local build and online release pipelines","id":"build-and-release-pipelines","parent":"design-kb-home","order":40,"status":"active","source":"---\nid: build-and-release-pipelines\nparent: design-kb-home\norder: 40\nstatus: active\n---\n\n# Local build and online release pipelines\n\nThe repository exposes two operator pipelines. They are local PowerShell entry points today and are intentionally shaped so a later GitHub Actions runner can call the same commands without duplicating build logic.\n\n## 1. Local build pipeline\n\nEntry point: `scripts/build-local.ps1`\n\nThe local pipeline checks Unity `6000.3.19f1`, requested build modules, and exclusive Unity project access. It runs the unified P0 release gate once, then builds the selected targets sequentially.\n\n```powershell\n# WebGL only\npowershell -ExecutionPolicy Bypass -File .\\scripts\\build-local.ps1 -Target Web\n\n# Windows PC only\npowershell -ExecutionPolicy Bypass -File .\\scripts\\build-local.ps1 -Target PC\n\n# WebGL and Windows PC\npowershell -ExecutionPolicy Bypass -File .\\scripts\\build-local.ps1 -Target All\n```\n\nGenerated outputs:\n\n| Output | Purpose |\n|---|---|\n| `Builds/WebGL/` | Ordinary WebGL artifact |\n| `Builds/Windows/` | Local Windows preview artifact |\n| `Logs/pipeline-local-p0.log` | Unified P0 gate log |\n| `Logs/pipeline-local-web-first.log` | First deterministic WebGL verification build log |\n| `Logs/pipeline-local-web.log` | Second deterministic WebGL build log for the retained candidate |\n| `Logs/pipeline-local-pc.log` | Windows build log |\n| `Builds/Pipeline/local-build-manifest.json` | Revision, dirty state, target, size, per-payload WebGL full hashes/versions/lengths, two-build comparison, duration, and log evidence |\n\nLocal preview builds may use uncommitted source. The manifest records `dirtyBeforeBuild`; this evidence is deliberately rejected by the online pipeline.\n\nSuccess marker:\n\n```text\nFRUIT_DEFENSE_LOCAL_BUILD_PIPELINE_OK\n```\n\n## 2. Online WebGL publication pipeline\n\nEntry point: `scripts/publish-online.ps1`\n\n### Release source of truth\n\nServer publication is performed only from the `oper` branch and its dedicated\nworktree, `E:\\project\\unity\\furitDefense-oper`. `main` remains the development\nline. The publisher hard-codes this release branch and accepts no branch\noverride for `-Execute`.\n\nTo prepare a release, commit the approved source on `main`, deliberately\npromote the selected commit(s) to `oper`, and build, accept, and publish only\nfrom the clean `oper` worktree. Tag the resulting `oper` commit after a\nsuccessful publication. Do not copy selected project folders between the two\nworktrees: Git checkout supplies the complete versioned Unity project,\nincluding `.meta`, `Packages`, and `ProjectSettings`.\n\nRunning the entry without `-Execute` is a non-publishing plan. It prints the resolved target and gates but does not require the SSH key, connect to the server, upload files, or change the remote service.\n\n```powershell\n# Safe plan only; no network or server mutation\npowershell -ExecutionPolicy Bypass -File .\\scripts\\publish-online.ps1\n```\n\nPlan success marker:\n\n```text\nFRUIT_DEFENSE_ONLINE_PUBLISH_PLAN_OK\n```\n\nActual publication requires explicit authorization and all of these conditions:\n\n- current branch is `oper` (the required release branch is not configurable);\n- working tree is clean;\n- SSH private key exists at `-KeyPath`;\n- a P0-validated Web build manifest matches the current commit;\n- the current `Builds/WebGL/index.html` hash matches that manifest.\n\n```powershell\n# Build a fresh Web artifact, validate it, then publish\npowershell -ExecutionPolicy Bypass -File .\\scripts\\publish-online.ps1 `\n  -Execute `\n  -KeyPath \"$HOME\\.ssh\\id_ed25519\"\n\n# Reuse an existing Web artifact only when its manifest matches exactly\npowershell -ExecutionPolicy Bypass -File .\\scripts\\publish-online.ps1 `\n  -Execute `\n  -SkipBuild `\n  -KeyPath \"$HOME\\.ssh\\id_ed25519\"\n```\n\nAfter the source/artifact gates pass, the pipeline delegates to `deploy.ps1 -SkipBuild`. That workflow remains responsible for local portrait acceptance, seeding the current public release into a persistent browser profile, archive/upload, remote service replacement, entry health, WebGL delivery headers, service status, and deployed acceptance. Local acceptance still performs a cold launch followed by a same-profile warm reload. Deployment opens release N before replacement and release N+1 after replacement in the same browser profile; publication fails if an unchanged advertised payload body is downloaded again. Candidate acceptance then repeats a same-release warm reload for the new release.\n\nWebGL payloads use independent SHA-256-derived versions. The production build suppresses Unity's per-build unique identifier, and the local pipeline builds WebGL twice; all four full payload hashes and byte lengths must match before the second output becomes publishable. Unchanged loader, data, framework, or WebAssembly bytes therefore retain their cache key when a different payload changes. The static service grants immutable caching only when the requested version matches the served content and emits a strong content-hash ETag.\n\nLocal and online pipeline manifests use schema version 3. Local evidence stores the four complete payload records plus the deterministic comparison. Online evidence classifies payload roles as reused or changed and records expected and observed release-transition download bytes. Older manifest schemas must be rebuilt rather than reused.\n\nSuccessful publication writes `Builds/Pipeline/online-publish-manifest.json` and emits:\n\n```text\nFRUIT_DEFENSE_ONLINE_PUBLISH_OK\n```\n\n## Safety and platform boundary\n\n- Generated builds, logs, and manifests remain under ignored `Builds/` and `Logs/` directories.\n- Only the online entry's explicit `-Execute` path can reach `deploy.ps1`.\n- This workflow publishes ordinary WebGL only. It does not convert, upload, authorize, or claim support for Douyin or WeChat mini games.\n- A later CI service should invoke these scripts rather than reimplement Unity commands. Use one concurrent Unity job per project workspace.\n"},{"path":"docs/design-kb-home.md","title":"FruitDefense Design KB","id":"design-kb-home","parent":"","order":0,"status":"active","source":"---\nid: design-kb-home\nparent:\norder: 0\nstatus: active\n---\n\n# FruitDefense Design KB\n\n本页只负责 Design KB 导航。项目事实仍由各自的规范文档维护，避免重复来源。\n\n## 策划方向\n\n- [游戏策划总纲](design/game-design-overview.md)\n\n## 发布基线与工程流程\n\n- [P0 发布基线](p0-release-baseline.md)\n- [P1 首波门禁](p1-first-wave-gate.md)\n- [本地构建与在线发布流程](build-and-release-pipelines.md)\n\n## 美术生产管线\n\n- [地图图块统一生产管线](art/map-tile-production-pipeline.md)\n- [Dual-Grid 地图图块生成技术分支](art/dual-grid-tile-generation-pipeline.md)\n- [AI 整图地图精修与 Unity 接入管线](art/whole-map-visual-refinement-pipeline.md)\n\n## 平台证据\n\n- [抖音兼容性门禁](platform/douyin-spike-status.md)\n- [抖音官方资料](platform/douyin-official-references.md)\n- [微信兼容性门禁](platform/wechat-spike-status.md)\n- [微信官方资料](platform/wechat-official-references.md)\n\n## 其他规范入口\n\n- `README.md`：项目打开、试玩、工程入口和文档导航。\n- `openspec/changes/`：具体变更的提案、设计、需求和任务。\n- `openspec/specs/`：已落地能力的当前规范。\n"},{"path":"docs/design/game-design-overview.md","title":"FruitDefense 游戏策划总纲","id":"game-design-overview","parent":"design-kb-home","order":10,"status":"active","source":"---\nid: game-design-overview\nparent: design-kb-home\norder: 10\nstatus: active\n---\n\n# FruitDefense 游戏策划总纲\n\n本文描述 FruitDefense 要做成什么，以及各系统之间长期稳定的设计关系。它不记录构建哈希、SDK 安装状态、逐项验收日志或某次实现的任务进度。\n\n## 0. 首要实现约束\n\n- **已定**：面向策划、美术日常使用的 Unity 编辑器工具、自动化验收代码和一次性诊断工具必须明确分层。实际工具只暴露稳定工作流；自动化验收放在独立测试目录和统一验证入口；一次性 runner、临时导入器与任务专用调试菜单在验收完成后必须删除，不得长期混入实际工具。\n- **已定**：测试夹具、验收关卡和诊断生成物不得进入生产 `Resources`、正式关卡目录、发布清单或 release scene。测试只能从 Editor 测试目录显式加载或注入，且不得改变 Lobby 的正式可玩内容、运行时回退规则或发布结果。\n\n## 文档状态标记\n\n- **已定**：已经形成明确方向，后续需求默认遵守。\n- **方向**：当前认可的产品方向，细节仍需通过后续策划或 OpenSpec 变更确定。\n- **当前基线**：已经存在的玩法或结构，但不自动等于永久设计。\n- **待定**：尚未做出策划决定，不能由当前实现反推结论。\n\n## 1. 游戏定位\n\n- **已定**：竖屏、轻量、单人 PVE 水果塔防。\n- **已定**：核心操作围绕刷新水果、花盆种植、阵型调整、同类合成和装备组合展开。\n- **已定**：发布平台顺序为抖音小游戏优先，微信小游戏后续；普通 WebGL 是共同构建与验收基线，不代表任一小游戏平台已经适配完成。\n- **方向**：让玩家用较少的操作完成连续而有反馈的构筑选择，并能快速理解一次失败来自阵容、站位、资源还是波次压力。\n- **待定**：目标用户画像、目标单局时长、单日推荐局数和正式难度曲线。\n\n## 2. 核心体验支柱\n\n### 2.1 构筑选择清晰\n\n水果定位、星级、装备效果、花盆状态和可放置目标必须在竖屏空间中可辨认。玩家应该知道一次操作会种植、移动、交换、合成、安装装备还是扩建花盆。\n\n### 2.2 组合有变化但边界明确\n\n水果提供基础战斗角色，装备修改或补充能力，星级放大已有价值。组合系统允许内容扩展，但不依赖任意脚本、无限嵌套效果或玩家无法预判的隐藏规则。\n\n### 2.3 战斗节奏可控\n\n玩家能主动开始波次，并通过暂停和倍速控制观察与推进节奏。波次之间应留出处理阵容、奖励和下一波准备的清晰窗口。\n\n### 2.4 结果可复盘\n\n相同会话输入、随机种子和内容版本应产生可复现的战斗结果。表现可以丰富，但不能反向改变战斗规则。\n\n### 2.5 战斗反馈可信\n\n- **已定**：攻击蓄力、释放、弹道、接触、受击与击杀反馈必须围绕真实战斗时点组织；不能在伤害已经结算后再播放看似决定伤害的落地或命中动作。\n- **已定**：普通受击闪白、挤压、后坐、飘字、震动和音效属于表现，不得默认改变敌人移动、目标选择或伤害结果。冻结、眩晕、击退等会改变战斗结果的控制必须作为明确、可验证的玩法效果单独配置。\n- **方向**：轻击、重击、范围攻击、持续伤害、控制触发和击杀形成可区分但不过载的反馈层级；倍速和高密度战斗下允许表现层合并、限流或降低低优先级反馈，但不能丢失战斗规则事件。\n- **已定**：战斗飘字使用有限的普通伤害、重击、持续伤害、资源、控制和击败语义角色。角色统一决定正式字体、最小字号、填充与描边、接触回弹、停留、上浮、渐隐和密度优先级；具体技能不得自行硬编码字体、颜色或另一套运动语言。\n- **已定**：飘字颜色不是唯一语义线索，正负号、短文案、字号和节奏必须在弱化色相后仍能区分伤害、资源、控制和击败。最终可读性以 402×874 普通 WebGL 在草地、路线和密集特效上的实际光栅为准，不以名义字号或编辑器预览代替。\n- **已定**：飘字合并资格服从权威逻辑时点，动画生命周期属于本地表现时间；暂停冻结表现，2 倍速仍保留最低真实阅读时间。高密度战斗先通过同目标合并、同技能同逻辑帧至多三条伤害轨道、普通信息预算、优先级替换和有限错层控制展示量，不通过无限增加同屏记录或简单把动画加速一倍处理；致死伤害不重复跳数，同帧击败合并为数量短句，并占用独立于三条伤害轨道的紧凑终结展示带。\n- **已定**：飘字以命中或击败事件坐标为权威锚点，活目标只在短接触阶段跟随，随后脱离并进入紧凑错层和上浮；合并不得重新开始跟随，多目标同帧击败使用事件位置质心。锚点、错层和回弹只属于表现，不得回写目标位置、碰撞或命中判定。\n- **已定**：飘字使用由项目正式中文字体与有限字形清单在编辑器中通过 SDF 确定性烘焙出的单张静态 RGBA 图集；实心填充、连续中性描边和缩放质量在离线烘焙时定型，高频短文案允许作为同图集内的有限组合词元以降低割草场景提交数。运行时只按语义角色统一着色和绘制，不得扩图、使用系统字体回退、创建逐条材质或引入第二套字体渲染路径。真实 WebGL 的最终光栅质量与帧时、稳态分配同为门槛。\n- **已定**：全局震屏只服务于经过审核的重击、密集击败聚合和终局级事件。普通伤害、持续伤害、资源、常规状态和单个普通敌人击败依靠局部闪白、挤压、后坐、特效与跳字反馈；多个震屏请求不得叠加，只保留一个有冷却、可被更高语义优先级替换的低振荡节拍，暂停冻结且 2 倍速不得成倍提高真实时间内的震屏密度。\n\n## 3. 游戏循环\n\n### 3.1 目标大循环\n\n`大厅 → 关卡/局前准备 → 波次战斗 → 结算 → 成长与内容解锁 → 再次挑战`\n\n- **当前基线**：大厅提供三张可选关卡卡片；战斗完成后进入结算，结算显示本局关卡，并在返回大厅或重试时保留该关卡身份。\n- **方向**：关卡选择、局前准备和成长系统逐步接入这个循环，不绕过大厅直接堆进战斗界面。\n- **待定**：长期成长如何影响局内、是否存在局前携带物、失败是否提供收益，以及内容解锁的主要节奏。\n\n### 3.2 单局循环\n\n`获取/刷新资源 → 选择水果 → 种植与调整 → 配置装备 → 开始波次 → 获得波次反馈或奖励 → 下一轮准备`\n\n当前操作包括刷新五株水果、花盆种植、水果移动、占用位置交换、同种同星合成、装备安装和花盆扩建。水果拖入已被占用的花盆或刷新栏槽位时，同种同星且未达到最高星级的组合优先合成，其他组合直接交换双方位置并保留各自身份、星级和装备；战斗期交换要求双方都通过移动冷却检查。未来增加的新操作必须说明它发生在准备期、战斗期还是结算期，避免同一动作跨越多个阶段产生歧义。\n\n## 4. 战斗策划\n\n### 4.1 当前基础内容\n\n- 五种水果：豌豆、西瓜、香蕉、榴莲和向日葵，分别覆盖单体、范围、穿透、近战范围和资源生产定位。\n- 四类敌人：普通、快速、装甲和首领，用于形成速度、耐久和波次压力差异。\n- 三种装备：机枪、冰块和辣椒，通过兼容关系、附加技能或技能修改形成组合。\n- 三套首批可选关卡组合：`orchard-01` 是 15 波 U 形教学关，`orchard-02` 是强调快速与装甲敌人的 S 形覆盖关，`orchard-03` 是以首领终局压力为重点的短核心走廊关。\n- 每套关卡分别组合地图、波次、规则和表现主题；生命、阳光、波间准备、暂停、倍速和阶段奖励由所选关卡规则明确提供。\n- 花盆既是种植位置，也是局内扩建资源；水果可以在刷新栏与花盆之间移动、交换或合成，满足合成条件时合成优先于交换。\n\n这些数量是当前内容基线，不是长期内容上限。新增水果、敌人、装备和波次必须通过版本化内容定义进入，并保持已有稳定 ID 的兼容性。\n\n### 4.2 组合边界\n\n- 水果负责基础角色与主要技能。\n- 水果、装备和敌人的主动、周期与事件反应能力统一使用有限 Ability 定义；装备只能授予已支持的 Ability，或按经过验证的稳定 ID、标签和有限属性修改明确目标，不维护独立的技能与被动执行体系。\n- Ability 的激活、拥有者条件、目标、释放时序、投递方式和结果效果必须是有限、可验证且确定性的集合；配置不得执行任意脚本或构造无限嵌套效果图。\n- 攻击蓄力、释放和恢复使用固定逻辑步时序。会影响结果的伤害、状态和资源必须在权威释放或命中时点结算；表现层不得通过延迟动画伪造另一个接触时点。\n- 表现层只消费技能阶段、投射物命中、伤害结算、状态变化、资源与击杀等语义战斗事件，不拥有伤害、目标选择、控制、资源或胜负规则，也不得把特效种类、素材、颜色、音效和震动参数写回战斗状态。\n- 新机制如果需要新的执行规则，应先通过独立 OpenSpec 变更定义边界和验收，不能用内容配置绕过规则审查。\n\n### 4.3 关卡差异与待定战斗问题\n\n- **已定**：关卡以稳定的 `levelId` 组合独立的地图、波次集、规则集和表现主题；战斗开始后固定整套组合身份，不允许静默回退到默认关卡。\n- **已定**：地图是一个版本化聚合，内部分离三类职责：表现布局只描述语义地表与视觉标识，玩法拓扑描述地块能力、碰撞通道和有序路线，点位层描述刷怪、路线目标、核心、初始花盆候选、道具和触发位置。三类数据可以共用格子坐标，但不能互相替代或反向推导玩法规则。\n- **已定**：地块玩法能力允许有限、可验证的组合，不再用一个互斥角色同时表达种植、通行、碰撞和特殊地点；碰撞是确定性的格子规则，不以 Unity 物理、Tilemap 图形或地表图片作为战斗权威。\n- **已定**：地图路线以具有稳定 ID 的连续有序格子定义，入口和出口由路线首尾得到；刷怪点、路线目标和核心使用具有稳定 ID 的类型化点位表达。路线、点位、核心、花盆和单位都按同一方格投影，不能使用一张长路线图随屏幕拉伸，也不能维护第二套独立坐标。\n- **已定**：地图表现保存草地、泥土、石板等语义地表，表现主题再把语义地表解析为具体 Dual-Grid 图块与底图；表现变化不改变种植合法性、怪物路线、碰撞或确定性结果，具体图块掩码由地表布局自动推导。\n- **已定**：可玩地图必须通过正式关卡地图编辑器维护同一个有界、版本化地图聚合；玩法拓扑、路线与点位、地貌表现虽然分工作区编辑，但共享同一格子坐标和 `mapId`，不能由地貌素材、Tilemap 图形或独立演示板代替可玩地图数据。\n- **已定**：地图制作采用“玩法拓扑 → 路线与点位 → 地貌表现 → 完整校验 → 实战预览 → 发布”的顺序。表现层可以显式读取玩法拓扑生成可撤销的推荐外观，但表现结果不得反向成为玩法授权。\n- **当前基线**：战斗运行时支持单位绑定稳定命名路线，并允许同一地图中的多条路线按同一格子投影并行执行；首批三张正式地图仍各使用一条主怪物路线、一个刷怪点、一个路线目标和一个核心。首个多路线消费者是仅限编辑器与 Development Build 的八路 GM 压力测试关，不属于正式关卡、成长或结算内容，也不代表已授权制作玩家可玩的多路线关卡。可种植区域显示草地、怪物路线显示石板、其余区域显示泥土；运行时道具刷新和触发器行为仍需独立变更授权。\n\n- 一局的目标时长与每波目标时长。\n- 刷新、覆盖、合成和扩建的资源压力如何分配。\n- 首领波、精英敌人和特殊事件在一局中的密度。\n- 胜利、失败、中途退出和重试分别产生什么结算结果。\n\n## 5. 大厅、结算与长期系统\n\n- **当前基线**：大厅可选择 `orchard-01`、`orchard-02` 和 `orchard-03`，选择会保存到本地资料；成长和设置仍以明确的未开放状态出现。结算展示完成关卡、结果、到达波次和剩余生命，并提供返回与原关重试。\n- **方向**：大厅是关卡、成长、设置和未来活动的统一入口；未实现的入口必须明确锁定，不能伪装成可用按钮。\n- **方向**：结算是局内结果与局外成长之间的唯一交接面，奖励和失败收益不应在离开战斗前被多个系统重复提交。\n- **待定**：三关之后的长期关卡组织结构、长期养成维度、货币种类、失败收益、每日/周期活动和内容投放节奏。\n\n## 6. 内容生产与版本边界\n\n- 使用 ScriptableObject 作为当前编辑入口，并导出为确定性的版本化内容数据。\n- 水果、敌人、装备、技能、波次和奖励，以及关卡、地图、波次集、规则集和主题都使用语义稳定 ID；显示名称、枚举顺序或 Unity 资源 GUID 不作为运行时身份。\n- 主动、周期和事件反应能力共用同一版本化 Ability 内容模型；投递与结果载荷分别描述效果如何到达目标和命中后发生什么，不以视觉 Cue 充当玩法效果。\n- 战斗表现目录按 Ability、投射物、状态和击杀等稳定玩法身份映射独立反馈配置。生产内容可能产生的反馈必须有明确配置或明确的无反馈策略，不允许因为映射缺失而静默套用通用特效。\n- 地图中的语义地表、路线、点位和点位分组使用稳定 ID；地图仍以一个聚合内容单元管理三类职责，不拆成彼此可独立漂移的多份运行时真相。\n- 内容导出必须先验证引用、兼容关系和机制类型，再生成规范化结果。\n- 地图编译必须验证表现与玩法网格覆盖、能力与碰撞类型、路线连续性、点位引用、同格组合和当前玩法支持范围；内容只能选择有限的已审核类型，不能通过自由属性或任意脚本自行发明执行机制。\n- 玩法地图身份只包含会影响战斗的地块能力、碰撞、路线和点位；语义地表、表现主题、图块与其他纯视觉信息单独归入表现身份，纯视觉调整不得改变战斗快照、确定性校验或结果。\n- 单局从开始到结算固定会话 ID、随机种子、内容版本和完整关卡组合身份，不能在战斗中静默切换内容。\n- 远程内容可以在后续版本替换目录或资源包，但不能成为任意运行时代码热替换通道。\n- 编辑器版本、SDK 版本、构建哈希和当前产物大小属于发布证据，不属于策划总纲。\n\n### 6.1 地图制作与发布流程\n\n- **已定**：地图制作拆分为两个边界明确的工具。地貌素材实验室只维护底图、透明地貌、定向精修边缘和 Dual-Grid Mask 等美术与渲染素材，不生成可玩关卡，也不作为地图可发布的证据；关卡地图编辑器是制作可玩地图的正式入口。\n- **已定**：关卡地图编辑器在同一有界俯视画布上提供玩法格、路线与类型化点位、地貌表现、校验与发布工作区。日常制作只暴露有限且已审核的能力、碰撞、语义地表、边缘样式和点位类型，不要求策划直接操作原始 TileSet、Mask 或第二套坐标。\n- **已定**：允许保存校验未通过的地图草稿，以便继续编辑；但网格覆盖不完整、数据越界、路线不连续、必需点位缺失、同格组合冲突、稳定 ID 重复、模板引用无效或正式地貌材质缺失时，必须阻止发布和正式实战预览，并把问题定位到具体格子、点位或引用。\n- **已定**：正式发布集合由独立发布清单统一授权，清单负责发布顺序、稳定 `levelId`、模板关卡和地图之间的绑定。运行时目录只能由发布清单全量、确定性重建，不允许手工编辑生成物，也不允许从生成物反向恢复或覆盖创作数据。\n- **已定**：正式 Playtest 必须先完成发布清单重建、资源保存与重新加载，再按稳定 `levelId` 进入正常 `Bootstrap → Battle → Settlement` 流程。临时内存预览、地貌验收板或绕过关卡目录的演示场景不能替代正式实战验收。\n- **已定**：编辑器预览与 Battle 使用同一地图编译结果、方格投影和正式地貌材质解析规则；无需修改代码即可完成一张新地图的创建、校验、发布和实战，是关卡地图编辑能力的最低完成标准。\n\n具体内容契约见 `openspec/changes/archive/2026-07-20-establish-versioned-battle-content-catalog/design.md`、`openspec/changes/archive/2026-07-20-introduce-composable-battle-skills/design.md`、`openspec/changes/archive/2026-07-16-refactor-battlefield-route-to-tile-grid/design.md`、`openspec/changes/archive/2026-07-16-introduce-level-map-catalog/design.md`、`openspec/changes/archive/2026-07-23-separate-battlefield-visual-topology-and-markers/design.md` 和 `openspec/changes/build-canonical-battlefield-map-editor/design.md`。\n\n## 7. 版本方向\n\n### P0：完整基础闭环\n\n形成可重复验证的 `Bootstrap → Lobby → Battle → Settlement` 流程，完成确定性战斗、版本化内容、本地轻量资料、战斗快照契约和 WebGL 竖屏验收。P0 的实时完成状态以 [P0 发布基线](../p0-release-baseline.md) 为准。\n\n### P1：平台与交付能力\n\n先证明抖音小游戏的导出、转换、模拟器、真机、生命周期、资源交付和稳定性，再进入正式运行时适配；微信小游戏在抖音路径稳定后推进。账户、云端资料、远程内容和代码包更新只有在相应门禁通过后才能立项。实时状态见 [P1 首波门禁](../p1-first-wave-gate.md) 和 [平台验证文档](../platform/)。\n\n### 后续：成长、经济与运营内容\n\n在单局目标、关卡结构、失败收益和长期成长完成策划决策后，再拆分成长、经济、活动、商业化和内容投放变更。此阶段不预设具体货币、付费点或活动模板。\n\n## 8. 当前阶段排除项与长期架构边界\n\n### 当前阶段不做\n\n- 支付、广告、分享和商业化投放。\n- 完整局外经济、长期成长和活动运营。\n- 生产账号体系、云端资料和正式后端服务。\n- 未通过兼容门禁的平台 SDK、上传或生产发布。\n- 自动恢复进行中的战斗。\n\n这些是阶段性范围，不代表产品永远排除。若要纳入，应先补齐策划目标和独立 OpenSpec 变更。\n\n### 长期架构边界\n\n- 不允许任意运行时代码热替换或以内容配置执行未审核代码。\n- 小游戏平台适配器不可静默回退为普通 Web 适配器。\n- 核心战斗规则不直接依赖抖音、微信或浏览器 SDK。\n- 当前没有 PVP、跨玩家同步或强反作弊需求，因此不引入服务端权威战斗；若这些前提变化，应重新做架构决策，而不是把当前结论解释为永久禁止服务端能力。\n\n## 9. 待定策划决策\n\n| 主题 | 需要决定 | 应在何时决定 |\n|---|---|---|\n| 单局时长 | 目标时长、波数区间、准备期占比 | 扩展第二套正式关卡前 |\n| 关卡结构 | 首批三关之后，线性关卡、章节地图、无尽模式的主次关系 | 扩展首批三关前 |\n| 长期成长 | 成长对象、局内影响、重置与上限 | 实现成长入口前 |\n| 失败收益 | 无收益、保底收益或按进度结算 | 接入正式奖励前 |\n| 经济结构 | 货币数量、来源、消耗和防通胀边界 | 实现商店或成长消耗前 |\n| 内容节奏 | 水果、装备、敌人、关卡和活动的投放频率 | 制定首个内容版本计划前 |\n| 商业化 | 广告、付费和分享是否进入产品范围 | 平台正式发布方案确定后 |\n\n每个待定项形成决策后，应先提醒用户该决定会影响哪些策划章节，并询问是否同步本总纲。只有用户明确确认后才能更新；具体实现仍需进入对应的 OpenSpec 变更。\n\n## 10. 文档职责\n\n- `README.md`：如何打开、怎么玩、主要工程入口和文档导航。\n- 本文：游戏要做成什么、核心循环、内容结构、版本方向和策划待定项。\n- [OpenSpec changes](../../openspec/changes/)：一个具体需求如何设计、实现和验收。\n- [P0 发布基线](../p0-release-baseline.md)、[P1 首波门禁](../p1-first-wave-gate.md) 和 [平台验证](../platform/)：当前实际完成、验证和阻塞状态。\n\n维护本文时应链接实时状态文档，不复制构建哈希、SDK 状态、验收日志或短期任务进度。当前实现与目标方向不一致时，先明确它属于“当前基线”还是“目标设计”，不要用其中一方覆盖另一方。发现重大设计变化时只提出同步提醒，不得把实现授权推定为策划文档修改授权。\n"},{"path":"docs/design/pending-design-review.md","title":"待录入审核设计","id":"pending-design-review","parent":"game-design-overview","order":90,"status":"draft","source":"---\nid: pending-design-review\nparent: game-design-overview\norder: 90\nstatus: draft\n---\n\n# 待录入审核设计\n\n本文用于暂存尚未获得确认、不能写入正式策划案的设计方案。这里的内容均为候选设计，不代表已定规则，也不覆盖 [游戏策划总纲](game-design-overview.md)。\n\n每项候选设计经过人工审核后才能进入正式策划文档：\n\n- `待审核`：仅记录方案，不能作为正式策划结论。\n- `已确认待录入`：用户已明确批准，可以同步到对应正式章节。\n- `已录入`：已经按用户确认同步到正式策划文档，本文仅保留审核与决策记录。\n- `已撤回`：保留决策痕迹，但不再推进。\n\n## 地图编辑器：分层地貌绘制交互简化\n\n- **状态**：已撤回\n- **撤回原因**：该方案只简化了地貌素材与 Dual-Grid 组合的绘制入口，没有编辑版本化地图聚合中的玩法格、路线和点位，也没有地图边界、完整性校验、目录导出或真实战斗预览。它应被定位为地貌素材实验室，不能作为地图编辑器的正式方案。\n- **目的**：让地图绘制者不需要理解 `A`、`B`、前景、背景、TileSet 或 Mask 等实现概念，就能完成纯底图、分层地貌和双向组合绘制。\n- **正式文档影响**：若审核通过，预计同步到 `docs/design/game-design-overview.md` 的“内容生产与版本边界”，用于补充地图内容制作入口的长期方向。\n- **实施规划**：由 OpenSpec change `simplify-layered-terrain-editor-workflow` 单独约束；在该 change 实施前，本节不代表编辑器已经具备下述交互。\n\n### 候选主流程\n\n地图绘制入口提供四个带材质缩略图的快捷笔刷：\n\n| 绘制者看到的笔刷 | 写入结果 |\n|---|---|\n| 纯草地 | 草地底图，并清除该格的地貌和精修边缘 |\n| 纯泥土 | 泥土底图，并清除该格的地貌和精修边缘 |\n| 草覆泥土 | 泥土底图＋草地地貌 |\n| 泥覆草地 | 草地底图＋泥土地貌 |\n\n只有包含地貌的笔刷才显示边缘选项：\n\n- **基础边缘**：只使用通用地貌轮廓。\n- **AI 精修边缘**：使用已经生成并审核过的定向边缘素材；绘制时不实时调用 AI，也不使用脚本修改像素边缘。\n\n当前笔刷应始终显示为面向绘制者的摘要，例如“草覆泥土／AI 精修边缘”。从统一的地图工具入口打开绘制器后，自动定位当前地图并进入明确的绘制状态，不要求使用者在 Project 面板中寻找 TileSet 资源。\n\n### 候选高级流程\n\n以下操作默认折叠，只在需要精确修改单层时展开：\n\n- 只绘制草地或泥土地貌，保留格子中已有底图。\n- 只擦除地貌和对应边缘，保留底图。\n- 清空整个格子，同时移除底图、地貌和边缘。\n- 查看底层逻辑 Tilemap、生成输出、标记 Tile 与 TileSet 绑定；这些属于开发者设置，不进入日常绘制主流程。\n\n在空白格上尝试“只绘制地貌”时，应提示先绘制底图。某个方向缺少 AI 精修素材时，应禁用该选项并说明原因，不能拿反方向素材替代，也不能静默切换成其他边缘。\n\n### 候选扩展原则\n\n界面名称、缩略图和色块最终应来自地貌材质配置，而不是在工具中写死“草地”和“泥土”。未来增加水面、雪地或其他材质时，继续复用“一层底图＋一层可选地貌”的约束，同时隐藏内部 `A/B` 身份。\n\n### 待审核结论\n\n- 不再采用“四个快捷组合＋折叠高级分层操作”作为完整地图编辑器的正式交互。\n- 四个快捷组合、AI 精修边缘和 Mask 验收板仅保留在地貌素材实验室中，服务美术与渲染验证。\n- 是否将地貌素材实验室作为独立开发工具长期保留，随新的正式地图编辑器一起审核。\n\n## 关卡地图编辑器：版本化地图聚合的一站式制作流程\n\n- **状态**：已录入\n- **目的**：让关卡设计者不修改代码、不操作原始 TileSet、不维护第二套坐标，即可从空白地图完成玩法拓扑、路线、点位、地貌表现、校验、实战预览和目录发布。\n- **录入位置**：已同步到 `docs/design/game-design-overview.md` 的“4.3 关卡差异与待定战斗问题”和“6.1 地图制作与发布流程”。\n- **实施规划**：具体行为与验收继续由 OpenSpec change `build-canonical-battlefield-map-editor` 单独约束；本文仅保留设计审核记录。\n\n### 已确认产品边界\n\n地图制作拆分为两个互不冒名的工具：\n\n1. **地貌素材实验室**：维护底图、透明地貌、定向精修边缘和十六种 Dual-Grid Mask 验收板；允许孤岛、孔洞和对角测试，不生成可玩关卡。\n2. **关卡地图编辑器**：编辑一个有固定尺寸和稳定 `mapId` 的版本化地图聚合；统一管理表现布局、玩法拓扑、路线和类型化点位，并导出给关卡目录使用。\n\n地貌素材实验室不得出现在普通关卡制作主流程中，也不得把素材验收板作为地图可用性的证据。\n\n### 已确认主流程\n\n`新建/打开地图 → 设置身份与尺寸 → 绘制玩法拓扑 → 编辑路线与点位 → 绘制地貌表现 → 完整校验 → 实战预览 → 发布到关卡目录`\n\n- **身份与尺寸**：创建稳定 `mapId`、正数网格宽高和单位格尺寸；创建时自动为所有格子写入默认底图，画布外禁止落笔。\n- **玩法拓扑**：绘制有限、已审核的种植、敌人通行、玩家通行和碰撞能力；不得由地貌图片反推玩法合法性。\n- **路线与点位**：用有序相邻格编辑主路线，自动显示方向、入口和出口；配置刷怪点、路线目标、核心和初始花盆候选组，并使用稳定 ID。\n- **地貌表现**：在同一有界二维画布上绘制底图、可选地貌和可选定向边缘；支持单格、矩形、区域填充和吸管。Mask 由语义布局自动推导，策划不逐格选择 Mask。\n- **协作辅助**：允许显式执行“按玩法拓扑生成推荐表现”，例如把路线建议为石板、可种植区建议为草地；该操作是可撤销的批量写入，不建立表现层对玩法层的运行时权威。\n- **校验与发布**：无效草稿可以保存，但缺失覆盖、越界、路线断裂、必需点位缺失、同格冲突、未知能力或材质引用缺失时，禁止实战发布并定位到具体格子或对象。正式发布集合由单独的发布清单管理；运行时生成物只能从该清单全量重建，不作为可手工编辑或反向读取的第二份真相。\n- **预览**：编辑器内预览和 Battle 实战预览都使用正式 `BattlefieldProjection` 与编译结果，不使用透视 Scene 视图或独立演示板作为最终效果依据。\n\n### 已确认交互原则\n\n- 主界面按“玩法、路线与点位、表现、校验”组织，不暴露 `A/B`、Mask、逻辑 Tilemap、生成输出或资源 GUID。\n- 所有绘制工具受地图边界约束；悬空格、无限画布落笔和缺失底图不是合法作者状态。\n- 当前层、选中工具、笔刷范围、坐标、错误数量和发布状态始终可见。\n- Undo/Redo 以一次完整手势或一次批量操作为单位；矩形、填充和自动建议必须整体可撤销。\n- 表现与玩法允许有意不同，但编辑器对可疑差异给出警告，不自动篡改另一层。\n- 精修边缘按材质对和连续区域应用；缺少确切方向素材时明确禁用，不反向借用或静默降级。\n- 编辑画布按所选模板关卡的真实主题和 `BattlefieldTerrainPalette` 解析地貌；缺失底图、地貌或确切方向边缘时显示阻塞诊断，不以占位色块伪装成功。\n\n### 已确认验收门槛\n\n- 从空白资产开始，仅使用正式地图编辑器创建一张新地图；全过程不修改 C#、不打开原始 TileSet、不手工编辑生成 Tilemap。\n- 保存并重新打开后，地图身份、尺寸、三层内容、路线顺序、点位 ID 和校验结果一致。\n- 越界绘制被拒绝；空底图、断裂路线、缺失核心、无效点位和未知引用均能阻止发布并定位原因。\n- 校验通过的地图可编译进入关卡目录，在正式 Battle 场景中完成刷怪、寻路、种植、核心受击和结算流程。\n- 正式 Playtest 必须先从发布清单全量重建生成资源，再重新装配正常关卡目录并按稳定 `levelId` 启动；临时内存预览不能替代发布验收。\n- 编辑器预览与运行时在地貌、路线、点位和投影位置上保持一致；地貌素材验收板不得替代此项证据。\n- 自动化验收至少覆盖新建、编辑、撤销、保存重开、编译、负例门禁和 Battle 集成；人工验收必须包含完整编辑器画面与真实竖屏战斗画面。\n\n### 审核结论\n\n- 采用“地貌素材实验室＋正式关卡地图编辑器”的双工具边界。\n- 采用“玩法拓扑优先、表现随后、显式建议但不反向授权”的制作顺序。\n- 允许保存无效草稿，但严格禁止无效地图进入关卡目录和正式实战预览。\n- 以“无需改代码制作一张新可玩地图”为地图编辑器完成的最低验收标准。\n"},{"path":"docs/p0-release-baseline.md","title":"FruitDefense P0 release baseline","id":"p0-release-baseline","parent":"design-kb-home","order":20,"status":"active","source":"---\nid: p0-release-baseline\nparent: design-kb-home\norder: 20\nstatus: active\n---\n\n# FruitDefense P0 release baseline\n\nRecorded on 2026-08-14 for the deployed `main` revision\n`e9f91d3ab21031a3957aa738ec707099ae537105` with Unity `6000.3.19f1`.\n\n## Runtime shape\n\n- Enabled scene order: `Bootstrap`, `Lobby`, `Battle`, `Settlement`.\n- `AppBootstrap` is the only persistent composition root; battle hosts are explicitly initialized and disposable.\n- Default level: `orchard-01`; a battle pins its session ID, seed, and content version through settlement or retry.\n- Fixed simulation: 20 Hz, five-step catch-up ceiling, serializable deterministic random state, no background catch-up.\n- Runtime content: finite trigger/target/effect skill composition compiled from the bundled versioned catalog.\n- Persistence: local `PlayerProfileEnvelopeV1` plus deterministic `BattleSnapshotV1`; P0 does not auto-resume a battle.\n\n## Versioned artifacts\n\n- Catalog ID/version: `catalog.bundled.orchard@1.0.0`.\n- WebGL payload versions: loader `c222dba000b7`, data `4774cd1e5a6d`,\n  framework `ecf670072498`, and Wasm `6f50b3bba3ee`.\n- WebGL output: 8,772,874 bytes; entry SHA-256\n  `3A4305C70F313C8E91D15F6C27E6FF8F7FC11DA78FE141317FA00F4ADDDEFBD4`.\n- The data payload is 4,712,677 bytes.\n- Ordinary WebGL public URL: `http://175.178.80.66:3000/`.\n\n## Release gates\n\n- Unified Unity gate: `FruitDefense.Editor.P0ValidationSuite.Run` -> `FRUIT_DEFENSE_P0_RELEASE_GATE_OK`.\n- Repeated basic-attack regression passed for pea, watermelon, banana, and durian using real fixed ticks and damage.\n- WebGL build: `FruitDefense.Editor.WebBuild.Build` -> `FRUIT_DEFENSE_WEB_BUILD_OK`;\n  two clean WebGL-targeted builds produced identical full SHA-256 digests and\n  byte lengths for all four payloads.\n- Local portrait acceptance: `scripts/accept-webgl-portrait.ps1 -ServeLocal` -> `FRUIT_DEFENSE_VISUAL_ACCEPTANCE_OK`.\n- Online publication: `scripts/publish-online.ps1 -Execute` -> `FRUIT_DEFENSE_ONLINE_PUBLISH_OK`; remote entry health and WebGL delivery headers passed.\n- Accepted local manifest: `Logs/visual-acceptance/20260814-000120/acceptance.json`.\n- Accepted deployed manifest:\n  `Logs/visual-acceptance-transition/20260814-000120-ccc72256/candidate/acceptance.json`.\n- The deployed release-N to release-N+1 transition changed loader, data, framework,\n  and Wasm. It expected 8,753,071 payload bytes and observed 8,754,271 transferred\n  bytes including response overhead. The candidate's subsequent same-release warm\n  reload transferred 0 payload bytes.\n- Strong content ETags, independent payload versions, immutable matching-version\n  caching, exact remote header checks, and HTML revalidation all passed.\n- Schema-3 publication manifest: `Builds/Pipeline/online-publish-manifest.json`.\n- This baseline authorizes ordinary WebGL only; it is not Douyin or WeChat release evidence.\n\n## Deferred to P1\n\n- Automatic local/cloud battle resume, remote content catalogs/bundles, immutable release channels, login, cloud profile, and code-package updates.\n- Douyin device/SDK integration remains gated by the compatibility spike. The committed spike status is Yellow until TTSDK, developer tools, App ID, simulator, Android, and iOS device evidence are available; mini-game adapters must remain explicitly unavailable rather than masquerading as Web.\n"},{"path":"docs/p1-first-wave-gate.md","title":"P1 first-wave gate","id":"p1-first-wave-gate","parent":"design-kb-home","order":30,"status":"active","source":"---\nid: p1-first-wave-gate\nparent: design-kb-home\norder: 30\nstatus: active\n---\n\n# P1 first-wave gate\n\nObserved on 2026-07-15 against Unity `6000.3.19f1` on branch\n`codex/p0-p1-foundation`.\n\n## Decision\n\n**The P1 second wave is closed.** The battle state/presentation boundary is\nGreen, but the Douyin and WeChat device/export spikes remain Yellow. Per the\nDouyin-first plan, no production runtime adapter, remote-content delivery,\nprofile backend, or code-package updater is authorized yet.\n\nOrdinary WebGL success is only a shared baseline. It must not be reported as a\nDouyin or WeChat conversion result, and an unavailable mini-game adapter must\nnot silently fall back to the Web adapter.\n\n## First-wave status\n\n| Change | Progress | Gate | Result |\n|---|---:|---|---|\n| `separate-battle-state-and-presentation-events` | 14/14 | Green | Simulation emits bounded, ordered, one-way presentation events; snapshots and checksums exclude delivery state. |\n| `spike-douyin-unity6-export-and-device` | 8/14 | Yellow | Unity/WebGL baseline is healthy; TTSDK, authorized conversion, simulator, Android/iOS, remote-content, Wasm, and soak evidence are missing. |\n| `spike-wechat-unity6-export-and-device` | 8/15 | Yellow | Unity/WebGL baseline is healthy; reviewed WXSDK conversion, Stable Developer Tools, simulator, devices, remote-content, subpackage/Wasm, and soak evidence are missing. |\n\nBoth readiness scripts return zero for a Yellow diagnostic run and exit `2`\nwith `-RequireGreen`, so CI can block formal integration without treating a\npartially prepared developer machine as a script failure.\n\n## Integrated acceptance evidence\n\n- Presentation boundary: `FRUIT_DEFENSE_PRESENTATION_BOUNDARY_OK` in\n  `Logs/final-p1-boundary.log`.\n- Unified P0 regression: `FRUIT_DEFENSE_P0_RELEASE_GATE_OK` in\n  `Logs/final-p1-p0-suite.log`.\n- WebGL: `FRUIT_DEFENSE_WEB_BUILD_OK`, build version `2f080450b1d0`, total\n  output `8,078,303` bytes in `Logs/final-integrated-webgl-build.log`.\n- Full route flow: `Logs/flow-acceptance/20260715-031011/flow-acceptance.json`.\n- Existing 13-state acceptance:\n  `Logs/visual-acceptance/20260715-031024/acceptance.json`.\n- Strict OpenSpec validation passes for all three first-wave changes.\n\n## Minimum unblock sequence\n\n1. Provide non-production Douyin and WeChat AppIDs and interactive developer\n   sessions outside Git.\n2. Review and install a candidate TTSDK/Douyin IDE pair and a candidate official\n   WXSDK/Stable WeChat Developer Tools pair in isolated platform worktrees.\n3. Compile, export, convert, and repeat from a clean checkout while recording\n   exact versions, hashes, and generated manifests.\n4. Complete both simulator matrices and Android/iOS physical-device matrices,\n   including 30-minute stability runs.\n5. Prove platform content loading/cache/fallback and separately prove\n   subpackage/Wasm behavior; neither is runtime code hot replacement.\n6. Re-run both readiness scripts with `-RequireGreen`.\n7. After Douyin is Green, open the formal Douyin runtime/content/backend changes.\n   WeChat remains a follow-up until the Douyin-first release path is stable.\n\nDetailed evidence requirements remain in `docs/platform/douyin-spike-status.md`\nand `docs/platform/wechat-spike-status.md`.\n"},{"path":"docs/platform/douyin-official-references.md","title":"Douyin Unity mini-game official references","id":"douyin-official-references","parent":"douyin-spike-status","order":10,"status":"active","source":"---\nid: douyin-official-references\nparent: douyin-spike-status\norder: 10\nstatus: active\n---\n\n# Douyin Unity mini-game official references\n\nRetrieved on 2026-07-15. Recheck these sources before changing the pinned platform toolchain.\n\n| Mechanism | Official source | Project decision |\n|---|---|---|\n| Unity WebGL conversion | [WebGL adaptation overview](https://developer.open-douyin.com/docs/resource/zh-CN/mini-game/develop/guide/game-engine/rd-to-SCgame/open-capacity/overview-and-compatibility/sc_webgl_overview) | Keep gameplay code platform-neutral; the SDK and conversion glue stay in a platform assembly. WebGL does not support general managed threading. |\n| Unity WebGL integration | [WebGL adaptation solution](https://developer.open-douyin.com/docs/resource/zh-CN/mini-game/develop/guide/game-engine/rd-to-SCgame/open-capacity/sc_webgl_overall) | Use the official TTSDK/Stark Unity toolchain only after this spike is Green. |\n| Remote AssetBundles | [TTAssetBundle memory optimization](https://developer.open-douyin.com/docs/resource/zh-CN/mini-game/develop/guide/performance-optimization-both/unity/startup/sc-webgl-tt-ab) | Minimums are TTSDK 5.52.10, Unity 2021.3, and Douyin/Douyin Lite 29.2.0. TTSDK below 6.2.0 also requires StarkSDK Unity Tools 3.31.2 or newer. Retain the documented unsupported-host fallback and test its actual memory behavior. |\n| Code-package update | [UpdateManager](https://developer.open-douyin.com/docs/resource/zh-CN/mini-app/develop/api/foundation/update/update-manager/update-manager) | Code updates are downloaded by the host and applied through restart; no in-process C# hot replacement. |\n| Ordinary subpackages | [Code packages and subpackages](https://developer.open-douyin.com/docs/resource/zh-CN/mini-game/develop/guide/basic-function/subpackages/introduction) | Treat subpackages as startup/download optimization. Baseline limits observed: 4 MB main package, 20 MB total package, 20 MB single subpackage unless separately entitled. |\n| Wasm splitting | [Wasm splitting tool](https://developer.open-douyin.com/docs/resource/zh-CN/mini-game/develop/guide/performance-optimization-both/unity/startup/sc_webgl_split) | IDE 4.3.2 or newer is required. Collect functions on Android first and then iOS across Bootstrap, Lobby, the complete first battle, lifecycle, and update UI; splitting requires AppID-backed upload/preview and is not hot update. |\n| Developer tools | [Developer-tool downloads and changelog](https://developer.open-douyin.com/docs/resource/zh-CN/mini-game/develop/dev-tools/developer-instrument-update-and-download) | Version 4.5.2 (2026-03-24) was the latest listed stable tool at retrieval time and carries default base library 4.4/latest 4.6. Treat it as a candidate only; pin it after Unity 6000.3.19f1 conversion succeeds twice. |\n| WebGL networking | [Network adaptation](https://developer.open-douyin.com/docs/resource/zh-CN/mini-game/develop/guide/game-engine/rd-to-SCgame/open-capacity/capability-adaptation/sc_webgl_network) | Runtime HTTP uses `UnityWebRequest` over approved HTTPS domains; no raw sockets in the core runtime. |\n\n## Status rules\n\n- **Green:** a repeatable command, generated artifact, simulator record, or physical-device record proves the row on the pinned versions.\n- **Yellow:** the capability is plausible or documented but required tools, credentials, conversion, simulator, or device evidence is missing.\n- **Red:** the pinned toolchain fails the same required check on a clean retry or an official constraint makes the planned approach unavailable.\n\nThe overall gate is Green only when every blocking row is Green. A Yellow or Red gate keeps `DouyinMiniGame` explicitly unavailable.\n\n## Pinning boundary\n\nThe public minimum-version statements do not prove that Unity `6000.3.19f1` works with a particular TTSDK. `douyin-toolchain-pin-template.json` therefore keeps TTSDK and converter versions null until a compile, WebGL export, conversion, and clean retry produce hashed evidence. The template also separates the editor, SDK, Unity tools, IDE, base library, Addressables, Node, converter, Wasm CLI, and Android/iOS host versions so later investigations do not collapse independent compatibility variables into one label.\n"},{"path":"docs/platform/douyin-spike-status.md","title":"Douyin Unity compatibility spike status","id":"douyin-spike-status","parent":"design-kb-home","order":50,"status":"active","source":"---\nid: douyin-spike-status\nparent: design-kb-home\norder: 50\nstatus: active\n---\n\n# Douyin Unity compatibility spike status\n\nObserved on 2026-07-15 against Unity 6000.3.19f1 and baseline revision `4034f7e`.\n\n## Decision\n\n**Overall gate: Yellow.** The project is healthy as a standard Unity WebGL build, but the production Douyin adapter is not authorized yet.\n\nGreen desktop evidence:\n\n- Unity 6000.3.19f1 and its WebGL module are installed.\n- The existing Unity rule smoke passes with `FRUIT_DEFENSE_SMOKE_OK`.\n- The existing 13-state WebGL portrait acceptance passes.\n- The baseline WebGL output exists and the pre-conversion output is approximately 7.7 MB.\n- The readiness report omits credential values and records only presence flags.\n\nYellow release blockers:\n\n- No pinned TTSDK or compatible Addressables/TTAssetBundle provider is installed.\n- Douyin developer tools and an authorized AppID/session are unavailable on this machine.\n- No converted project, simulator record, UpdateManager record, or remote-content fallback record exists.\n- Android and iOS cold/warm start, lifecycle, battle, Wasm collection, and 30-minute stability runs are not available.\n\n## Follow-up environment audit\n\nThe 2026-07-15 read-only audit found Windows 10 build 19045, PowerShell 5.1, Unity WebGL support, and Node `v24.14.0`. It found no TTSDK/StarkSDK root, TTSDK package, Addressables package, Douyin IDE uninstall record, `tmg` command, `tt-wasmsplit-ci` command, AppID flag, developer-session flag, upload-credential flag, Android device evidence, or iOS device evidence. Node remains an observed desktop version, not a converter pin. The isolated follow-up worktree does not contain the ignored `Builds/WebGL` artifact, so its refreshed readiness report correctly marks that local artifact row Yellow; this does not invalidate the earlier 7.7 MB baseline result, but a fresh build is still required before conversion.\n\nNone of tasks 3.1 through 3.6 can be completed from this machine state:\n\n| Task | Reusable preparation now present | Evidence still required |\n|---|---|---|\n| 3.1 | Exact pin fields and hash slots in `douyin-toolchain-pin-template.json` | Reviewed TTSDK, IDE and converter; compile, WebGL export, conversion and clean retry on Unity 6000.3.19f1 |\n| 3.2 | Simulator checklist in `douyin-evidence-manifest-template.json` | Authorized AppID/session, converted project and simulator logs for every row |\n| 3.3 | Android matrix and non-secret device metadata fields | Physical Android preview, full matrix, memory/crash evidence and 30-minute run |\n| 3.4 | iOS matrix and non-secret device metadata fields | Physical iOS preview, full matrix, memory/crash evidence and 30-minute run |\n| 3.5 | Provider/fallback/cache/unload checklist | Addressables plus TTSDK provider, approved HTTPS cache domain, supported-host and fallback runs |\n| 3.6 | Named flow coverage checklist | AppID-backed Wasm preparation, Android then iOS function collection, split artifact and post-split preview |\n\n## Minimum unblock checklist\n\n1. Authorize a non-production Douyin Mini Game AppID and interactive de
