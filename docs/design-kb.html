        if (!id || entries.length > 1) failures.push("文档 ID 重复或为空：" + (id || "(empty)"));
      });
      let roots = 0;
      records.forEach(function (record) {
        if (!record.parent) roots += 1;
        if (record.parent === record.id) failures.push(record.path + " 不能以自己作为父文档");
        if (record.parent && (ids.get(record.parent) || []).length !== 1) failures.push(record.path + " 的父文档不存在或不唯一：" + record.parent);
        const seen = new Set();
        let cursor = record;
        while (cursor && cursor.id) {
          if (seen.has(cursor.id)) { failures.push(record.path + " 存在父级循环"); break; }
          seen.add(cursor.id);
          cursor = cursor.parent && (ids.get(cursor.parent) || []).length === 1 ? ids.get(cursor.parent)[0] : null;
        }
        workspaceValidateLinks(record, paths, failures);
      });
      if (!roots) failures.push("知识库至少需要一个根文档");
      return [...new Set(failures)];
    }

    function workspaceValidateLinks(record, paths, failures) {
      const searchable = String(record.body || stripFrontMatter(record.source)).replace(/```[\s\S]*?```/g, "");
      const pattern = /\[[^\]]+\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g;
      for (const match of searchable.matchAll(pattern)) {
        const href = match[1];
        if (!href || href.startsWith("#") || /^[a-z][a-z0-9+.-]*:/i.test(href)) continue;
        let target;
        try { target = decodeURIComponent(href.split("#", 1)[0]); }
        catch { failures.push(record.path + " 包含无效链接：" + href); continue; }
        if (!target.toLowerCase().endsWith(".md")) continue;
        const resolved = workspaceResolvePath(record.path, target);
        if (!resolved || !paths.has(resolved)) failures.push(record.path + " 找不到链接目标：" + href);
      }
    }

    function workspaceBeginEdit() {
      if (!workspaceRootHandle || !current) return;
      workspaceOpenEditor("edit", current);
    }

    function workspaceBeginNewDocument() {
      if (!workspaceRootHandle || !workspaceConfig) return;
      let suffix = 1;
      let id = "new-document";
      while (byId.has(id)) id = "new-document-" + (++suffix);
      const parent = current ? current.id : "";
      const siblings = children.get(parent) || [];
      workspaceOpenEditor("new", {
        path: workspaceConfig.contentRoots[0] + "/" + id + ".md",
        id: id,
        parent: parent,
        order: siblings.length ? Math.max(...siblings.map(function (entry) { return entry.order; })) + 10 : 10,
        status: "draft",
        source: "---\nid: " + id + "\nparent: " + parent + "\norder: 10\nstatus: draft\n---\n\n# 新文档\n",
      });
    }

    function workspaceOpenEditor(mode, record) {
      workspaceEditorMode = mode;
      workspaceEditingPath = mode === "edit" ? record.path : "";
      workspaceOriginalSource = mode === "edit" ? record.source : "";
      workspaceEditorDirty = false;
      workspaceElements.editorPath.disabled = mode === "edit";
      workspaceElements.editorId.disabled = mode === "edit";
      workspaceElements.editorPath.value = record.path;
      workspaceElements.editorId.value = record.id;
      workspaceElements.editorOrder.value = String(record.order);
      workspaceElements.editorStatus.value = record.status;
      workspaceElements.editorBody.value = stripFrontMatter(record.source);
      workspacePopulateParents(mode === "edit" ? record.id : "", record.parent || "");
      elements.preview.hidden = true;
      workspaceElements.editor.hidden = false;
      elements.documentTitle.textContent = mode === "edit" ? "编辑：" + record.title : "新建文档";
      elements.documentPath.textContent = mode === "edit" ? record.path : "保存后加入当前知识库";
      workspaceUpdateControls();
    }

    function workspacePopulateParents(editingId, selectedParent) {
      workspaceElements.editorParent.replaceChildren();
      const rootOption = document.createElement("option");
      rootOption.value = "";
      rootOption.textContent = "（根文档）";
      workspaceElements.editorParent.appendChild(rootOption);
      documents.slice().sort(compareDocuments).forEach(function (record) {
        if (record.id === editingId) return;
        const option = document.createElement("option");
        option.value = record.id;
        option.textContent = record.title + " · " + record.id;
        workspaceElements.editorParent.appendChild(option);
      });
      workspaceElements.editorParent.value = selectedParent;
    }

    function workspaceCancelEditor() {
      if (workspaceEditorDirty && !workspaceConfirmDiscard()) return;
      workspaceCloseEditor(true);
    }

    function workspaceCloseEditor(restoreSelection) {
      workspaceEditorMode = "";
      workspaceEditingPath = "";
      workspaceOriginalSource = "";
      workspaceEditorDirty = false;
      workspaceElements.editor.hidden = true;
      elements.preview.hidden = false;
      if (restoreSelection && current) workspaceOriginalSelectDocument(current.path);
      workspaceUpdateControls();
    }

    function workspaceConfirmDiscard() {
      return typeof window.confirm !== "function" || window.confirm("当前修改尚未保存，确定放弃吗？");
    }

    async function workspaceSaveEditor(event) {
      if (event && typeof event.preventDefault === "function") event.preventDefault();
      if (!workspaceRootHandle || !workspaceConfig || !workspaceEditorMode) return false;
      try {
        const pathValue = workspaceNormalizePath(workspaceElements.editorPath.value);
        const id = workspaceElements.editorId.value.trim();
        const parent = workspaceElements.editorParent.value.trim();
        const orderText = workspaceElements.editorOrder.value.trim();
        const status = workspaceElements.editorStatus.value;
        const body = workspaceElements.editorBody.value.replace(/\r\n/g, "\n").trimEnd() + "\n";
        if (!pathValue || !pathValue.toLowerCase().endsWith(".md")) throw new Error("请输入内容目录内的有效 .md 路径。");
        if (!workspaceConfig.contentRoots.some(function (root) { return pathValue.startsWith(root + "/"); })) throw new Error("新文档必须位于配置的 contentRoots 内。");
        if (workspaceIsExcluded(pathValue, workspaceConfig.exclude)) throw new Error("该路径已被项目配置排除。");
        if (!/^-?\d+$/.test(orderText)) throw new Error("顺序必须是整数。");
        const source = workspaceComposeSource(workspaceOriginalSource, { id: id, parent: parent, order: orderText, status: status }, body);
        const parsed = workspaceParseDocument(pathValue, source, null, 0);
        if (parsed.failures.length) throw new Error(parsed.failures.join("；"));
        const existingRecord = workspaceEditorMode === "edit" ? byPath.get(workspaceEditingPath) : null;
        if (workspaceEditorMode === "new" && byPath.has(pathValue)) throw new Error("该 Markdown 路径已经存在。");
        parsed.document.fileHandle = existingRecord && existingRecord.fileHandle;
        const candidates = workspaceEditorMode === "edit"
          ? documents.map(function (record) { return record.path === workspaceEditingPath ? parsed.document : record; })
          : documents.concat(parsed.document);
        const validationFailures = workspaceValidateDocuments(candidates);
        if (validationFailures.length) throw new Error(validationFailures.slice(0, 4).join("；"));

        let fileHandle;
        if (workspaceEditorMode === "edit") {
          if (!existingRecord || !existingRecord.fileHandle) throw new Error("当前文档没有可写文件句柄，请刷新项目后重试。");
          const latest = await workspaceReadFile(existingRecord.fileHandle);
          if (latest.source !== workspaceOriginalSource) throw new Error("文件已被其他程序修改，请取消编辑并刷新后再试。");
          fileHandle = existingRecord.fileHandle;
        } else {
          const existingHandle = await workspaceFindFile(workspaceRootHandle, pathValue);
          if (existingHandle) throw new Error("磁盘上已经存在同名文件。");
          fileHandle = await workspaceGetFile(workspaceRootHandle, pathValue, true);
        }
        await workspaceWriteFile(fileHandle, source);
        await workspaceLoadProject(workspaceRootHandle, pathValue);
        setStatus("已保存 " + pathValue + "。", "success");
        return true;
      } catch (error) {
        setStatus(workspaceErrorMessage(error), "warning");
        return false;
      }
    }

    function workspaceComposeSource(originalSource, metadata, body) {
      const extra = [];
      const normalized = String(originalSource || "").replace(/\r\n/g, "\n");
      if (normalized.startsWith("---\n")) {
        const closing = normalized.indexOf("\n---\n", 4);
        if (closing >= 0) {
          normalized.slice(4, closing).split("\n").forEach(function (line) {
            if (!/^(?:id|parent|order|status):(?:\s|$)/.test(line)) extra.push(line);
          });
        }
      }
      const frontMatter = [
        "---",
        "id: " + metadata.id,
        "parent: " + metadata.parent,
        "order: " + metadata.order,
        "status: " + metadata.status,
      ];
      if (extra.some(function (line) { return line.trim(); })) frontMatter.push(...extra);
      frontMatter.push("---", "", String(body || "").trimEnd(), "");
      return frontMatter.join("\n");
    }

    async function workspaceReadPath(rootHandle, pathValue) {
      const handle = await workspaceGetFile(rootHandle, pathValue, false);
      return (await workspaceReadFile(handle)).source;
    }

    async function workspaceReadFile(fileHandle) {
      const file = await fileHandle.getFile();
      return { source: (await file.text()).replace(/\r\n/g, "\n"), lastModified: Number(file.lastModified || 0) };
    }

    async function workspaceWriteFile(fileHandle, source) {
      const writable = await fileHandle.createWritable();
      try {
        await writable.write(source);
        await writable.close();
      } catch (error) {
        if (typeof writable.abort === "function") {
          try { await writable.abort(); } catch { /* The original write failure is more useful. */ }
        }
        throw error;
      }
    }

    async function workspaceGetDirectory(rootHandle, pathValue, create) {
      let directory = rootHandle;
      const normalized = workspaceNormalizePath(pathValue);
      if (!normalized) throw new Error("目录路径无效：" + pathValue);
      for (const part of normalized.split("/")) directory = await directory.getDirectoryHandle(part, { create: Boolean(create) });
      return directory;
    }

    async function workspaceGetFile(rootHandle, pathValue, create) {
      const normalized = workspaceNormalizePath(pathValue);
      if (!normalized) throw new Error("文件路径无效：" + pathValue);
      const parts = normalized.split("/");
      const filename = parts.pop();
      let directory = rootHandle;
      for (const part of parts) directory = await directory.getDirectoryHandle(part, { create: Boolean(create) });
      return directory.getFileHandle(filename, { create: Boolean(create) });
    }

    async function workspaceFindFile(rootHandle, pathValue) {
      try { return await workspaceGetFile(rootHandle, pathValue, false); }
      catch (error) {
        if (error && (error.name === "NotFoundError" || error.name === "TypeMismatchError")) return null;
        throw error;
      }
    }

    function workspaceNormalizePath(value) {
      const normalized = String(value || "").trim().replace(/\\/g, "/").replace(/^\.\//, "");
      if (!normalized || normalized.startsWith("/") || /^[A-Za-z]:/.test(normalized)) return "";
      const parts = normalized.split("/");
      if (parts.some(function (part) { return !part || part === "." || part === ".."; })) return "";
      return parts.join("/");
    }

    function workspaceIsExcluded(pathValue, exclude) {
      return exclude.some(function (entry) { return pathValue === entry || pathValue.startsWith(entry + "/"); });
    }

    function workspaceResolvePath(currentPath, relativePath) {
      const base = currentPath.split("/").slice(0, -1);
      const parts = base.concat(String(relativePath || "").replace(/\\/g, "/").split("/"));
      const normalized = [];
      for (const part of parts) {
        if (!part || part === ".") continue;
        if (part === "..") {
          if (!normalized.length) return "";
          normalized.pop();
        } else normalized.push(part);
      }
      return normalized.join("/");
    }

    function workspaceDecodeScalar(value) {
      const trimmed = String(value || "").trim();
      if (trimmed.length >= 2 && trimmed[0] === trimmed.at(-1) && (trimmed[0] === "\"" || trimmed[0] === "'")) {
        return trimmed.slice(1, -1).replace(/\\\"/g, "\"").replace(/\\\\/g, "\\");
      }
      return trimmed;
    }

    function workspaceDigest(records) {
      const input = records.map(function (record) { return record.path + "\n" + record.source; }).join("\n---\n");
      let hash = 2166136261;
      for (let index = 0; index < input.length; index += 1) {
        hash ^= input.charCodeAt(index);
        hash = Math.imul(hash, 16777619);
      }
      return "live-" + ("00000000" + (hash >>> 0).toString(16)).slice(-8);
    }

    function workspaceErrorMessage(error) {
      return error && error.message ? error.message : String(error || "未知错误");
    }

    async function workspaceOpenDb() {
      if (!window.indexedDB) return null;
      return new Promise(function (resolve, reject) {
        const request = window.indexedDB.open(WORKSPACE_DB_NAME, 1);
        request.onupgradeneeded = function () {
          if (!request.result.objectStoreNames.contains(WORKSPACE_STORE_NAME)) request.result.createObjectStore(WORKSPACE_STORE_NAME);
        };
        request.onsuccess = function () { resolve(request.result); };
        request.onerror = function () { reject(request.error); };
      });
    }

    async function workspaceReadStoredHandle() {
      const database = await workspaceOpenDb();
      if (!database) return null;
      return new Promise(function (resolve, reject) {
        const transaction = database.transaction(WORKSPACE_STORE_NAME, "readonly");
        const request = transaction.objectStore(WORKSPACE_STORE_NAME).get(data.projectId);
        request.onsuccess = function () { resolve(request.result || null); };
        request.onerror = function () { reject(request.error); };
        transaction.oncomplete = function () { database.close(); };
      });
    }

    async function workspaceStoreHandle(handle) {
      const database = await workspaceOpenDb();
      if (!database) return;
      await new Promise(function (resolve, reject) {
        const transaction = database.transaction(WORKSPACE_STORE_NAME, "readwrite");
        transaction.objectStore(WORKSPACE_STORE_NAME).put(handle, data.projectId);
        transaction.oncomplete = function () { resolve(); };
        transaction.onerror = function () { reject(transaction.error); };
      });
      database.close();
    }

    const workspaceBaseApi = window.DesignKB;
    window.DesignKB = Object.freeze({
      ...workspaceBaseApi,
      selectPath: selectDocument,
      loadProjectHandle: workspaceLoadProject,
      refreshProject: workspaceRefreshProject,
      beginEdit: workspaceBeginEdit,
      beginNewDocument: workspaceBeginNewDocument,
      saveEditor: workspaceSaveEditor,
      parseDocument: workspaceParseDocument,
      validateDocuments: workspaceValidateDocuments,
      composeDocumentSource: workspaceComposeSource,
      workspaceConnected: function () { return Boolean(workspaceRootHandle); },
      currentPath: function () { return current ? current.path : ""; },
      relatedPaths: function () { return current ? relatedDocuments(current).map(function (entry) { return entry.path; }) : []; },
    });
  </script>
</body>
