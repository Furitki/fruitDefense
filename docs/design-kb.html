uns without crash/OOM |\n\n## Version evidence\n\n- Project: Unity `6000.3.19f1` revision `7689f4515d75`.\n- Official SDK repository: `wechat-miniprogram/minigame-tuanjie-transform-sdk`.\n- Official `main` observed on 2026-07-15: `ed4ad28f433c6b52b5fd3f22a6fa155a0c98c228`.\n- Official metadata mismatch: changelog `v0.1.33` (2026-06-22), package manifest `0.1.1`.\n- Developer Tools, WeChat client, base library, host baseline: not installed/recorded, therefore unpinned.\n\nThe official commit is a reviewed candidate, not a claimed compatible pin. Task 3.1 remains open until that exact or another reviewed official commit compiles and converts Unity `6000.3.19f1` with an exact Stable Developer Tools version.\n\n## Required unblock sequence\n\n1. Authorize an isolated install/review of the official WXSDK commit and a Stable WeChat Developer Tools release.\n2. Provide authorized AppID and Developer Tools login/session locally; keep credentials outside Git.\n3. Compile and convert the ordinary WebGL baseline, record immutable SDK/tool/base-library versions, and statically validate the converted project.\n4. Complete the simulator functional matrix.\n5. Complete Android and iOS functional and 30-minute stability matrices.\n6. Validate WXAssetBundle or Addressables plus UnityWebRequest fallback, ordinary subpackages, and Wasm splitting as separate mechanisms.\n7. Re-run `scripts/check-wechat-readiness.ps1 -RequireGreen`. Only a zero exit after every blocking row has evidence can authorize later adapter work.\n\n## Explicit boundary\n\nNo gameplay, ProjectSettings, Build Settings, SDK dependency, account state, upload, or production release was changed by this spike. Ordinary WebGL success is not recorded as WeChat conversion success, preview is not accepted as physical-device evidence, and package/Wasm splitting is not treated as runtime code hot replacement.\n"}]}</script>
  <script>
    "use strict";

    const data = JSON.parse(document.getElementById("design-kb-data").textContent);
    const documents = data.documents.slice();
    const byPath = new Map(documents.map(function (document) { return [document.path, document]; }));
    const byId = new Map(documents.map(function (document) { return [document.id, document]; }));
    const children = new Map();
    const collapsed = new Set();
    let current = null;
    let searchTerm = "";
    let theme = "light";

    const elements = {
      title: document.getElementById("app-title"),
      count: document.getElementById("document-count"),
      digest: document.getElementById("digest"),
      search: document.getElementById("search"),
      tree: document.getElementById("tree"),
      documentTitle: document.getElementById("document-title"),
      documentPath: document.getElementById("document-path"),
      chips: document.getElementById("chips"),
      preview: document.getElementById("preview"),
      status: document.getElementById("status"),
      themeToggle: document.getElementById("theme-toggle"),
    };

    documents.forEach(function (document) {
      const parent = document.parent || "";
      const entries = children.get(parent) || [];
      entries.push(document);
      children.set(parent, entries);
    });
    children.forEach(function (entries) { entries.sort(compareDocuments); });

    elements.title.textContent = data.title;
    document.title = data.title;
    elements.count.textContent = documents.length + " 篇";
    elements.digest.textContent = data.contentDigest.slice(0, 12);
    applyTheme(readStoredTheme(), false);
    elements.themeToggle.addEventListener("click", function () {
      applyTheme(theme === "dark" ? "light" : "dark", true);
    });
    elements.search.addEventListener("input", function (event) {
      searchTerm = event.target.value.trim().toLowerCase();
      renderTree();
    });
    elements.preview.addEventListener("click", handlePreviewLink);
    renderTree();
    const first = (children.get("") || [])[0] || documents[0];
    if (first) selectDocument(first.path);

    function compareDocuments(left, right) {
      return left.order - right.order || left.title.localeCompare(right.title, "zh-CN") || left.path.localeCompare(right.path, "en");
    }

    function readStoredTheme() {
      try {
        const stored = window.localStorage ? window.localStorage.getItem("design-kb-theme") : "";
        return stored === "dark" ? "dark" : "light";
      } catch {
        return "light";
      }
    }

    function applyTheme(nextTheme, persist) {
      theme = nextTheme === "dark" ? "dark" : "light";
      document.body.dataset.theme = theme;
      elements.themeToggle.setAttribute("aria-checked", String(theme === "dark"));
      elements.themeToggle.setAttribute("title", theme === "dark" ? "切换到日间模式" : "切换到夜间模式");
      if (!persist) return;
      try {
        if (window.localStorage) window.localStorage.setItem("design-kb-theme", theme);
      } catch { /* Theme selection remains active for this page session. */ }
    }

    function renderTree() {
      elements.tree.replaceChildren();
      const visible = visibleDocumentIds();
      const roots = children.get("") || [];
      const rootList = document.createElement("ul");
      rootList.className = "tree-list root";
      roots.forEach(function (root) { appendTreeItem(rootList, root, visible); });
      if (!rootList.children.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = searchTerm ? "没有匹配的文档。" : "知识库没有根文档。";
        elements.tree.appendChild(empty);
      } else {
        elements.tree.appendChild(rootList);
      }
    }

    function appendTreeItem(list, documentRecord, visible) {
      if (!visible.has(documentRecord.id)) return;
      const item = document.createElement("li");
      item.className = "tree-item";
      const row = document.createElement("div");
      row.className = "tree-row";
      if (current && current.path === documentRecord.path) row.className += " active";
      const descendants = children.get(documentRecord.id) || [];
      const isCollapsed = collapsed.has(documentRecord.id) && !searchTerm;
      if (descendants.length) {
        const toggle = document.createElement("button");
        toggle.type = "button";
        toggle.className = "tree-toggle";
        toggle.setAttribute("aria-expanded", String(!isCollapsed));
        toggle.setAttribute("aria-label", (isCollapsed ? "展开" : "收起") + documentRecord.title + "的子文档");
        toggle.addEventListener("click", function () {
          if (collapsed.has(documentRecord.id)) collapsed.delete(documentRecord.id);
          else collapsed.add(documentRecord.id);
          renderTree();
        });
        row.appendChild(toggle);
      } else {
        const spacer = document.createElement("span");
        spacer.className = "tree-spacer";
        spacer.setAttribute("aria-hidden", "true");
        row.appendChild(spacer);
      }
      const button = document.createElement("button");
      button.type = "button";
      button.className = "tree-select" + (current && current.path === documentRecord.path ? " active" : "");
      const title = document.createElement("span");
      title.className = "tree-title";
      title.textContent = documentRecord.title;
      button.appendChild(title);
      button.addEventListener("click", function () { selectDocument(documentRecord.path); });
      row.appendChild(button);
      item.appendChild(row);
      if (descendants.length && !isCollapsed) {
        const nested = document.createElement("ul");
        nested.className = "tree-list";
        descendants.forEach(function (child) { appendTreeItem(nested, child, visible); });
        if (nested.children.length) item.appendChild(nested);
      }
      list.appendChild(item);
    }

    function visibleDocumentIds() {
      if (!searchTerm) return new Set(documents.map(function (document) { return document.id; }));
      const visible = new Set();
      documents.forEach(function (document) {
        const haystack = [document.title, document.id, document.status, document.path].join(" ").toLowerCase();
        if (!haystack.includes(searchTerm)) return;
        let cursor = document;
        while (cursor) {
          visible.add(cursor.id);
          cursor = cursor.parent ? byId.get(cursor.parent) : null;
        }
      });
      return visible;
    }

    function selectDocument(pathValue) {
      const next = byPath.get(pathValue);
      if (!next) return false;
      current = next;
      elements.documentTitle.textContent = next.title;
      elements.documentPath.textContent = next.path;
      elements.chips.replaceChildren();
      [
        "ID: " + next.id,
        "父文档: " + (next.parent || "根"),
        "状态: " + next.status,
        "顺序: " + next.order,
      ].forEach(function (label) {
        const chip = document.createElement("span");
        chip.className = "chip";
        chip.textContent = label;
        elements.chips.appendChild(chip);
      });
      elements.preview.innerHTML = renderMarkdown(stripFrontMatter(next.source));
      renderTree();
      window.scrollTo({ top: 0, behavior: "instant" });
      return true;
    }

    function relatedDocuments(documentRecord) {
      const ancestors = [];
      let cursor = documentRecord.parent ? byId.get(documentRecord.parent) : null;
      while (cursor) {
        ancestors.unshift(cursor);
        cursor = cursor.parent ? byId.get(cursor.parent) : null;
      }
      const directChildren = (children.get(documentRecord.id) || []).slice().sort(compareDocuments);
      const result = [];
      const seen = new Set();
      ancestors.concat([documentRecord], directChildren).forEach(function (entry) {
        if (!seen.has(entry.path)) {
          seen.add(entry.path);
          result.push(entry);
        }
      });
      return result;
    }

    function makeBundle(entries, heading) {
      const lines = [
        "# " + heading,
        "",
        "- Knowledge base: " + data.title,
        "- Content digest: " + data.contentDigest,
        "- Documents: " + entries.length,
      ];
      entries.forEach(function (entry) {
        lines.push("", "---", "", "## File: " + entry.path, "", "- Document ID: " + entry.id, "- Parent ID: " + (entry.parent || "(root)"), "", entry.source.trimEnd());
      });
      return lines.join("\n") + "\n";
    }

    function setStatus(message, type) {
      elements.status.textContent = message;
      elements.status.className = "status" + (type ? " " + type : "");
    }

    function handlePreviewLink(event) {
      const anchor = event.target.closest("a[data-doc-link]");
      if (!anchor || !current) return;
      event.preventDefault();
      const raw = anchor.dataset.docLink || "";
      const targetPath = resolveRelativePath(current.path, raw.split("#", 1)[0]);
      const target = byPath.get(targetPath);
      if (!target) {
        setStatus("未找到文档：" + targetPath, "warning");
        return;
      }
      selectDocument(target.path);
    }

    function resolveRelativePath(currentPath, relativePath) {
      const base = currentPath.split("/").slice(0, -1);
      const parts = base.concat(decodeURIComponent(relativePath).replace(/\\/g, "/").split("/"));
      const normalized = [];
      parts.forEach(function (part) {
        if (!part || part === ".") return;
        if (part === "..") normalized.pop();
        else normalized.push(part);
      });
      return normalized.join("/");
    }

    function stripFrontMatter(source) {
      const normalized = String(source || "").replace(/\r\n/g, "\n");
      if (!normalized.startsWith("---\n")) return normalized;
      const closing = normalized.indexOf("\n---\n", 4);
      return closing < 0 ? normalized : normalized.slice(closing + 5).replace(/^\n/, "");
    }

    function renderMarkdown(markdown) {
      const lines = String(markdown || "").replace(/\r\n/g, "\n").split("\n");
      const output = [];
      let index = 0;
      const fence = String.fromCharCode(96).repeat(3);
      while (index < lines.length) {
        const line = lines[index];
        if (!line.trim()) { index += 1; continue; }
        if (line.trimStart().startsWith(fence)) {
          const language = line.trim().slice(3).trim();
          const code = [];
          index += 1;
          while (index < lines.length && !lines[index].trimStart().startsWith(fence)) code.push(lines[index++]);
          if (index < lines.length) index += 1;
          output.push("<pre><code" + (language ? " class=\"language-" + escapeAttribute(language) + "\"" : "") + ">" + escapeHtml(code.join("\n")) + "</code></pre>");
          continue;
        }
        const heading = line.match(/^(#{1,6})\s+(.+)$/);
        if (heading) {
          const level = heading[1].length;
          output.push("<h" + level + " id=\"" + slugify(heading[2]) + "\">" + inlineMarkup(heading[2]) + "</h" + level + ">");
          index += 1;
          continue;
        }
        if (/^\s*(?:[-*_]\s*){3,}$/.test(line)) {
          output.push("<hr>");
          index += 1;
          continue;
        }
        if (/^>\s?/.test(line)) {
          const quote = [];
          while (index < lines.length && /^>\s?/.test(lines[index])) quote.push(lines[index++].replace(/^>\s?/, ""));
          output.push("<blockquote>" + quote.map(function (value) { return "<p>" + inlineMarkup(value) + "</p>"; }).join("") + "</blockquote>");
          continue;
        }
        if (/^\s*[-*+]\s+/.test(line)) {
          const items = [];
          while (index < lines.length && /^\s*[-*+]\s+/.test(lines[index])) items.push(lines[index++].replace(/^\s*[-*+]\s+/, ""));
          output.push("<ul>" + items.map(function (value) { return "<li>" + inlineMarkup(value) + "</li>"; }).join("") + "</ul>");
          continue;
        }
        if (/^\s*\d+[.)]\s+/.test(line)) {
          const items = [];
          while (index < lines.length && /^\s*\d+[.)]\s+/.test(lines[index])) items.push(lines[index++].replace(/^\s*\d+[.)]\s+/, ""));
          output.push("<ol>" + items.map(function (value) { return "<li>" + inlineMarkup(value) + "</li>"; }).join("") + "</ol>");
          continue;
        }
        if (index + 1 < lines.length && line.includes("|") && /^\s*\|?\s*:?-+:?\s*(?:\|\s*:?-+:?\s*)+\|?\s*$/.test(lines[index + 1])) {
          const rows = [line];
          index += 2;
          while (index < lines.length && lines[index].includes("|") && lines[index].trim()) rows.push(lines[index++]);
          const cells = rows.map(splitTableRow);
          output.push("<table><thead><tr>" + cells[0].map(function (cell) { return "<th>" + inlineMarkup(cell) + "</th>"; }).join("") + "</tr></thead><tbody>" + cells.slice(1).map(function (row) { return "<tr>" + row.map(function (cell) { return "<td>" + inlineMarkup(cell) + "</td>"; }).join("") + "</tr>"; }).join("") + "</tbody></table>");
          continue;
        }
        const paragraph = [line.trim()];
        index += 1;
        while (index < lines.length && lines[index].trim() && !isBlockStart(lines, index, fence)) paragraph.push(lines[index++].trim());
        output.push("<p>" + inlineMarkup(paragraph.join(" ")) + "</p>");
      }
      return output.join("\n");
    }

    function isBlockStart(lines, index, fence) {
      const line = lines[index];
      return line.trimStart().startsWith(fence) || /^(#{1,6})\s+/.test(line) || /^>\s?/.test(line) || /^\s*[-*+]\s+/.test(line) || /^\s*\d+[.)]\s+/.test(line) || /^\s*(?:[-*_]\s*){3,}$/.test(line) || (index + 1 < lines.length && line.includes("|") && /^\s*\|?\s*:?-+:?\s*(?:\|\s*:?-+:?\s*)+\|?\s*$/.test(lines[index + 1]));
    }

    function splitTableRow(line) {
      return line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(function (cell) { return cell.trim(); });
    }

    function inlineMarkup(value) {
      const tick = String.fromCharCode(96);
      const inlineCode = new RegExp(tick + "([^" + tick + "]+)" + tick, "g");
      return escapeHtml(String(value || ""))
        .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, renderLink)
        .replace(inlineCode, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/~~([^~]+)~~/g, "<del>$1</del>")
        .replace(/(^|[^*])\*([^*]+)\*/g, "$1<em>$2</em>");
    }

    function renderLink(match, label, href) {
      if (/^(?:https?:|mailto:|#)/i.test(href)) return "<a href=\"" + escapeAttribute(href) + "\">" + label + "</a>";
      const clean = href.split("#", 1)[0];
      if (clean.toLowerCase().endsWith(".md")) return "<a href=\"#\" data-doc-link=\"" + escapeAttribute(href) + "\">" + label + "</a>";
      return label;
    }

    function slugify(value) {
      const slug = String(value || "").toLowerCase().replace(/<[^>]+>/g, "").replace(/[^\p{L}\p{N}]+/gu, "-").replace(/^-|-$/g, "");
      return escapeAttribute(slug || "section");
    }

    function escapeHtml(value) {
      return String(value).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\"/g, "&quot;").replace(/'/g, "&#39;");
    }

    function escapeAttribute(value) {
      return escapeHtml(value).replace(/\u0060/g, "&#96;");
    }

    window.DesignKB = Object.freeze({
      data: data,
      selectPath: selectDocument,
      renderMarkdown: renderMarkdown,
      makeBundle: makeBundle,
      relatedPaths: function () { return current ? relatedDocuments(current).map(function (entry) { return entry.path; }) : []; },
    });
  </script>
  <script>
    "use strict";

    const WORKSPACE_CONFIG_PATH = "docs/design-kb.config.json";
    const WORKSPACE_DB_NAME = "design-kb-workspaces";
    const WORKSPACE_STORE_NAME = "projects";
    const WORKSPACE_ALLOWED_STATUSES = new Set(["draft", "active", "deprecated", "archived"]);
    const WORKSPACE_IGNORED_DIRECTORIES = new Set(["node_modules", "logs"]);
    const workspaceElements = {
      connect: document.getElementById("connect-project"),
      refresh: document.getElementById("refresh-project"),
      create: document.getElementById("new-document"),
      edit: document.getElementById("edit-document"),
      mode: document.getElementById("workspace-mode"),
      editor: document.getElementById("editor"),
      editorPath: document.getElementById("editor-path"),
      editorId: document.getElementById("editor-id"),
      editorParent: document.getElementById("editor-parent"),
      editorOrder: document.getElementById("editor-order"),
      editorStatus: document.getElementById("editor-status"),
      editorBody: document.getElementById("editor-body"),
      cancelEdit: document.getElementById("cancel-edit"),
    };
    let workspaceRootHandle = null;
    let workspaceConfig = null;
    let workspaceRememberedHandle = null;
    let workspaceEditorMode = "";
    let workspaceEditingPath = "";
    let workspaceOriginalSource = "";
    let workspaceEditorDirty = false;
    let workspaceRefreshing = false;
    const workspaceOriginalSelectDocument = selectDocument;

    selectDocument = function (pathValue) {
      if (workspaceEditorDirty && pathValue !== workspaceEditingPath && !workspaceConfirmDiscard()) return false;
      if (workspaceEditorMode) workspaceCloseEditor(false);
      const selected = workspaceOriginalSelectDocument(pathValue);
      workspaceUpdateControls();
      return selected;
    };

    workspaceElements.connect.addEventListener("click", workspaceConnectProject);
    workspaceElements.refresh.addEventListener("click", function () { workspaceRefreshProject(false); });
    workspaceElements.create.addEventListener("click", workspaceBeginNewDocument);
    workspaceElements.edit.addEventListener("click", workspaceBeginEdit);
    workspaceElements.editor.addEventListener("submit", workspaceSaveEditor);
    workspaceElements.cancelEdit.addEventListener("click", workspaceCancelEditor);
    [workspaceElements.editorPath, workspaceElements.editorId, workspaceElements.editorParent, workspaceElements.editorOrder, workspaceElements.editorStatus, workspaceElements.editorBody]
      .forEach(function (element) {
        element.addEventListener("input", function () { workspaceEditorDirty = true; });
        element.addEventListener("change", function () { workspaceEditorDirty = true; });
      });
    if (typeof window.addEventListener === "function") {
      window.addEventListener("focus", function () {
        if (workspaceRootHandle && !workspaceEditorDirty && !workspaceRefreshing) workspaceRefreshProject(true);
      });
    }
    workspaceUpdateControls();
    workspaceRestoreProject();

    function workspaceUpdateControls() {
      const connected = Boolean(workspaceRootHandle);
      workspaceElements.refresh.disabled = !connected;
      workspaceElements.create.disabled = !connected || Boolean(workspaceEditorMode);
      workspaceElements.edit.disabled = !connected || !current || Boolean(workspaceEditorMode);
      workspaceElements.connect.textContent = connected ? "重新绑定" : (workspaceRememberedHandle ? "继续访问当前项目" : "连接当前项目");
      workspaceElements.mode.textContent = connected ? "动态项目 · Markdown 直接读写" : "静态快照";
    }

    async function workspaceConnectProject() {
      try {
        if (!workspaceRootHandle && workspaceRememberedHandle) {
          const restored = await workspaceEnsurePermission(workspaceRememberedHandle, true);
          if (restored) {
            await workspaceLoadProject(workspaceRememberedHandle);
            await workspaceStoreHandle(workspaceRememberedHandle);
            return;
          }
        }
        if (typeof window.showDirectoryPicker !== "function") {
          throw new Error("当前浏览器不支持本地目录读写，请使用桌面版 Chrome 或 Edge。");
        }
        const pickerId = "dkb-" + String(data.projectId || "project").replace(/[^a-z0-9_-]/gi, "").slice(0, 24);
        const handle = await window.showDirectoryPicker({ id: pickerId, mode: "readwrite" });
        await workspaceLoadProject(handle);
        workspaceRememberedHandle = handle;
        await workspaceStoreHandle(handle);
      } catch (error) {
        if (error && error.name === "AbortError") {
          setStatus("已取消连接，继续显示静态快照。", "warning");
        } else {
          setStatus(workspaceErrorMessage(error), "warning");
        }
      }
    }

    async function workspaceRestoreProject() {
      try {
        const handle = await workspaceReadStoredHandle();
        if (!handle) return;
        workspaceRememberedHandle = handle;
        workspaceUpdateControls();
        if (await workspaceEnsurePermission(handle, false)) {
          await workspaceLoadProject(handle);
        } else {
          setStatus("已记住当前项目；点击“继续访问当前项目”恢复目录权限。", "warning");
        }
      } catch {
        setStatus("当前显示内嵌快照；连接项目后可读取和编辑最新 Markdown。", "");
      }
    }

    async function workspaceEnsurePermission(handle, request) {
      if (!handle || typeof handle.queryPermission !== "function") return Boolean(handle);
      const options = { mode: "readwrite" };
      if (await handle.queryPermission(options) === "granted") return true;
      if (request && typeof handle.requestPermission === "function") return (await handle.requestPermission(options)) === "granted";
      return false;
    }

    async function workspaceLoadProject(rootHandle, preferredPath) {
      const configText = await workspaceReadPath(rootHandle, WORKSPACE_CONFIG_PATH);
      let config;
      try { config = JSON.parse(configText); }
      catch { throw new Error("项目中的 " + WORKSPACE_CONFIG_PATH + " 不是有效 JSON。"); }
      if (String(config.projectId || "") !== String(data.projectId || "")) {
        throw new Error("所选目录不是这个知识库所属的项目。");
      }
      const contentRoots = Array.isArray(config.contentRoots) ? config.contentRoots.map(workspaceNormalizePath).filter(Boolean) : [];
      if (!contentRoots.length) throw new Error("项目配置没有有效的 contentRoots。");
      const exclude = Array.isArray(config.exclude) ? config.exclude.map(workspaceNormalizePath).filter(Boolean) : [];
      const normalizedConfig = { ...config, contentRoots: contentRoots, exclude: exclude };
      const failures = [];
      const nextDocuments = await workspaceScanDocuments(rootHandle, normalizedConfig, failures);
      failures.push(...workspaceValidateDocuments(nextDocuments));
      if (failures.length) throw new Error("动态读取失败：" + failures.slice(0, 4).join("；"));

      const selectedPath = preferredPath || (current && current.path) || "";
      workspaceRootHandle = rootHandle;
      workspaceConfig = normalizedConfig;
      workspaceApplyDocuments(nextDocuments, String(config.title || data.title), selectedPath);
      setStatus("已连接当前项目，共读取 " + documents.length + " 篇 Markdown。", "success");
      workspaceUpdateControls();
    }

    async function workspaceRefreshProject(silent) {
      if (!workspaceRootHandle || workspaceRefreshing) return false;
      if (workspaceEditorDirty) {
        if (!silent) setStatus("请先保存或取消当前编辑，再刷新项目。", "warning");
        return false;
      }
      workspaceRefreshing = true;
      try {
        const selectedPath = current && current.path;
        await workspaceLoadProject(workspaceRootHandle, selectedPath);
        if (!silent) setStatus("已重新读取项目 Markdown。", "success");
        return true;
      } catch (error) {
        setStatus(workspaceErrorMessage(error), "warning");
        return false;
      } finally {
        workspaceRefreshing = false;
      }
    }

    function workspaceApplyDocuments(nextDocuments, title, preferredPath) {
      documents.splice(0, documents.length, ...nextDocuments);
      data.documents = documents;
      data.title = title;
      data.contentDigest = workspaceDigest(documents);
      byPath.clear();
      byId.clear();
      children.clear();
      documents.forEach(function (record) {
        byPath.set(record.path, record);
        byId.set(record.id, record);
        const parent = record.parent || "";
        const entries = children.get(parent) || [];
        entries.push(record);
        children.set(parent, entries);
      });
      children.forEach(function (entries) { entries.sort(compareDocuments); });
      elements.title.textContent = data.title;
      document.title = data.title;
      elements.count.textContent = documents.length + " 篇";
      elements.digest.textContent = data.contentDigest.slice(0, 12);
      workspaceEditorDirty = false;
      workspaceCloseEditor(false);
      current = null;
      renderTree();
      const selected = byPath.get(preferredPath) || (children.get("") || [])[0] || documents[0];
      if (selected) workspaceOriginalSelectDocument(selected.path);
    }

    async function workspaceScanDocuments(rootHandle, config, failures) {
      const byScannedPath = new Map();
      for (const contentRoot of config.contentRoots) {
        try {
          const directory = await workspaceGetDirectory(rootHandle, contentRoot, false);
          await workspaceWalkDirectory(directory, contentRoot, config, byScannedPath, failures);
        } catch (error) {
          failures.push("缺少内容目录 " + contentRoot + "（" + workspaceErrorMessage(error) + "）");
        }
      }
      return [...byScannedPath.values()].sort(function (left, right) { return left.path.localeCompare(right.path, "en"); });
    }

    async function workspaceWalkDirectory(directoryHandle, relativeDirectory, config, output, failures) {
      const entries = [];
      for await (const pair of directoryHandle.entries()) entries.push(pair);
      entries.sort(function (left, right) { return left[0].localeCompare(right[0], "en"); });
      for (const pair of entries) {
        const name = pair[0];
        const handle = pair[1];
        if (name.startsWith(".") || WORKSPACE_IGNORED_DIRECTORIES.has(name.toLowerCase())) continue;
        const relative = relativeDirectory + "/" + name;
        if (workspaceIsExcluded(relative, config.exclude)) continue;
        if (handle.kind === "directory") {
          await workspaceWalkDirectory(handle, relative, config, output, failures);
          continue;
        }
        if (handle.kind !== "file" || !name.toLowerCase().endsWith(".md") || output.has(relative)) continue;
        const file = await handle.getFile();
        const source = (await file.text()).replace(/\r\n/g, "\n");
        const parsed = workspaceParseDocument(relative, source, handle, Number(file.lastModified || 0));
        failures.push(...parsed.failures);
        output.set(relative, parsed.document);
      }
    }

    function workspaceParseDocument(pathValue, source, fileHandle, lastModified) {
      const failures = [];
      const metadata = {};
      let body = source;
      if (!source.startsWith("---\n")) {
        failures.push(pathValue + " 缺少 front matter");
      } else {
        const closing = source.indexOf("\n---\n", 4);
        if (closing < 0) {
          failures.push(pathValue + " 的 front matter 没有结束标记");
        } else {
          const block = source.slice(4, closing);
          body = source.slice(closing + 5).replace(/^\n/, "");
          block.split("\n").forEach(function (rawLine) {
            if (!rawLine.trim() || rawLine.trimStart().startsWith("#")) return;
            const match = rawLine.match(/^([A-Za-z0-9_-]+):(?:\s*(.*))?$/);
            if (!match) failures.push(pathValue + " 的 front matter 行无效：" + rawLine);
            else metadata[match[1]] = workspaceDecodeScalar(match[2] || "");
          });
        }
      }
      ["id", "parent", "order", "status"].forEach(function (field) {
        if (!Object.prototype.hasOwnProperty.call(metadata, field)) failures.push(pathValue + " 缺少字段 " + field);
      });
      if (metadata.id && !/^[a-z0-9][a-z0-9-]*$/.test(metadata.id)) failures.push(pathValue + " 的 id 无效");
      if (metadata.order !== undefined && !/^-?\d+$/.test(metadata.order)) failures.push(pathValue + " 的 order 必须是整数");
      if (metadata.status && !WORKSPACE_ALLOWED_STATUSES.has(metadata.status)) failures.push(pathValue + " 的 status 无效");
      const titleMatch = body.match(/^#\s+(.+?)\s*$/m);
      if (!titleMatch) failures.push(pathValue + " 缺少一级标题");
      return {
        failures: failures,
        document: {
          path: pathValue,
          title: titleMatch ? titleMatch[1].trim() : pathValue.split("/").at(-1).replace(/\.md$/i, ""),
          id: metadata.id || "",
          parent: metadata.parent || "",
          order: Number(metadata.order || 0),
          status: metadata.status || "draft",
          source: source,
          body: body,
          fileHandle: fileHandle || null,
          lastModified: lastModified || 0,
        },
      };
    }

    function workspaceValidateDocuments(records) {
      const failures = [];
      const ids = new Map();
      const paths = new Map(records.map(function (record) { return [record.path, record]; }));
      records.forEach(function (record) {
        const entries = ids.get(record.id) || [];
        entries.push(record);
        ids.set(record.id, entries);
      });
      ids.forEach(function (entries, id) {
        if (!id || entries.length > 1) failures.push("文档 ID 重复或为空：" + (id || "(empty)"));
      });
      let roots = 0;
      records.forEach(function (record) {
        if (!record.parent) roots += 1;
        if (record.parent === record.id) failures.push(record.path + " 不能以自己作为父文档");
        if (record.parent && (ids.get(record.parent) || []).length !== 1) failures.push(record.path + " 的父文档不存在或不唯一：" + record.parent);
        const seen = new Set();
        let cursor = record;
        while (cursor && cursor.id) {
          if (seen.has(cursor.id)) { failures.push(record.path + " 存在父级循环"); break; }
          seen.add(cursor.id);
          cursor = cursor.parent && (ids.get(cursor.parent) || []).length === 1 ? ids.get(cursor.parent)[0] : null;
        }
        workspaceValidateLinks(record, paths, failures);
      });
      if (!roots) failures.push("知识库至少需要一个根文档");
      return [...new Set(failures)];
    }

    function workspaceValidateLinks(record, paths, failures) {
      const searchable = String(record.body || stripFrontMatter(record.source)).replace(/```[\s\S]*?```/g, "");
      const pattern = /\[[^\]]+\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g;
      for (const match of searchable.matchAll(pattern)) {
        const href = match[1];
        if (!href || href.startsWith("#") || /^[a-z][a-z0-9+.-]*:/i.test(href)) continue;
        let target;
        try { target = decodeURIComponent(href.split("#", 1)[0]); }
        catch { failures.push(record.path + " 包含无效链接：" + href); continue; }
        if (!target.toLowerCase().endsWith(".md")) continue;
        const resolved = workspaceResolvePath(record.path, target);
        if (!resolved || !paths.has(resolved)) failures.push(record.path + " 找不到链接目标：" + href);
      }
    }

    function workspaceBeginEdit() {
      if (!workspaceRootHandle || !current) return;
      workspaceOpenEditor("edit", current);
    }

    function workspaceBeginNewDocument() {
      if (!workspaceRootHandle || !workspaceConfig) return;
      let suffix = 1;
      let id = "new-document";
      while (byId.has(id)) id = "new-document-" + (++suffix);
      const parent = current ? current.id : "";
      const siblings = children.get(parent) || [];
      workspaceOpenEditor("new", {
        path: workspaceConfig.contentRoots[0] + "/" + id + ".md",
        id: id,
        parent: parent,
        order: siblings.length ? Math.max(...siblings.map(function (entry) { return entry.order; })) + 10 : 10,
        status: "draft",
        source: "---\nid: " + id + "\nparent: " + parent + "\norder: 10\nstatus: draft\n---\n\n# 新文档\n",
      });
    }

    function workspaceOpenEditor(mode, record) {
      workspaceEditorMode = mode;
      workspaceEditingPath = mode === "edit" ? record.path : "";
      workspaceOriginalSource = mode === "edit" ? record.source : "";
      workspaceEditorDirty = false;
      workspaceElements.editorPath.disabled = mode === "edit";
      workspaceElements.editorId.disabled = mode === "edit";
      workspaceElements.editorPath.value = record.path;
      workspaceElements.editorId.value = record.id;
      workspaceElements.editorOrder.value = String(record.order);
      workspaceElements.editorStatus.value = record.status;
      workspaceElements.editorBody.value = stripFrontMatter(record.source);
      workspacePopulateParents(mode === "edit" ? record.id : "", record.parent || "");
      elements.preview.hidden = true;
      workspaceElements.editor.hidden = false;
      elements.documentTitle.textContent = mode === "edit" ? "编辑：" + record.title : "新建文档";
      elements.documentPath.textContent = mode === "edit" ? record.path : "保存后加入当前知识库";
      workspaceUpdateControls();
    }

    function workspacePopulateParents(editingId, selectedParent) {
      workspaceElements.editorParent.replaceChildren();
      const rootOption = document.createElement("option");
      rootOption.value = "";
      rootOption.textContent = "（根文档）";
      workspaceElements.editorParent.appendChild(rootOption);
      documents.slice().sort(compareDocuments).forEach(function (record) {
        if (record.id === editingId) return;
        const option = document.createElement("option");
        option.value = record.id;
        option.textContent = record.title + " · " + record.id;
        workspaceElements.editorParent.appendChild(option);
      });
      workspaceElements.editorParent.value = selectedParent;
    }

    function workspaceCancelEditor() {
      if (workspaceEditorDirty && !workspaceConfirmDiscard()) return;
      workspaceCloseEditor(true);
    }

    function workspaceCloseEditor(restoreSelection) {
      workspaceEditorMode = "";
      workspaceEditingPath = "";
      workspaceOriginalSource = "";
      workspaceEditorDirty = false;
      workspaceElements.editor.hidden = true;
      elements.preview.hidden = false;
      if (restoreSelection && current) workspaceOriginalSelectDocument(current.path);
      workspaceUpdateControls();
    }

    function workspaceConfirmDiscard() {
      return typeof window.confirm !== "function" || window.confirm("当前修改尚未保存，确定放弃吗？");
    }

    async function workspaceSaveEditor(event) {
      if (event && typeof event.preventDefault === "function") event.preventDefault();
      if (!workspaceRootHandle || !workspaceConfig || !workspaceEditorMode) return false;
      try {
        const pathValue = workspaceNormalizePath(workspaceElements.editorPath.value);
        const id = workspaceElements.editorId.value.trim();
        const parent = workspaceElements.editorParent.value.trim();
        const orderText = workspaceElements.editorOrder.value.trim();
        const status = workspaceElements.editorStatus.value;
        const body = workspaceElements.editorBody.value.replace(/\r\n/g, "\n").trimEnd() + "\n";
        if (!pathValue || !pathValue.toLowerCase().endsWith(".md")) throw new Error("请输入内容目录内的有效 .md 路径。");
        if (!workspaceConfig.contentRoots.some(function (root) { return pathValue.startsWith(root + "/"); })) throw new Error("新文档必须位于配置的 contentRoots 内。");
        if (workspaceIsExcluded(pathValue, workspaceConfig.exclude)) throw new Error("该路径已被项目配置排除。");
        if (!/^-?\d+$/.test(orderText)) throw new Error("顺序必须是整数。");
        const source = workspaceComposeSource(workspaceOriginalSource, { id: id, parent: parent, order: orderText, status: status }, body);
        const parsed = workspaceParseDocument(pathValue, source, null, 0);
        if (parsed.failures.length) throw new Error(parsed.failures.join("；"));
        const existingRecord = workspaceEditorMode === "edit" ? byPath.get(workspaceEditingPath) : null;
        if (workspaceEditorMode === "new" && byPath.has(pathValue)) throw new Error("该 Markdown 路径已经存在。");
        parsed.document.fileHandle = existingRecord && existingRecord.fileHandle;
        const candidates = workspaceEditorMode === "edit"
          ? documents.map(function (record) { return record.path === workspaceEditingPath ? parsed.document : record; })
          : documents.concat(parsed.document);
        const validationFailures = workspaceValidateDocuments(candidates);
        if (validationFailures.length) throw new Error(validationFailures.slice(0, 4).join("；"));

        let fileHandle;
        if (workspaceEditorMode === "edit") {
          if (!existingRecord || !existingRecord.fileHandle) throw new Error("当前文档没有可写文件句柄，请刷新项目后重试。");
          const latest = await workspaceReadFile(existingRecord.fileHandle);
          if (latest.source !== workspaceOriginalSource) throw new Error("文件已被其他程序修改，请取消编辑并刷新后再试。");
          fileHandle = existingRecord.fileHandle;
        } else {
          const existingHandle = await workspaceFindFile(workspaceRootHandle, pathValue);
          if (existingHandle) throw new Error("磁盘上已经存在同名文件。");
          fileHandle = await workspaceGetFile(workspaceRootHandle, pathValue, true);
        }
        await workspaceWriteFile(fileHandle, source);
        await workspaceLoadProject(workspaceRootHandle, pathValue);
        setStatus("已保存 " + pathValue + "。", "success");
        return true;
      } catch (error) {
        setStatus(workspaceErrorMessage(error), "warning");
        return false;
      }
    }

    function workspaceComposeSource(originalSource, metadata, body) {
      const extra = [];
      const normalized = String(originalSource || "").replace(/\r\n/g, "\n");
      if (normalized.startsWith("---\n")) {
        const closing = normalized.indexOf("\n---\n", 4);
        if (closing >= 0) {
          normalized.slice(4, closing).split("\n").forEach(function (line) {
            if (!/^(?:id|parent|order|status):(?:\s|$)/.test(line)) extra.push(line);
          });
        }
      }
      const frontMatter = [
        "---",
        "id: " + metadata.id,
        "parent: " + metadata.parent,
        "order: " + metadata.order,
        "status: " + metadata.status,
      ];
      if (extra.some(function (line) { return line.trim(); })) frontMatter.push(...extra);
      frontMatter.push("---", "", String(body || "").trimEnd(), "");
      return frontMatter.join("\n");
    }

    async function workspaceReadPath(rootHandle, pathValue) {
      const handle = await workspaceGetFile(rootHandle, pathValue, false);
      return (await workspaceReadFile(handle)).source;
    }

    async function workspaceReadFile(fileHandle) {
      const file = await fileHandle.getFile();
      return { source: (await file.text()).replace(/\r\n/g, "\n"), lastModified: Number(file.lastModified || 0) };
    }

    async function workspaceWriteFile(fileHandle, source) {
      const writable = await fileHandle.createWritable();
      try {
        await writable.write(source);
        await writable.close();
      } catch (error) {
        if (typeof writable.abort === "function") {
          try { await writable.abort(); } catch { /* The original write failure is more useful. */ }
        }
        throw error;
      }
    }

    async function workspaceGetDirectory(rootHandle, pathValue, create) {
      let directory = rootHandle;
      const normalized = workspaceNormalizePath(pathValue);
      if (!normalized) throw new Error("目录路径无效：" + pathValue);
      for (const part of normalized.split("/")) directory = await directory.getDirectoryHandle(part, { create: Boolean(create) });
      return directory;
    }

    async function workspaceGetFile(rootHandle, pathValue, create) {
      const normalized = workspaceNormalizePath(pathValue);
      if (!normalized) throw new Error("文件路径无效：" + pathValue);
      const parts = normalized.split("/");
      const filename = parts.pop();
      let directory = rootHandle;
      for (const part of parts) directory = await directory.getDirectoryHandle(part, { create: Boolean(create) });
      return directory.getFileHandle(filename, { create: Boolean(create) });
    }

    async function workspaceFindFile(rootHandle, pathValue) {
      try { return await workspaceGetFile(rootHandle, pathValue, false); }
      catch (error) {
        if (error && (error.name === "NotFoundError" || error.name === "TypeMismatchError")) return null;
        throw error;
      }
    }

    function workspaceNormalizePath(value) {
      const normalized = String(value || "").trim().replace(/\\/g, "/").replace(/^\.\//, "");
      if (!normalized || normalized.startsWith("/") || /^[A-Za-z]:/.test(normalized)) return "";
      const parts = normalized.split("/");
      if (parts.some(function (part) { return !part || part === "." || part === ".."; })) return "";
      return parts.join("/");
    }

    function workspaceIsExcluded(pathValue, exclude) {
      return exclude.some(function (entry) { return pathValue === entry || pathValue.startsWith(entry + "/"); });
    }

    function workspaceResolvePath(currentPath, relativePath) {
      const base = currentPath.split("/").slice(0, -1);
      const parts = base.concat(String(relativePath || "").replace(/\\/g, "/").split("/"));
      const normalized = [];
      for (const part of parts) {
        if (!part || part === ".") continue;
        if (part === "..") {
          if (!normalized.length) return "";
          normalized.pop();
        } else normalized.push(part);
      }
      return normalized.join("/");
    }

    function workspaceDecodeScalar(value) {
      const trimmed = String(value || "").trim();
      if (trimmed.length >= 2 && trimmed[0] === trimmed.at(-1) && (trimmed[0] === "\"" || trimmed[0] === "'")) {
        return trimmed.slice(1, -1).replace(/\\\"/g, "\"").replace(/\\\\/g, "\\");
      }
      return trimmed;
    }

    function workspaceDigest(records) {
      const input = records.map(function (record) { return record.path + "\n" + record.source; }).join("\n---\n");
      let hash = 2166136261;
      for (let index = 0; index < input.length; index += 1) {
        hash ^= input.charCodeAt(index);
        hash = Math.imul(hash, 16777619);
      }
      return "live-" + ("00000000" + (hash >>> 0).toString(16)).slice(-8);
    }

    function workspaceErrorMessage(error) {
      return error && error.message ? error.message : String(error || "未知错误");
    }

    async function workspaceOpenDb() {
      if (!window.indexedDB) return null;
      return new Promise(function (resolve, reject) {
        const request = window.indexedDB.open(WORKSPACE_DB_NAME, 1);
        request.onupgradeneeded = function () {
          if (!request.result.objectStoreNames.contains(WORKSPACE_STORE_NAME)) request.result.createObjectStore(WORKSPACE_STORE_NAME);
        };
        request.onsuccess = function () { resolve(request.result); };
        request.onerror = function () { reject(request.error); };
      });
    }

    async function workspaceReadStoredHandle() {
      const database = await workspaceOpenDb();
      if (!database) return null;
      return new Promise(function (resolve, reject) {
        const transaction = database.transaction(WORKSPACE_STORE_NAME, "readonly");
        const request = transaction.objectStore(WORKSPACE_STORE_NAME).get(data.projectId);
        request.onsuccess = function () { resolve(request.result || null); };
        request.onerror = function () { reject(request.error); };
        transaction.oncomplete = function () { database.close(); };
      });
    }

    async function workspaceStoreHandle(handle) {
      const database = await workspaceOpenDb();
      if (!database) return;
      await new Promise(function (resolve, reject) {
        const transaction = database.transaction(WORKSPACE_STORE_NAME, "readwrite");
        transaction.objectStore(WORKSPACE_STORE_NAME).put(handle, data.projectId);
        transaction.oncomplete = function () { resolve(); };
        transaction.onerror = function () { reject(transaction.error); };
      });
      database.close();
    }

    const workspaceBaseApi = window.DesignKB;
    window.DesignKB = Object.freeze({
      ...workspaceBaseApi,
      selectPath: selectDocument,
      loadProjectHandle: workspaceLoadProject,
      refreshProject: workspaceRefreshProject,
      beginEdit: workspaceBeginEdit,
      beginNewDocument: workspaceBeginNewDocument,
      saveEditor: workspaceSaveEditor,
      parseDocument: workspaceParseDocument,
      validateDocuments: workspaceValidateDocuments,
      composeDocumentSource: workspaceComposeSource,
      workspaceConnected: function () { return Boolean(workspaceRootHandle); },
      currentPath: function () { return current ? current.path : ""; },
      relatedPaths: function () { return current ? relatedDocuments(current).map(function (entry) { return entry.path; }) : []; },
    });
  </script>
</body>
</html>
