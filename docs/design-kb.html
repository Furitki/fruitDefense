veloper login; keep credentials outside Git.\n2. Review and install one official TTSDK package and Douyin IDE `4.5.2` candidate in the isolated platform worktree. Do not call either version pinned yet.\n3. Copy `douyin-toolchain-pin-template.json` to a non-template pin file and fill every applicable version only after it is directly observed.\n4. Compile, export WebGL, convert, then repeat from a clean checkout; record SHA-256 values for logs and generated manifests.\n5. Copy `douyin-evidence-manifest-template.json` to `docs/platform/douyin-evidence/manifest.json` and complete simulator, Android, iOS, remote-content, and Wasm rows. Each `artifacts` item must contain a manifest-relative `path` and matching `sha256`.\n6. Re-run `scripts/check-douyin-readiness.ps1`; keep the gate Yellow until all blocking rows have evidence.\n\n## Next action\n\nRetain the Yellow gate. An authorized operator must provide platform access, then run tasks 3.1 through 3.6 in the OpenSpec change. Start `add-douyin-runtime-adapter` only after all blocking rows in `douyin-compatibility-report.json` are Green.\n"},{"path":"docs/platform/wechat-official-references.md","title":"WeChat Mini Game Unity 6 compatibility references","id":"wechat-official-references","parent":"wechat-spike-status","order":10,"status":"active","source":"---\nid: wechat-official-references\nparent: wechat-spike-status\norder: 10\nstatus: active\n---\n\n# WeChat Mini Game Unity 6 compatibility references\n\nRetrieved and checked on 2026-07-15. Only WeChat official documentation and repositories owned by `wechat-miniprogram` are used as platform evidence.\n\n## Adapter and conversion toolchain\n\n- Official SDK repository: \u003chttps://github.com/wechat-miniprogram/minigame-tuanjie-transform-sdk>\n- Immutable `main` observation: `ed4ad28f433c6b52b5fd3f22a6fa155a0c98c228` from `git ls-remote` on 2026-07-15.\n- Official package manifest at that commit: \u003chttps://github.com/wechat-miniprogram/minigame-tuanjie-transform-sdk/blob/ed4ad28f433c6b52b5fd3f22a6fa155a0c98c228/package.json>\n- Official changelog at that commit: \u003chttps://github.com/wechat-miniprogram/minigame-tuanjie-transform-sdk/blob/ed4ad28f433c6b52b5fd3f22a6fa155a0c98c228/CHANGELOG.md>\n- Official installation/readme at that commit: \u003chttps://github.com/wechat-miniprogram/minigame-tuanjie-transform-sdk/blob/ed4ad28f433c6b52b5fd3f22a6fa155a0c98c228/README.md>\n\nThe observed changelog starts with `v0.1.33` dated 2026-06-22, while `package.json` still declares `0.1.1`. The SDK is therefore not considered reproducibly pinned by either semantic version alone. A later isolated integration must lock the exact successfully tested Git commit.\n\nThe changelog records Unity 6 support as a preview when introduced and contains subsequent adapter work, but it does not establish that FruitDefense's exact Unity `6000.3.19f1` build is production-compatible. Compile, conversion, simulator, and device evidence remain mandatory.\n\n## Developer Tools and preview\n\n- Official WeChat Developer Tools download: \u003chttps://developers.weixin.qq.com/miniprogram/dev/devtools/download.html>\n- The official SDK README instructs users to install the **Stable** Developer Tools channel and explicitly says not to use the Minigame Build edition for this adapter workflow.\n- Official WeChat preview plugin repository: \u003chttps://github.com/wechat-miniprogram/minigame-unity-wechat-preview>\n\nThe preview plugin can shorten API/input/audio feedback loops, but it is a WebRTC preview path and is not accepted as conversion or physical-device stability evidence.\n\n## Lifecycle and code-package update\n\n- `wx.onShow`: \u003chttps://developers.weixin.qq.com/minigame/dev/api/base/app/life-cycle/wx.onShow.html>\n- `wx.onHide`: \u003chttps://developers.weixin.qq.com/minigame/dev/api/base/app/life-cycle/wx.onHide.html>\n- `wx.getUpdateManager`: \u003chttps://developers.weixin.qq.com/minigame/dev/api/base/update/wx.getUpdateManager.html>\n- `UpdateManager.applyUpdate`: \u003chttps://developers.weixin.qq.com/minigame/dev/api/base/update/UpdateManager.applyUpdate.html>\n\nThe update manager is treated as a reviewed code-package mechanism whose downloaded update is applied through restart. It is not an in-process DLL, Lua, or arbitrary-code hot replacement mechanism.\n\n## Content, cache, subpackages, and Wasm\n\n- `wx.loadSubpackage`: \u003chttps://developers.weixin.qq.com/minigame/dev/api/base/subpackage/wx.loadSubpackage.html>\n- High-performance-plus mode: \u003chttps://developers.weixin.qq.com/minigame/dev/guide/performance/perf-high-performance-plus.html>\n- The official SDK changelog records WXAssetBundle, browser fallback to UnityWebRequest, CDN switching, cache controls, predownload headers, first-resource-package/subpackage behavior, and multiple generations of Wasm splitting support.\n\nThese are separate mechanisms:\n\n- Remote catalog/AssetBundle/Addressables content may change only within types already supported by the shipped code.\n- `UpdateManager` applies code packages through restart.\n- Ordinary subpackages and Wasm splitting improve package layout/startup and are not the project's content hot-update protocol.\n\nThe changelog notes a 30 MB first-resource-package total when placed in a mini-game subpackage (2024-12-18), but this spike does not infer current global code-package limits from that note. Current main/total/single-subpackage limits remain nullable until verified against the selected Developer Tools/base-library/publishing policy.\n\n## Required evidence before Green\n\nThe gate requires exact version metadata and logs for:\n\n1. Unity WebGL export and official SDK conversion.\n2. Stable Developer Tools simulator launch, touch, audio, lifecycle, HTTPS/cache, update callbacks, remote content, subpackages, and Wasm splitting.\n3. Android and iOS cold/warm launch, the same functional checks, a complete battle, and 30 minutes of repeated play.\n4. Package sizes, memory/crash/OOM observations, and fallback behavior for unavailable or invalid remote content.\n"},{"path":"docs/platform/wechat-spike-status.md","title":"WeChat Unity 6.3 spike status","id":"wechat-spike-status","parent":"design-kb-home","order":60,"status":"active","source":"---\nid: wechat-spike-status\nparent: design-kb-home\norder: 60\nstatus: active\n---\n\n# WeChat Unity 6.3 spike status\n\nGenerated from `scripts/check-wechat-readiness.ps1` on 2026-07-15.\n\n## Decision\n\n**Overall gate: Yellow.** FruitDefense's ordinary Unity/WebGL baseline is healthy, but WeChat conversion and release compatibility are not yet proven. `WeChatMiniGame` must remain explicitly unavailable. This report does not authorize `add-wechat-runtime-adapter`, and the Web adapter must not silently stand in for WeChat.\n\nThe later WeChat adapter remains behind both conditions from the plan: this gate must become Green, and the Douyin-first release path must already be stable.\n\n## Status rules\n\n- **Green:** the required command, immutable artifact, simulator run, or physical-device run exists with exact environment/version evidence.\n- **Yellow:** a prerequisite or manual platform run is missing, or a tool is present but not pinned and proven. Yellow does not authorize integration.\n- **Red:** the pinned toolchain reproduces an incompatibility on a clean retry, or a required baseline cannot build. Red requires a separate engine/toolchain proposal rather than a disguised Web fallback.\n\n## Current matrix\n\n| Area | Status | Current evidence | Green requirement |\n|---|---|---|---|\n| Unity editor | Green | Unity `6000.3.19f1` installed | Keep the exact baseline pinned |\n| WebGL module | Green | Matching WebGL Build Support installed | Keep it on developer/CI machines |\n| Node tooling | Green, non-blocking | Node `v24.14.0` found | Pin only if selected tooling requires Node |\n| Unity smoke | Green | `FRUIT_DEFENSE_SMOKE_OK` | Re-run after platform integration |\n| Ordinary WebGL export | Green | `Builds/WebGL/index.html`, 8,066,271 total bytes | Rebuild before official conversion |\n| Official WXSDK/converter | Yellow | Not installed; official candidate `ed4ad28f433c6b52b5fd3f22a6fa155a0c98c228` observed | Review, lock, compile, and convert the exact commit |\n| SDK version metadata | Yellow | Changelog `0.1.33`; package manifest `0.1.1` | Use immutable tested commit plus both observed versions |\n| Stable Developer Tools | Yellow | Not found | Install Stable edition and record exact version |\n| AppID/developer session | Yellow | Presence flags false | Authorized local credentials; never commit values |\n| Converted mini-game | Yellow | No converted `game.js` project | Produce with pinned SDK/tools and statically validate |\n| Simulator | Yellow | No run evidence | Launch, touch, audio, lifecycle, HTTPS/cache, update, content, subpackage, Wasm checks |\n| Android device | Yellow | No physical-device evidence | Cold/warm start, one battle, lifecycle/update/cache, 30 minutes |\n| iOS device | Yellow | No physical-device evidence | Cold/warm start, one battle, lifecycle/update/cache, 30 minutes |\n| Code-package update | Yellow | No `wx.getUpdateManager`/`applyUpdate` evidence | Prove callbacks and restart application outside battle |\n| Remote content/cache | Yellow | No WXAssetBundle/Addressables/UnityWebRequest matrix | Prove cold/warm cache and target -> last-good -> bundled fallback |\n| Ordinary subpackages | Yellow | No `wx.loadSubpackage` evidence | Prove package layout/loading separately from content hot update |\n| Wasm splitting | Yellow | No function/startup evidence | Cover Bootstrap, Lobby, first battle, lifecycle, update UI on both OS families |\n| Stability | Yellow | No device soak | Android and iOS 30-minute runs without crash/OOM |\n\n## Version evidence\n\n- Project: Unity `6000.3.19f1` revision `7689f4515d75`.\n- Official SDK repository: `wechat-miniprogram/minigame-tuanjie-transform-sdk`.\n- Official `main` observed on 2026-07-15: `ed4ad28f433c6b52b5fd3f22a6fa155a0c98c228`.\n- Official metadata mismatch: changelog `v0.1.33` (2026-06-22), package manifest `0.1.1`.\n- Developer Tools, WeChat client, base library, host baseline: not installed/recorded, therefore unpinned.\n\nThe official commit is a reviewed candidate, not a claimed compatible pin. Task 3.1 remains open until that exact or another reviewed official commit compiles and converts Unity `6000.3.19f1` with an exact Stable Developer Tools version.\n\n## Required unblock sequence\n\n1. Authorize an isolated install/review of the official WXSDK commit and a Stable WeChat Developer Tools release.\n2. Provide authorized AppID and Developer Tools login/session locally; keep credentials outside Git.\n3. Compile and convert the ordinary WebGL baseline, record immutable SDK/tool/base-library versions, and statically validate the converted project.\n4. Complete the simulator functional matrix.\n5. Complete Android and iOS functional and 30-minute stability matrices.\n6. Validate WXAssetBundle or Addressables plus UnityWebRequest fallback, ordinary subpackages, and Wasm splitting as separate mechanisms.\n7. Re-run `scripts/check-wechat-readiness.ps1 -RequireGreen`. Only a zero exit after every blocking row has evidence can authorize later adapter work.\n\n## Explicit boundary\n\nNo gameplay, ProjectSettings, Build Settings, SDK dependency, account state, upload, or production release was changed by this spike. Ordinary WebGL success is not recorded as WeChat conversion success, preview is not accepted as physical-device evidence, and package/Wasm splitting is not treated as runtime code hot replacement.\n"},{"path":"docs/ui/ui-visual-system.md","title":"Fruit Defense 运行时 UI 视觉系统","id":"ui-visual-system","parent":"design-kb-home","order":45,"status":"active","source":"---\nid: ui-visual-system\nparent: design-kb-home\norder: 45\nstatus: active\n---\n\n# Fruit Defense 运行时 UI 视觉系统\n\n## 1. 文档目的与批准方向\n\n本文是 Bootstrap、Lobby、Battle 应用层界面、阻塞浮层和 Settlement 的稳定视觉规范。它定义跨页面应长期保持的语义、组件 anatomy、状态语言、美术生产规则和审查标准，不记录某次构建、截图、平台状态或验收结论。\n\n发布视觉方向为已批准的「晴空纸张果园」：晴空蓝页面边缘、暖白纸张表面、泥土棕文字与玩法舞台、叶绿主操作、阳光黄阶段/选中强调、克制果红危险提示、圆润可读轮廓、浅阴影，以及不遮挡必要信息的叶片与水果角饰。外部参考图本身不能直接裁切为生产资源，其中的中文、玩法内容、命令和坐标也不是运行时权威；但任务明确指定或用户明确批准的参考图视觉参数，对该次变更涉及的视觉范围属于 P0 权威，优先于本文的通用风格建议。项目自有、经过明确评审的 ImageGen 输出可以按第 8 节合同成为指定 UI 表面的固定像素源，但原始生成 sheet 本身不进入 release dependency graph。\n\nproduction registry 只保留一套完整、已批准的晴空纸张果园 treatment。被替代或被否决的 source、runtime export 与 ArtSet 定义必须删除；OpenSpec 中保留的历史审查证据不是可激活资源，也不能参与 release dependency graph。\n\n## 2. 所有权与边界\n\n| 内容 | 唯一所有者 | 本文的约束 |\n| --- | --- | --- |\n| 稳定视觉语义、组件 anatomy、状态矩阵、美术生产与审查规则 | 本文 | 设计、美术和工程共同遵守 |\n| 精确颜色、字体引用、字号、行高、间距数值、圆角、描边、透明度、动效时长、缩放值和 active ArtSet 引用 | 单一 [release RuntimeUiTheme asset](../../Assets/UI/Theme/ReleaseRuntimeUiTheme.asset) | 本文只定义角色和关系，不复制序列化值 |\n| 纹理、Sprite、切片数据、稳定 set ID、revision 和完整语义槽映射 | `RuntimeUiArtSet` asset | 每个槽恰好一个资源；禁止继承、缺省和混用 |\n| 页面 copy、资源数值、命令和显隐条件 | 各 route presenter | 只能把内容与显式状态交给共享组件，不能定义局部视觉主题 |\n| draw/hit 几何、safe-area 投影和交互矩形 | 现有 Shell/Battle 布局 authority | 样式和换资源不能新增第二套矩形或移动点击/拖拽区域 |\n| 地形、植物、武器、敌人、战斗特效和关卡级配色 | gameplay content / level presentation | 不属于 UI ArtSet，不得因替换 UI 资源而改变 |\n| 变更需求、实施任务和一次性审批证据 | 对应 OpenSpec change | 不复制到本文成为长期状态记录 |\n\n精确值和具体引用始终以上表链接的 release theme asset 为准；稳定的主题审查、候选预览与激活入口是 Unity 菜单 `Fruit Defense/UI/Visual System`。本文只保留已接受的长期规则与权威入口，不复制构建哈希、日期、截图结论或平台声明。\n\n### 2.1 范围内\n\n- `Bootstrap → Lobby → Battle → Settlement` 全流程的应用 chrome。\n- screen/safe-area 表面、标准/抬升面板、卡片、按钮、指标、状态、工具槽、详情卡、模态和结果卡。\n- 共享 UI 图标、状态标记、九宫格表面及其生产导入规则。\n- 全屏与带顶部/底部 inset 的竖屏安全区表现。\n\n### 2.2 范围外\n\n- 导航合法性、命令、战斗规则、平衡、存档、快照、内容身份和平台适配。\n- 关卡地形、植物/武器/敌人主图与战斗特效的重绘。\n- uGUI/UI Toolkit 迁移、运行时皮肤选择器、远程资源或兼容主题。\n- 为适配美术而改变现有布局、点击区域或拖拽几何。\n\n### 2.3 后续需求入口\n\n任何新的玩家可见 UI 需求在提案或实施前，必须先读取本文和 `openspec/specs/` 下受影响的当前能力规格。默认是在既有语义、组件和验收合同上增量演进；如果新需求要改变这些标准，OpenSpec 必须明确列出保留、修改和新增的规则，并在验收后同步回本文及对应主规格。`openspec/changes/archive/` 只保存决策过程和证据，不替代当前规范。\n\n## 3. 视觉基础\n\n### 3.1 语义颜色\n\n代码和 Presenter 只使用 release theme 中的语义角色，不创建 `LobbyGreen`、`BattleBrown` 之类页面色：\n\n- `edge-background`：安全区外或设计画布边缘的稳定背景。\n- `surface-base`：温暖浅色基础表面。\n- `surface-raised`：比基础面更高一层的卡片、顶栏和浮层。\n- `action-primary`：叶绿主操作。\n- `action-secondary`：次一级实心操作。\n- `selection-accent`：阳光色选中、聚焦和关键强调。\n- `success`、`warning`、`danger`：成功、警告和危险/错误。\n- `disabled`：柔和鼠尾草方向的不可用语义。\n- `scrim`：暖棕向遮罩，不能使用纯黑框住页面。\n- `text-primary`、`text-secondary`、`text-inverse`：主文字、辅助文字和深色/高彩表面的反白文字。\n\nAction 颜色必须以 `container/content` 语义对定义，而不是让文字或图标各自携带固定颜色。至少包含 `primary.container/content`、`secondary.container/content`、`quiet.container/content`、`danger.container/content`、`mode-active.container/content` 与 `disabled.container/content`。`content` 同时约束按钮上的文字、操作图标和紧凑倍率；相同图标轮廓放到不同 container 时必须解析为对应的 content 色。\n\n颜色只是状态的一条线索。selected、mode-active、disabled、loading、success、warning、error 和拖拽反馈还必须具有轮廓、图标、文字、透明度或形状中的至少一个非颜色线索。所有精确色值和受测前景/背景组合由 `RuntimeUiTheme` 持有。按钮文字与实际渲染 container 的对比度不得低于 `4.5:1`；操作图标发布目标同样为 `4.5:1`，任何情况下不得低于 `3:1`；用于识别组件边界、焦点或状态的非文字线索不得低于 `3:1`。这些门槛按最终合成像素验证，不以源图色值或单张素材代替。\n\n### 3.1.1 参考参数优先级与对比度修正顺序\n\n- 对当前视觉范围，参考图中被明确指定或批准的颜色、明度、形状、比例、边框、阴影和质感等参数是 P0 输入，必须按参考保留。本文的色彩、材质和组件建议只在没有参考图时用于自行设计，或补齐参考未定义的参数；不得用通用合同覆盖、折中或“校正”参考参数。\n- P0 指的是参考图所控制的视觉参数，不代表把参考文件直接加入运行时，也不改变 runtime copy、命令、语义图标身份、玩法内容和 hit geometry 的项目所有权。production 仍使用项目自有 master/runtime export，并通过哈希或测量证明参考参数没有漂移。\n- 对比度是最终 `container/content` 配对的门禁，不是修改参考底图的授权。当参考锁定 container、但没有锁定内容色时，修正顺序固定为：先调整独立的文字/图标 `content` token，再在参考允许的范围内调整内容描边等内容层处理，然后重新测量；禁止压暗、改色、重新生成、叠色或替换参考权威的图片资源。\n- 如果参考同时锁定 container 与 content，而二者确实无法共同满足强制门禁，必须报告具体冲突并等待用户决定；不得让通用规范静默覆盖任一参考参数。没有参考图时，才由本文与 release theme 共同指导 container/content 的初始设计。\n\n### 3.2 中文字体层级\n\n所有角色使用 release theme 显式引用的项目内静态 Noto Sans SC 中文字体，Bootstrap 不得回退到默认 Unity 字体。`display`、`screen-title`、`section-title`、`control-label` 使用静态 700 字重面；`body`、`metric`、`supplemental` 使用静态 400 字重面。运行时文字不得烘焙进按钮、卡片、指标或状态 Sprite。\n\n| 角色 | 用途 | 稳定规则 |\n| --- | --- | --- |\n| `display` | 胜负结果、极少数路线级焦点标题 | 一屏只出现一个主焦点；可由结果 banner、描边和状态色共同建立层级，不挤压主要操作 |\n| `screen-title` | Lobby、Battle、Settlement 页面标题 | 跨页面保持相同权重和层级关系 |\n| `section-title` | 卡片组、详情、模态标题 | 与 body 拉开层级，但不与 screen title 竞争 |\n| `body` | 说明、关卡信息、错误详情 | 优先完整可读，不以缩小字号解决空间不足 |\n| `control-label` | 按钮、标签和短操作 | 单行优先；加载时保留稳定宽度与原动作语义 |\n| `metric` | 阳光、核心、波次和结果数值 | 标签弱于数值，数字基线和列宽稳定 |\n| `supplemental` | 单位、冷却、状态补充 | 仍必须满足 theme 的最小可读尺寸与对比度 |\n\n字体文件、精确字号、字重、行高、角色级光学校正和最小逻辑尺寸属于 `RuntimeUiTheme`。每个角色都必须保存自己的非空 `Font` 引用；不得保留单一全局字体字段、合成 `Bold`、host/system fallback 或 measure/render 两套字体。`GUIStyle` 固定使用 `Normal`，字重来自静态字体文件本身。不得在 Presenter 中为了塞入 copy 临时缩小字号或加入逐页字体偏移；应先缩短 copy、换行或调整既有布局 authority 内的内容排布。品牌字、生成图字形和系统字体不能替代项目字体覆盖验证。\n\n单行文本的 owner 高度不得小于对应 typography role 的完整 line-height；共享绘制层必须以该 line-height 建立行盒，不能缩短行盒后依赖 `Clip` 看似塞入。Battle 的标题、指标、数量、成本、星级、状态、详情和提示必须声明有限行策略与 owner；运行时 formatter 和内容目录还必须登记发布边界样本，并用真实字体、真实 action 语义和实际 viewport 投影验证。内容域扩大时，同一变更必须更新 owner、批准 copy 或受控多行 anatomy，不允许自动缩字、截断或把 clamp 视为通过。\n\n### 3.3 四点间距节奏\n\n- 所有外边距、内边距、组件间隙和内容间隙以 4 logical point 为基础节奏，并使用 release theme 的命名 spacing token。\n- 常用密度通过 spacing token 组合表达，不在页面中散落无名数值。\n- 描边宽度、像素对齐补偿和九宫格 border 不强行按 4 的倍数处理，但必须来自 theme/ArtSet 元数据，不能成为页面例外。\n- Lobby 的舒展密度与 Battle 的工具密度可以不同；二者必须从同一 spacing token 阶梯选择，而不是形成两套尺度。\n- safe-area inset 先由布局 authority 解析，组件再在所得内容区内应用 spacing token；不能用视觉透明边距冒充 safe area。\n\n### 3.4 圆角、描边与浅阴影\n\n- 形状只使用小、中、大三类语义圆角；紧凑图标控制使用小，按钮/槽位使用中，主卡片/模态使用大。\n- 泥土棕系描边保持清楚但克制；同一层级的等价组件必须使用同一 outline role。\n- 深度关系固定为 `screen background → standard panel → gameplay stage / raised / card / action → modal/result`；gameplay stage 只作为页面内唯一高密度玩法锚点，不作为包裹下方控制区的外层容器。\n- 阴影只表达相邻层级：短距离、低对比、单一光向。禁止厚重倒角、强高光、玻璃拟态、金属科技光、纯黑框和与战场内容争夺注意力的装饰。\n- pressed 通过收短阴影和轻微内容位移表达，但外接框、布局矩形和点击区域不变。\n- exact radius、outline、shadow offset/opacity 由 release theme 持有；九宫格边界由 ArtSet 元数据持有。\n\n## 4. 内容层与安全区\n\n### 4.1 UI chrome 与 gameplay content art\n\n- UI ArtSet 拥有面板、按钮、卡片底板、槽位底板、状态标记、控制图标和资源指标图标。\n- 植物、武器、敌人、地形和战斗特效由 gameplay content art 拥有。`slot.tool` / `slot.nursery` 只规定它们进入 UI 槽后的裁切、留白、状态覆盖和层级。\n- 地图图块的风格预演、方格审核、拆分、生产化和关卡实机验收由 [地图图块统一生产管线](../art/map-tile-production-pipeline.md) 负责；本文只规定地形与 UI chrome 的所有权和层级边界，不复制地图图块生产规则。\n- 花盆若作为操作/槽位符号使用，可由 `icon.tool-pot` 表达；战场中的花盆实体仍属于 gameplay content。\n- 关卡可以改变战场配色和内容插画，但不能改变应用按钮、导航、结果卡或状态语义。\n- 美术换集不能改变命令、内容 identity、数值或任何战斗结果。\n\n### 4.2 safe area 与现有几何\n\n- `PortraitShellLayout`、`BattlefieldProjection` 及既有 Battle 交互矩形继续同时服务 draw 与 hit test。\n- Battle 的 Header 与 BattleStage 使用同一全宽 owner track，最终 WebGL 左右可见边必须对齐；Header 使用 1–2px standard outline，BattleStage 使用唯一 3–5px gameplay-stage outline。框重差来自语义槽，不得通过页面私有 rect 或局部描边补丁制造。\n- Battle 纵向顺序固定为 `Header → BattleStage → PhaseWaveRow → ContextTray/detail → NurseryTray → RefreshAction`。相邻轨道遵守四点节奏，必要操作目标不小于 44 logical points，RefreshAction 下缘距 safe-content 下缘为 8–40 logical points。\n- BattleStage 只包围同一个 `BattlefieldProjection`/Board。PhaseWaveRow、ContextTray、NurseryTray 与 RefreshAction 直接落在 page paper 的统一 8pt inset track 上，不得恢复包围 stage 与 controls 的下半页大框。\n- PhaseWaveRow 在舞台外拥有独立阶段状态区与 Wave 动作区：ready 显示“开始波次”，倒计时显示“立即开始下一波”，active 显示不可点击的波次/敌人进度，terminal 不暴露 Wave 命令。战场内不得保留第二个 Wave/control-strip draw 或 hit target。\n- ContextTray 在无选择时显示工具 anatomy、选择植物时在同一 rect 显示 detail anatomy，两者互斥；NurseryTray 与 RefreshAction 始终保留，阶段切换不得移动这些下方轨道。\n- screen background 可以铺到可见边缘；可交互内容和必要中文必须留在 resolved safe area 内。\n- UI texture 的透明 padding 只属于视觉资源，不得扩大、缩小或偏移逻辑 rect。\n- 所有共享组件必须在 360×800、375×812、402×874、430×932 的支持竖屏尺寸，以及完整和代表性顶部/底部 inset safe area 中保持受保护边角、文字和操作目标。\n- 缩放必须使用共享 UI scale context；不得为某个 Sprite 新建独立指针区域或第二套布局。\n\n## 5. 组件 anatomy\n\n所有组件接收 `theme + art set + explicit state + content`。Presenter 不得直接引用纹理路径，也不得复制共享绘制助手后再局部改色。\n\n| 组件 | 必需 anatomy | 稳定约束 |\n| --- | --- | --- |\n| Screen / safe-area surface | edge background、screen background、safe content frame | 背景与安全区分层明确；不出现默认 skin 或黑色框边 |\n| Standard panel | surface、outline、content inset | 承载普通内容，不用额外装饰制造假层级 |\n| Gameplay stage | transparent-center heavy frame、protected rail、authoritative Board | 页面内唯一常驻重结构框；只包围 gameplay projection，不包围 Context/Nursery/Refresh |\n| Phase / Wave row | sunlight phase block、phase/status copy、可选 leaf-green Wave action | 位于 gameplay stage 外；阶段区和动作区各有唯一 draw/hit owner，terminal 保持轨道但移除 Wave 命令 |\n| Raised panel | surface、outline、shallow shadow、content inset | 需要从 standard surface 抬起的卡片或浮层；与 modal 保持层级差，不用来给同级结构条制造不同框重 |\n| Selectable card | surface、标题/正文区、辅助信息区、selection marker | normal 与 selected 的文本排版尺寸不变；选择使用强调边与明确标记 |\n| Primary action | surface、outline、label、可选语义 icon、state cue | 每个操作组只能有清楚的主要动作；跨页面 anatomy 相同 |\n| Secondary action | surface、outline、label、state cue | 可用但优先级低于 primary，不靠减小触控区域降级 |\n| Quiet action | 低层级 surface 或图标承载面、label/icon、focus cue | 返回、关闭、暂停、倍速等；仍需完整状态和触控目标 |\n| Danger action | danger surface、label/icon、state cue | 只用于破坏性/终止性操作；不与普通主操作争夺默认焦点 |\n| Resource / metric | icon canvas、label、value、分隔/容器 | 数值为第一阅读点，标签和单位为第二层；跨 Battle/Settlement 对齐一致 |\n| Status feedback | status surface、状态 icon、短标题/正文、可选恢复 action | success/warning/error/loading 位置和 anatomy 一致；错误不可只显示红字 |\n| Tool / nursery slot | slot surface、content-art safe frame、数量/成本/星级区、state overlay | content art 不被 UI ArtSet 接管；Battle nursery 使用无实线/虚线轨的圆角浅纸承载面，状态层和动效不改变槽位 rect |\n| Contextual detail card | raised/detail surface、标题、属性/正文、quiet close | 关闭动作位置稳定；详情出现或退出不移动战场 hit rect |\n| Blocking modal | scrim、modal surface、标题、正文/图标、action group | scrim 阻断背景输入；primary 与 danger 层级明确 |\n| Result card | result surface、outcome 标题、metric group、action group | 胜/负共享 anatomy；结果语义由文字/图标加颜色表达 |\n\nBootstrap 初始化、阻塞错误和重试必须复用 screen、status、modal/action anatomy；Lobby 与 Settlement 不得保留 Shell 专属外观；Battle 高频控件不得形成独立组件家族。\n\n### 5.1 Action 三轴合同\n\nAction 的角色、内容形态和行为类型彼此正交，页面不得通过图标名称或控件尺寸反推动作角色：\n\n- 角色：`Primary / Secondary / Quiet / Danger`，决定 container、content、outline 与视觉优先级。\n- 内容形态：文字、图标加文字、纯图标、紧凑数值，只决定排版、安全区和光学居中。\n- 行为类型：瞬时命令或持续模式，只决定是否具有 mode lifecycle，不创造新的颜色家族。\n\n典型映射为：开始波次=`Primary + 图标文字 + 瞬时命令`；刷新苗圃=`Secondary + 图标文字 + 瞬时命令`；暂停/继续=`Quiet + 纯图标 + 持续模式`；`1×/2×`=`Quiet + 紧凑数值 + 持续模式`；关闭=`Quiet + 纯图标 + 瞬时命令`。同一操作组只能有一个 Primary；准备阶段的流程推进动作不得与辅助经济操作使用相同的 Primary 外观。\n\n组件每一帧只解析一套完整视觉样式：`ButtonStyle(role, interactionState, modeState) -> container + outline + content + focus/state cue`。禁止把 active 当作第二张按钮覆盖在 inactive 按钮上；过渡只能在同一几何的语义 token 间插值或切换，不得同时暴露两套边框、两层按钮面或未经配对验证的前景色。\n\n## 6. 完整状态矩阵\n\n### 6.1 全局状态定义\n\n| 状态 | 必需视觉线索 | 行为与组合规则 |\n| --- | --- | --- |\n| `normal` | 基础 surface、outline 和浅阴影 | 可交互组件的默认可用态 |\n| `hovered/focused` | 主题控制的轻微内缩/聚焦响应 | 不绘制 action/slot 专用选取角标，不改变布局或 hit rect；移动端无 hover 时仍保留键盘/可访问性 focus 语义 |\n| `pressed` | 阴影收短 + 内容轻微位移/压下形态 | 命令触发时机不变；不得移动 hit rect |\n| `selected` | 组件合同明确的选择线索 | Selectable card 可保留自身 marker；tool/nursery slot 使用短促内缩回弹及上下文/详情反馈，不叠加选取角标，也不改变字号、owner 或 hit rect |\n| `disabled` | 降饱和/降低对比 + 禁用 icon、标签或明确遮罩 | copy 仍可读；不能只降低 alpha；不接受输入 |\n| `loading/transitioning` | spinner/进度符号 + 保留原动作标签或加载文案 | 尺寸稳定、阻止重复命令；不能伪装成普通 disabled |\n| `success` | success color + 勾选/成功 icon 或短标签 | 用于明确完成反馈，不长期取代 normal 主操作 |\n| `warning` | warning color + 感叹号/警告 icon 或短标签 | 必须与 error 在图标/标题上可区分 |\n| `error` | danger color + 错误 icon/标题；可恢复时保留 recovery action | 不依赖红色；阻塞错误使用 modal/status hierarchy |\n| `drag-legal` | success outline/目标框 + 对勾或吸附目标符号 | 只覆盖目标槽，不重定义拖拽几何 |\n| `drag-illegal` | danger outline/目标框 + 禁止符号 | 不依赖红/绿区别；不得触发命令 |\n| `merge` | selection/success cue + 合并 icon | 与普通 legal drop 可辨，目标 rect 不变 |\n| `swap` | selection cue + 双向箭头 | 与 merge 使用不同形状线索 |\n\n状态优先级为：`loading/transitioning` 或 blocking 状态优先于 `disabled`，`disabled` 优先于 `pressed`，`pressed` 优先于 `focused`，其余回到 `normal`。`selected` 是持久选择标记，可与 focus 并存；进入 disabled/loading 后仍可保留选择身份，但不可呈现为可操作。success/warning/error 属于结果或反馈语义，不能任意覆盖 action family 的优先级。\n\n所有动效使用 theme 的 restrained、unscaled-time feedback token，并尊重降低视觉噪声；精确时长不写入 Presenter 或本文。\n\n### 6.3 共享动效与 Press 生命周期\n\n- 运行时只使用 `press`、`pop`、`strong-pop`、`fade-slide`、`stagger` 这组有限语义模式；精确时长、幅度、位移、错峰和降低动态效果策略由 release theme 持有。\n- `press`、`pop`、`strong-pop` 只允许向内收缩并快速恢复到 `1.0`；任何样本都不得大于 `1.0` 或越出组件静态外框。pop 使用独立短时长，不能被 status/reward 的长显示 pulse 拉成长回弹。\n- Motion evaluator 只消费显式传入的 unscaled time，返回 scale、alpha、offset 的纯值样本；Presenter 不创建 Coroutine、延迟命令或页面私有 Tween 类型。\n- 每个反馈目标只拥有一个当前 pulse。重复触发以新 pulse 替换旧 pulse；Hide、Disable、导航开始和交互取消必须清除 owner，不能留下延迟回调或残余透明度。\n- 动效只改变 visual rect。layout authority 产生的 draw/hit 基准矩形、safe-area 投影、BattlefieldProjection 和拖拽目标不随动画缩放或位移。\n- Action 与 tool/nursery slot 的 hover/focus、pressed 使用 theme 现有内缩尺度；苗圃点击只触发一次短促 selection pulse。不得为这三类交互再绘制 `marker.selected`、四边线或矩形 primitive，reduced-motion 下直接回到静态终态。\n- 当前 Battle Header 的三个紧凑 metric、NurseryTray 和五个 nursery cell 各自只绘制一次已审定 surface。Header/Nursery 的面板框保留；metric 与 nursery cell 也必须保留圆角浅纸承载面和柔和层次，但两类小承载面都不得含外侧实线 rim、内侧描边/虚线 rail 或其他线性四边框。若 ImageGen 返回 RGB 棋盘格，alpha 必须从该组件同一返图的连通背景提取，并在 source/runtime 每次缩放后清除低 alpha 振铃；禁止套用旧组件或其他组件的 mask，禁止透明像素保留非零 RGB，禁止无描边承载面的半透明边缘出现中性深色。PC 黑色/透明内缝属于另一类渲染缺陷，必须在共享九宫格 renderer 修复，不能通过隐藏正常 surface 实现。\n- Shell action 使用一个明确的 `down → pressed → release/cancel` 生命周期；移动超过阈值后抑制 click，释放到原目标之外、目标禁用或路线切换都不会执行命令。\n- reduced-motion 下移除 travel、stagger 和 transient impulse，直接呈现静态终态；selected/loading/success/warning/error/disabled 仍依靠图标、文字、轮廓和表面状态表达。\n- Lobby 只对路线进入、关卡选择和 Start 使用反馈；Battle 只对局部资源、状态、选择、波次与模态操作使用反馈；Settlement 按结果、指标、操作的阅读顺序短暂揭示。禁止给整屏 chrome 添加永久呼吸、循环闪光或无业务含义的漂浮。\n\n### 6.2 组件覆盖矩阵\n\n| 组件族 | N | F | P | S | D | L | OK | W | E | 拖拽派生 |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| Primary / Secondary / Quiet / Danger action | 必需 | 必需 | 必需 | 不适用 | 必需 | 必需 | 必需 | 必需 | 必需 | 不适用 |\n| Selectable card | 必需 | 必需 | 必需 | 必需 | 必需 | 必需 | 必需 | 必需 | 必需 | 不适用 |\n| Tool / nursery slot | 必需 | 必需 | 必需 | 必需 | 必需 | 必需 | 必需 | 必需 | 必需 | legal / illegal / merge / swap 全部必需 |\n| Resource / metric | 必需 | 不适用 | 不适用 | 不适用 | 可用 | 可用 | 可用 | 可用 | 可用 | 不适用 |\n| Status feedback | 基础信息可用 | 不适用 | 不适用 | 不适用 | 不适用 | 必需 | 必需 | 必需 | 必需 | 可承载拖拽解释 |\n| Detail card | 必需 | close action 单独覆盖 | close action 单独覆盖 | 可显示选择身份 | 可用 | 可用 | 可用 | 可用 | 可用 | 不适用 |\n| Blocking modal / Result card | 必需 | 内部 action 单独覆盖 | 内部 action 单独覆盖 | 不适用 | 内部 action 可用 | 必需 | 必需 | 必需 | 必需 | 不适用 |\n\n缩写：N=`normal`、F=`hovered/focused`、P=`pressed`、S=`selected`、D=`disabled`、L=`loading/transitioning`、OK=`success`、W=`warning`、E=`error`。“可用”表示只有业务语义需要时才出现，但一旦出现必须遵守全局状态定义。\n\n## 7. 语义资源槽（finite 56）\n\n下列 56 个名称是最终有限美术槽合同；序列化枚举可以使用符合代码规范的拼写，但不得合并、增删或改变语义。Presenter 只请求语义，不知道具体文件名、set ID 或路径。\n\n### 7.1 Surface / container\n\n- `surface.screen-background`\n- `surface.safe-area`\n- `surface.panel-standard`\n- `surface.panel-raised`\n- `surface.card-selectable`\n- `surface.metric`\n- `surface.status`\n- `surface.detail`\n- `surface.modal`\n- `surface.result`\n- `surface.scrim`\n- `surface.gameplay-stage`\n\n`surface.gameplay-stage` 是 128×128、20px slice/safe inset、透明中心的独立九宫格，只服务唯一高密度玩法锚点。它不得借用 standard/raised/illustration frame，也不得包含棋盘、文字、按钮、植物或角落大装饰。\n\n### 7.2 Action family\n\n- `action.primary`\n- `action.secondary`\n- `action.quiet`\n- `action.danger`\n- `action.compact-control`\n- `action.compact-control-active`\n\n四类 action role 使用同一 anatomy 和状态名称。compact 两槽是 Quiet 紧凑形态的互斥完整状态资源，不是第五种动作角色，也不得同时绘制。若状态需要独立 Sprite，它仍属于对应 action role；页面不能自行决定是否回退到 normal 纹理。\n\n### 7.3 Slot / marker / indicator\n\n- `slot.tool`\n- `slot.nursery`\n- `marker.selected`\n- `indicator.disabled`\n- `indicator.loading`\n- `indicator.success`\n- `indicator.warning`\n- `indicator.error`\n- `indicator.drag-legal`\n- `indicator.drag-illegal`\n- `indicator.merge`\n- `indicator.swap`\n\nSelectable card 是共享组件语义，其唯一美术槽为 `surface.card-selectable`；`card.selectable` 只能作为文档中的组件别名，不得成为第二个 ArtSet slot。\n\n### 7.4 Common icons\n\n- `icon.resource-sun`\n- `icon.resource-core`\n- `icon.resource-wave`\n- `icon.control-pause`\n- `icon.control-continue`\n- `icon.control-speed`\n- `icon.control-start`\n- `icon.control-start-wave`\n- `icon.control-refresh`\n- `icon.control-retry`\n- `icon.control-return`\n- `icon.control-close`\n- `icon.tool-pot`\n\n`start`、`start-wave` 与 `continue` 是三个独立语义绑定；首版 ArtSet 可以让它们指向同一 Sprite，但 Presenter 不能互相借槽或借路径。`refresh` 同样保持独立绑定。新增真正的新语义组件必须修改合同、补齐所有 intentional ArtSet 和验证；不能用文件命名约定在运行时动态发现缺失资源。\n\n### 7.5 Ornament / illustration composition\n\n- `ornament.screen-corner`\n- `surface.section-ribbon`\n- `surface.illustration-frame`\n- `ornament.metric-divider`\n- `ornament.result-banner`\n- `illustration.orchard-vista`\n- `illustration.lobby-orchard-01`\n- `illustration.lobby-orchard-02`\n- `illustration.lobby-orchard-03`\n- `illustration.shell-orchard-depth`\n\n这些槽只增强既有组件内部构图，不改变页面外接矩形、触控目标或流程。角饰、分隔符、横幅和插画使用显式 Icon、NineSlice 或固定宽高比 Stretch 几何；Presenter 不得按文件名猜测资源，也不得把运行时中文烘进 Sprite。\n\n### 7.6 密集 HUD 资源图标\n\n- `icon.resource-sun-micro`\n- `icon.resource-core-micro`\n- `icon.resource-wave-micro`\n\nmicro 槽只解决 Battle 顶栏最小尺寸的彩色资源识别，不属于可着色 action glyph；它们保持独立 optical bounds、manifest 绑定和最小尺寸验收。\n\n## 8. 美术源文件与导出规则\n\n### 8.1 Source/master 所有权\n\n- 每个 production UI 纹理或 Sprite 必须有一个归项目所有、可继续编辑的无损 master，并能追溯到 semantic role、ArtSet 和导出设置。\n- master 放入项目专用 editable-source hierarchy；使用团队可读取、无损且工具中立的可编辑格式，不能只保留某个生成器或私有工具中的不可复现状态。它必须在 runtime `Resources` 之外，也不得被 release theme/scene 直接引用。\n- 外部参考、风格板、临时试色、评审截图和测试 fixture 都不是 production master。项目自有 ImageGen 输出只有在记录 prompt/output/hash、通过文字与图标空白检查、固定为一个可直接替换的完整组件或从已评审生成预览中一次裁出的完整组件，并完成 alpha、九宫格和导出验证后，才可作为明确声明的 production 像素源；未经评审的生成输出仍是 review-only 证据。\n- 手工维护的 master 应分离 surface、outline、shadow、decoration 和切片/安全区 guide，避免每次调色重画几何。以 ImageGen 像素为合同的 action surface 则保留已评审的一体化 rim、face、outline、highlight 与 shadow，不得由脚本重新绘制或拆成另一套近似 anatomy。任何路径都不得把运行时 copy、动态数值、状态文字或操作图标烘焙进公共 UI Sprite。\n- 一个语义资源只有一个明确 master；拒绝“最终版2”“备用”“兼容”之类并行来源。只有最终边缘、描边、阴影、alpha 与 anatomy 合同完全相同的语义槽才允许共用同一母版；不得因颜色/材质相近让无描边小胶囊复用带描边的大面板母版。\n\n### 8.2 Runtime export\n\n- 优化后的 runtime export 只进入 `Assets/UI/Art/Runtime/\u003cset-id>/` 对应的 production set 目录；ArtSet 定义归 `Assets/UI/Art/Sets` 所有。raw/review/source/fixture 不能混入 runtime 目录。\n- 彩色 UI raster 使用无损、带 straight alpha 的 PNG；不得用 JPEG 或把透明阴影烘焙到不透明底色。\n- 导出尺寸必须是 intended logical size 在批准 source scale 下的整数倍；一个 ArtSet 内使用一致的 source scale，不靠 Unity 的任意缩放修正资源大小。\n- export 不自动裁掉透明 padding，不旋转图集单元，也不改变相同组件各状态的外接框。\n- 独立 Sprite 与受控 atlas 均可由后续生产实现选择，但 semantic role、Sprite 名、rect、padding 和 slicing 必须稳定并可验证。atlas 不能成为运行时按名字回退查找的机制。\n- 更新已 slotted 资源时保留稳定路径和 `.meta` GUID，并提高 ArtSet content revision；不在文件名后添加日期或版本号。\n- ImageGen surface 的确定性边界从一份已选定且有哈希的单组件生成输出开始，而不是从 prompt 再生成开始。导出器只可执行完整组件裁切、已有 alpha 读取或同语义且轮廓测量已锁定的批准 geometry-alpha mask、从返图自身提取外部背景、透明 padding、alpha-safe resize、光学测量、哈希和导出；严禁把旧资源或其他语义资源的 alpha/mask 套到新返图。不得生成、重建或替换 rim、face、outline、highlight、shadow、texture 或 decoration，也不得在源缺失时回退到程序绘制。\n- 所有透明 ImageGen 九宫格在 source master 和 runtime export 两级都必须满足：`alpha == 0` 时 `RGB == 0`，不存在 `0 \u003c alpha \u003c 48` 的缩放振铃；每次 resize 后重新执行清理和验证。声明为无描边的小承载面还必须拒绝中性/深色半透明 fringe 与连续四边 rail。任一门禁失败即终止导出和 Unity release validation，WebGL 看不见不能视为通过。\n- release theme、scene 和 runtime ArtSet 只绑定归一化后的 owned master/runtime PNG，不直接引用原始生成输出、评审预览、素材分解图或外部参考图。\n\n### 8.3 九宫格\n\n- panel、card、action、detail、modal 和 result 等可伸缩表面使用九宫格；纯色 scrim 可以由 theme token 实现，但仍必须展示同一语义层级。\n- 四角区域完整容纳圆角、描边转折和不可拉伸装饰；上下/左右 edge 只在各自轴向拉伸；中心区必须能够双向平铺/拉伸而不产生纹理接缝。\n- shadow 若烘焙在同一 Sprite 中，必须包含在透明 padding 和 protected border 内；不得被 importer trimming 或组件最小尺寸裁切。\n- Sprite border、ArtSet slicing metadata 和 master guide 必须一致。组件最小绘制尺寸必须大于受保护边界之和；验证失败时修正资源或组件合同，不静默降级为整图拉伸。\n- 九宫格必须在组件允许的最窄、最宽和多行文字场景下检查轮廓粗细、圆角和纹理连续性。\n\n### 8.4 透明安全边距\n\n- 同一组件族的所有状态使用相同 canvas、透明 gutter 和视觉基线，切换状态不能跳动。\n- 可见像素、抗锯齿、描边和阴影不得接触导出边界；透明区内保留合理 edge bleed，避免缩放或压缩产生浅/黑边。\n- importer 使用 Full Rect 保留安全边距；禁止 Tight mesh 或自动 trim 改变对齐。\n- 透明 padding 只供视觉溢出和抗锯齿使用。布局计算、content inset 和 hit rect 仍由组件/theme 明确给出，不能从透明像素猜测。\n- 九宫格 border、icon safe inset、最终运行时 PNG 的 significant-alpha optical inset 和组件 optical offset 由 ArtSet metadata 保存，精确数值不散落在 Presenter 或本文。safe inset 只定义安全画布，不能代替实际可见像素边界参与 icon-label 组合居中。\n- 同一 action surface 家族在相同阈值下必须具有一致、居中且完全 contained 的可见外框；由确定性 exporter 从 owned master 归一化，Presenter 不得通过扩大 draw rect 补偿资源差异。\n\n### 8.5 图标画布\n\n- 所有 common icon 使用同一方形逻辑 canvas、统一透明 safe inset 和统一 nominal scale；精确 canvas 与 inset 数值由 release theme/ArtSet contract 持有。\n- 主体在 safe inset 内做 optical centering；箭头、暂停条等窄形状可做视觉补偿，但外接 canvas 不变。共享排版使用 exporter 从最终运行时 PNG 生成的 optical inset 计算真实可见盒，仍绘制完整 canvas。\n- 操作型控制图标使用单色中性母版或纯 alpha mask；轮廓语言、线重和光学尺寸属于 ArtSet，最终颜色属于当前 action 的 `content` token。禁止在操作图标中烘焙泥土棕、金色、渐变、高光、阴影或状态色。单色可着色约束只规定颜色所有权，不要求图标几何雷同；后续可以在稳定画布和家族线重内，通过剪影、负形、比例和节奏增强各动作的识别度与个性。资源/内容图标可保留可识别的果园固有色，但不得替代 action content，也不得成为唯一状态线索。\n- 图标不得包含 baked label；pause、continue、retry、return、close、warning/error 等必须仅凭形状和相邻可访问名称识别。\n- outline weight、圆角语言和阴影方向在同一 ArtSet 内一致；不得混入科技线框、照片、emoji 或系统字体符号充当 production icon。\n\n### 8.6 稳定命名\n\n每个 ArtSet 文件夹使用同一 semantic stem，set identity 由文件夹和 `RuntimeUiArtSet` 持有，不写进每个文件名：\n\n```text\n\u003cfamily>-\u003csemantic-role>[-\u003cstate>].png\n```\n\n规则：\n\n- 全部使用小写 ASCII `kebab-case`；family 只使用实际有限槽中的 `surface`、`action`、`slot`、`marker`、`indicator`、`icon`。Selectable card 的唯一文件 family 是 `surface`，`card.selectable` 只是组件别名。\n- 示例：`surface-panel-standard.png`、`action-primary.png`、`marker-selected.png`、`indicator-warning.png`、`icon-resource-sun.png`。\n- 禁止加入 `lobby`、`battle`、`settlement` 等 screen 名，除非资源语义确实只属于一个新组件且合同已批准。\n- 只有确实存在独立状态资源时才加 state 后缀；是否复用 normal 不能由页面猜测，必须由有限 ArtSet contract 决定。\n- master 使用同一 semantic stem 与可编辑格式；revision 记录在 ArtSet，不写 `v2`、`final`、日期或人员名。\n- 文件重命名或移动必须保留 `.meta`；替换资源优先原位更新，以保持 GUID 和所有 semantic binding。\n\n### 8.7 外部参考资源与临时替换\n\n- 外部 APK、素材包或参考项目中的候选资源在进入 runtime export 前，必须记录来源文件哈希、包内路径、提取方法、许可/授权依据、输出格式、像素尺寸、alpha/color-space/import 设置、目标 semantic slot 和 `provisional` 状态。\n- 仍受保护、不能完整解码、不能视觉复核或不能建立授权依据的字节不得进入 production ArtSet；不能按文件名猜图、截取损坏 payload 或用运行时 fallback 掩盖缺失。\n- 可用候选先进入 editable-source hierarchy，成为无损、工具中立且可继续处理的临时 master，再通过现有确定性 exporter 和 importer validator 进入 runtime hierarchy。scene、Presenter 和 release theme 不直接引用 APK 路径、临时目录或原始 bundle。\n- 临时使用也必须满足同一 alpha、透明边、九宫格、光学盒、中文、对比度和 WebGL 门禁，不因“后续会替换”降低 production 标准。\n- runtime 只绑定既有 semantic slot；后续自有资源原位替换候选时保留路径、`.meta` GUID、Sprite border 和 slot identity，不增加兼容层、旧资源 fallback 或页面分支。\n\n### 8.8 ImageGen 单资源直替流程\n\n当现有 layout、字体、copy、交互和 semantic slot 已经成立，只需要提升表面材质时，必须使用以下最短生产路径：\n\n1. 固定三项输入：任务明确指定或用户批准的参考图视觉参数是 P0；当前 slotted master 只负责参考未定义的技术画布、透明边界和稳定导出身份；现有 runtime 页面负责 copy、命令、hit geometry 与真实使用尺寸。无参考图或参考未覆盖的参数才由本文通用合同补齐。不得先生成页面分解图、组件总表或纯色底校正版。\n2. 按不同材质家族直接生成无文字、无图标、可替换的单组件 master。确实共享同一 anatomy 与材质的多个 semantic slot 可以复用同一生成输出；不同材质不得为了省调用强行塞进一张 sheet。\n3. 优先要求生成输出自带真实透明背景。若生成器返回 baked checkerboard 或不透明背景，只允许一次确定性的背景连通域清理或使用已哈希、与当前 slotted master 对应的 geometry-alpha mask；不得再发起“改成纯色底”的第二次生成，也不得由脚本修边框或阴影。\n4. 集成脚本只允许 `hash validation → complete-component crop/alpha extraction → transparent padding → alpha-safe resize → measurement → export`。任何颜色、渐变、rim、outline、highlight、shadow、texture、dash 或 decoration 像素都必须来自已选定的生成输出。\n5. 对比度失败先修改独立的文字/操作图标 `content` token，不得把 surface 像素作为对比度调节项；若参考同时锁定前景与背景且产生硬冲突，停止并请求用户裁决。\n6. 资源原位写入既有 source/runtime 路径，保留 `.meta` GUID、Sprite border、safe inset、semantic slot、layout、字体和 draw/hit geometry；删除旧 sheet、程序绘制和 fallback 入口，不保留兼容层。\n7. 自动化只负责尺寸、alpha、透明中心、九宫格、对比度、manifest、导入和真实 WebGL 构建等技术门禁。助手不得以自己的主观视觉判断代替用户验收，也不得因自评相似度继续隐藏迭代。\n8. 每轮默认只交付一张同视口、同状态的三列实机对比：`参考图 / 改前 / 改后`。参考图等比适配到实机列，改前使用用户最近一次评分对应的不可变截图，改后必须来自本轮新构建的真实 WebGL canvas。中间生成稿、分解图、素材板和多状态截图只保留为内部证据，除非用户明确索要。\n9. 用户反馈直接作用到对应单资源及其 prompt；替换该固定输出后重复技术门禁和同一三列对比。只有用户的明确评分或批准可以关闭视觉 Gate。\n\n## 9. Unity importer 规则\n\n以下是 production UI raster 的默认合同；任何例外必须由 ArtSet metadata 明确声明并被 editor validator 接受，不能成为手工记忆：\n\n| Importer 项 | 稳定规则 |\n| --- | --- |\n| Texture Type | `Sprite (2D and UI)` |\n| Sprite Mode | `Single`；当前 56 槽合同使用 standalone FullRect Sprite，不预留 atlas/Multiple 兼容路径 |\n| Mesh Type | `Full Rect`，保留透明 padding 和九宫格边界 |\n| Color Space | 彩色 UI 使用 sRGB；数据 mask 只有在新增明确合同后才可例外 |\n| Alpha | 使用源 alpha，并启用透明边缘处理；不得烘焙不透明底色 |\n| Filter | 果园绘制型 raster 默认 `Bilinear`；禁止各页面自行覆盖 |\n| Wrap | `Clamp`，防止边缘串色 |\n| Mip Maps | screen-space UI 关闭；不得靠 mipmap 模糊修复缩放问题 |\n| Read/Write | runtime UI 默认关闭；editor 工具如需读取应使用 editor-only 路径 |\n| NPOT / Resize | 不自动缩放；保留批准 export 尺寸与 source-scale 关系 |\n| Border | 九宫格 Sprite Editor border 必须与 ArtSet slicing metadata/master guide 一致 |\n| Pixels Per Unit | 同一 set 使用统一、受验证的值；精确值由资产合同持有 |\n| Compression / Max Size | 使用 production platform profile，在保持 alpha、轮廓、中文邻近清晰度和无色边的前提下优化；精确格式/上限由 validator 配置持有 |\n| Packing | 不打入 SpriteAtlas，不旋转或 trim；每槽的透明安全边距保留在 standalone runtime export 内 |\n\n导入后必须验证 alpha、sRGB、filter、wrap、mipmap、compression、Full Rect、border、padding、尺寸、source/runtime ownership 和 theme reference。任何 release reference 指向 raw generation、review evidence、editable source、test fixture 或 runtime production hierarchy 外部时，聚合验证必须失败并报告具体资产。\n\n## 10. ArtSet 互换规则\n\n1. release application 始终只有一个 `RuntimeUiTheme` 和一个 active production `RuntimeUiArtSet`。\n2. 每个 ArtSet 必须有稳定 set ID、content revision，并恰好填满有限 semantic slot contract；缺失、重复或越权资源都使候选无效。\n3. ArtSet 不得继承另一个 set，不得按页面/关卡混用，不得回退到旧 revision、默认 Unity skin、文件名查找或远程资源。\n4. Presenter、scene、prefab、layout 和 hit rect 只绑定共享语义合同；切换一个完整、已批准的 ArtSet 或原位更新 Sprite 不需要 C#、scene、prefab 或 Presenter-specific texture assignment。\n5. preview 在 editor 内隔离运行，必须显示 common component/state gallery 与代表性 route chrome，且不能修改 serialized active set。\n6. activation 先验证完整性、production ownership 和 importer 合同，再以一个可 Undo 的原子编辑替换 theme 的 active-set reference；失败时原 active set 保持不变。\n7. 激活后所有 route 在同一 revision 上解析资源。正常 Unity reimport 对保留路径、`.meta` 和 semantic slot 的原位替换应同步更新全部消费者。\n8. 发布 registry 在收口时只保留一套完整已批准 treatment。未来替换必须先以完整非 active candidate 隔离 preview 与互换验证；批准后原子替换并删除旧 source、export 和 ArtSet 定义，不能长期并存为兼容路径。\n\n## 11. 视觉审查 Checklist\n\n以下清单用于组件预览、route 评审和最终真实画布验收。任何一项失败都不能用“功能仍可操作”豁免。\n\n### 11.1 方向与层级\n\n- [ ] 所有 release surface 符合「晴空纸张果园」：晴空蓝边缘、暖白纸面、泥土舞台/文字、叶绿主操作、阳光黄阶段/选中强调、克制果红危险和克制角饰。\n- [ ] 当前任务明确指定或用户批准的参考图视觉参数逐项保持，不被通用色板、对比度或材质建议覆盖；无参考参数的部分才按本文补齐。\n- [ ] Bootstrap、Lobby、Battle chrome、modal/result 与 Settlement 属于同一家族，没有默认 Unity skin、旧 Shell 或 Battle-local 混合样式。\n- [ ] `background → standard → raised/card/action → modal/result` 深度清楚且阴影克制。\n- [ ] 没有玻璃拟态、科技霓虹、厚重倒角、纯黑框、过亮高光或遮挡战场信息的装饰。\n\n### 11.2 组件与动作优先级\n\n- [ ] 等价组件 anatomy 跨 route 一致；primary、secondary、quiet、danger 层级清楚。\n- [ ] 一组操作没有多个互相竞争的 primary；danger 不成为默认主焦点。\n- [ ] selectable card、tool/nursery slot、metric、status、detail、modal、result 均来自共享组件合同。\n- [ ] 视觉替换没有改变 copy、命令、显隐条件、layout、draw/hit rect 或拖拽结果。\n- [ ] Action 角色、内容形态和行为类型分别解析；同一操作图标在 Primary、Secondary、Quiet、Danger 与 mode-active container 上使用对应 content 色，没有固定烘焙色泄漏。\n- [ ] 准备阶段的开始波次是所属操作组的唯一 Primary；刷新等辅助操作不与其争夺同一主操作层级。\n- [ ] Battle 只在舞台外的 PhaseWaveRow 暴露一个 Wave owner；active/terminal 不存在可点击的旧战场内 Wave 区。\n\n### 11.3 状态\n\n- [ ] normal、focused、pressed、selected、disabled、loading/transitioning、success、warning、error 均在 gallery 中可辨。\n- [ ] Action 与 tool/nursery slot 的 hover/press/selection 使用 contained 微动，不出现选取小标、四边线或重复 indicator；visual rect 的变化不移动 hit rect。\n- [ ] tool/nursery 同时覆盖 drag-legal、drag-illegal、merge、swap。\n- [ ] selected、disabled、loading、warning、error 和拖拽反馈至少有颜色之外的第二线索。\n- [ ] pressed、loading 和状态切换不改变组件外接框；disabled/loading 不接受重复命令。\n- [ ] normal、hover/focus、pressed、mode-active 与 disabled 均使用完整且受测的 container/content 配对；active 不叠加第二张按钮面。\n- [ ] 可恢复 error 保留清楚的 recovery action；blocking modal 的 scrim 正确阻断背景输入。\n- [ ] 最终 WebGL 像素中按钮文字达到 `4.5:1`，操作图标目标达到 `4.5:1` 且绝不低于 `3:1`，必要边界、焦点与状态线索达到 `3:1`；灰度下仍能识别持续模式。\n- [ ] 参考权威 container 的对比度修正只发生在独立文字/图标 content 层；其 master/runtime 图片哈希和参考控制像素没有因门禁被压暗、改色、重新生成、叠色或替换。\n\n### 11.4 中文、数值与间距\n\n- [ ] 所有 route 使用 release theme 的显式角色字体：display/screen-title/section-title/control-label 为静态 700，body/metric/supplemental 为静态 400；无默认字体、合成字重或缺字方框。\n- [ ] display/screen-title/section-title/body/control-label/metric/supplemental 层级一致，必要文字不低于 theme 最小值。\n- [ ] 文案未烘焙进 Sprite；长中文、数字增长和加载文案不会重叠、截断或靠临时缩小字号解决。\n- [ ] padding/gap/inset 使用 4pt spacing token；Lobby 与 Battle 只改变密度组合，不另建尺度。\n- [ ] text-primary/secondary/inverse 与承载面满足 theme 的对比度检查。\n\n### 11.5 竖屏、安全区与图形完整性\n\n- [ ] 360×800、375×812、402×874、430×932 的 full safe area 均无裁切、错误拉伸、重叠或输入漂移。\n- [ ] 至少一个代表性 top/bottom inset 下，必要文字、控制、九宫格边角和图标仍在 safe area 内。\n- [ ] 九宫格圆角、描边、edge 和浅阴影在最窄/最宽组件上连续；没有整图拉伸痕迹。\n- [ ] 当前 Battle Header panel 与 NurseryTray section perimeter 按审定母版各出现一次；三个 metric 与五个 nursery cell 各保留一个无实线/虚线轨的圆角浅纸承载面。metric 不与带描边 panel 共用母版；两类承载面的 source/runtime PNG 没有旧/异语义 mask 错位、隐藏 RGB、低 alpha 振铃、中性深色半透明 fringe 或连续四边 rail；最终画面没有黑色/透明内缝、重复 surface、选取角标或矩形 primitive，contained 微动、单一状态 indicator、layout/hit geometry 均保持。\n- [ ] icon 使用统一方形 canvas、安全 inset、outline 与 optical alignment，在最小使用尺寸仍可辨。\n- [ ] transparent padding、抗锯齿和 atlas 边缘没有黑边、浅边、bleed、trim 或状态跳动。\n\n### 11.6 资产、导入与互换\n\n- [ ] 每个 production export 有 owned lossless master、稳定 semantic stem、可追溯 source scale 和 production ownership；ImageGen 像素源还记录 prompt/output/hash、单组件 source 或一次完整组件裁切，以及允许的确定性变换。\n- [ ] release theme/scene 未引用生成原图、风格板、评审截图、source master、fixture 或 production hierarchy 外资源。\n- [ ] active ArtSet 的 set ID/revision 清楚，所有必需槽恰好一次；无继承、fallback、重复或混合集。\n- [ ] Unity importer 的 alpha、sRGB、Full Rect、filter、wrap、mipmap、compression、border、padding 和 `.meta` 符合合同。\n- [ ] editor preview 不改变 active set；合法 activation 原子且可 Undo；非法候选保持原 active set 不变。\n- [ ] 换用完整候选或原位替换 slotted texture 后，所有 route 同步更新，代码、scene、layout 和 Presenter binding 无变化。\n\n### 11.7 真实流程评审\n\n- [ ] 组件 gallery 通过后，仍在真实 release canvas 检查 Bootstrap 初始化/错误/重试、Lobby 默认/选中/过渡/错误、Battle HUD/选择/详情/拖拽/暂停/终局、Settlement 胜/负/重试/返回。\n- [ ] full 与 inset 证据标识同一 release theme、active set ID 和 revision，且不存在 legacy/default-skin/mixed-set chrome。\n- [ ] 评审记录由对应 acceptance owner 保存；本文不写入本次是否通过、构建哈希、日期或平台支持结论。\n- [ ] 表面材质迭代默认以一张 `参考图 / 改前 / 改后` 同状态实机对比交给用户；自动化结果只证明技术合法，视觉评分和通过结论只来自用户明确回复。\n\n## 12. 实施时的硬性禁项\n\n- 不保留默认 Unity skin、旧 Shell/Battle 局部皮肤、兼容主题或缺图 fallback。\n- 不由 Presenter 直接加载纹理、硬编码等价颜色/字号/间距或按 route 选择 ArtSet。\n- 不通过透明像素、Sprite 尺寸或装饰偏移改变 layout/hit geometry。\n- 不把植物、武器、敌人、地形或战斗特效迁入 UI ArtSet。\n- 不把外部参考图、未经评审的生成输出、原始生成 sheet、review-only/fixture/editable-source 资源加入 release dependency graph 或生产 `Resources`；运行时只绑定经归一化的 production export。\n- 不用“组件分解图 → 纯色背景修复图 → 再裁切”的多轮生成链路生产已具备正确框架的 UI；不把脚本绘色、重画边框或合成阴影伪装成 ImageGen 素材。\n- 不用通用视觉合同或对比度门禁压暗、改色、重新生成、叠色或替换 P0 参考权威图片；先调整独立文字/图标 content token，硬冲突交给用户裁决。\n- 不用运行时 skin switcher、remote loading、partial override 或多 set 混合实现快速迭代。\n- 不在本文记录精确 release token 值、revision、active ArtSet identity、构建状态、截图结果、平台就绪或瞬态哈希。\n\n## 13. 质量标准与权威工作流\n\n本视觉系统的可读性、对齐、资源光学盒和真实画布验收由\n`openspec/changes/archive/2026-08-20-polish-runtime-ui-quality-standard/evidence/runtime-ui-quality-checklist.md`\n定义；机器阈值由同一变更中的\n[`runtime-ui-quality-profile.json`](../../openspec/changes/archive/2026-08-20-polish-runtime-ui-quality-standard/evidence/runtime-ui-quality-profile.json)\n持有。Presenter 不得复制这些阈值，也不得为了通过单个画面而加入局部例外。\n\n### 13.1 日常编辑入口\n\n1. 在 `Fruit Defense/UI/Visual System` 中检查 release theme、active set 和候选集；候选 preview 必须在隔离 theme clone 上完成。\n2. 资源变更先运行 `RuntimeUiVisualSystemValidator.ValidateCandidate`；只有完整、无错误、无警告的 production 候选才能激活。\n3. 激活通过 `RuntimeUiVisualSystemActivation.TryActivate` 完成，一次命名 Undo 只修改 release theme 的 active ArtSet；失败不得修改 theme、scene、代码或布局。\n4. 提交前运行 `Fruit Defense/Validation/Run Project Smoke Validation`。该入口由 `ProjectSetup.SmokeValidate` 聚合有限 copy、八种画布变换、draw/hit 同源、对比度、资源、候选互换和共享状态门禁。\n5. 发布门禁只使用 `Fruit Defense/Validation/Run P0 Release Gate`；`P0ValidationSuite.Run` 通过聚合入口消费 UI 检查，不另建散落 smoke 菜单。\n\n### 13.2 资源迭代顺序\n\n1. 手工维护资源在 `Assets/UI/Art/Sources/\u003cset-id>/` 修改唯一 owned master，保留 semantic stem、导出目的和 `.meta`。\n2. ImageGen surface 逐项锁定任务指定或用户批准的 P0 参考视觉参数；当前 slotted master 只补参考未定义的技术画布/透明边界，直接生成一个可替换的无字/无图标单组件输出；不先生成分解 sheet 或纯色底修复稿。\n3. 固定单组件 output/hash。对比度失败先改独立文字/图标 content token；仅在透明通道技术失败时执行一次返图自身的连通背景清理，或使用同语义且轮廓测量已锁定的批准 geometry-alpha mask；禁止旧/异语义 mask。每次 source/runtime resize 后清除低 alpha 振铃并验证透明 RGB 为零，不得脚本调色、压暗、重画按钮 anatomy 或再次生成底色校正版。\n4. 运行该 set 的确定性 exporter，原位更新 `Assets/UI/Art/Runtime/\u003cset-id>/` 与 manifest；禁止手改 runtime PNG，也禁止在导出过程中 prompt regeneration。\n5. 运行 release validator，修正缺槽、未绑定文件、importer、alpha 边缘、光学盒、九宫格、宽高比、review dependency 或 mixed-set 错误；不得以 fallback 绕过。\n6. 在 Visual System 窗口预览完整九态组件 gallery 和代表性 route chrome；preview 不得改变 serialized theme。此步骤是工程检查，不授予主观视觉通过结论。\n7. 对完整候选执行一次原子激活/Undo/Redo 检查，最终恢复批准 active set；原位 reimport 与候选替换都不得要求修改 scene、Presenter、layout 或 hit geometry。\n8. Gate A 用同一 ordinary-WebGL payload 生成实机证据，并默认只向用户提交一张 `参考图 / 改前 / 改后` 同状态三列对比；用户明确评分前保持 visual-pending。\n9. Gate B 再用同一 payload 覆盖 Bootstrap/Lobby/Battle/Settlement/return/retry/recoverable-error，至少包含 360/375/402/430 full、代表性 inset 与 1280×720 wide host；同时检查 copy、输入、缝隙、拉伸、混合集、状态线索和 centered portrait pointer mapping。普通 WebGL 结果不能作为抖音或微信小游戏转换成功的证明。\n\n### 13.3 持久质量门槛\n\n- 普通 WebGL host 必须按宽、高两轴可用空间的较小缩放比完整 contain 竖屏画布，并保持居中、等比、无页面滚动和正确指针映射；不能依赖裁切、滚动或全屏才能触达顶部/底部内容。\n- 本地发布服务对未版本化的 `index.html` 与 host 资源必须在文件原位替换后重新计算 ETag；`no-cache` 不能配合永久路径哈希缓存，否则普通刷新会继续显示旧布局。带内容哈希的 Build 文件才允许 immutable 缓存。\n- 含 icon 与 label 的 action 以实际 icon alpha ink 与字体 glyph ink 的并集作为一个视觉组；该组在 action 内两轴中心偏差均不超过 2 logical point，可见间距为 4–8，且 icon/字形距可见描边至少 4。\n- 单行标题、正文和 control label 必须先在 owner 内解析为按 typography line-height 居中的有限行盒，再应用 role-level optical offset；禁止把 fixed-height 字形盒顶锚到更高的 owner，或在页面 Presenter 中硬编码逐页 Y 补偿。\n- Header/BattleStage 必须在 owner track 与最终 WebGL 左右可见边两处一致；outline weight 按语义分层为 standard 1–2px 与唯一 gameplay-stage 3–5px。出现第二个未批准的常驻 3px+ 大框、恢复包围下半页的外框或依赖逻辑 rect 推断最终像素都直接失败。\n- Battle 的 ContextTray 必须记录 `tools` / `selected-detail` 互斥状态；验收同时记录 stage、phase/Wave、context、nursery、refresh bounds、重框数、最终 outline band、RefreshAction 下余量、唯一 Wave hit owner 和 live text containment。\n- 稳定 copy 与动态 formatter 共用同一 containment gate。资源值、成本、库存数量、星级、状态前缀与原因、合成提示、详情组合及生产内容名称的边界样本必须覆盖 360/375/402/430 full+inset；resolver 返回 clamp、owner 越界或字体 ink 越界都直接失败。\n- Battle 的结构验收同时检查 panel geometry、text-ink containment 与 occupied-content balance；不能以控件可点击或局部像素有颜色替代整体排版通过。\n- 可比较的 header/result metric 使用同一 anatomy；同组 icon center 与文字 baseline 差不超过 1 logical point，icon 可见 alpha 距 row/card 边至少 8。\n- Battle grid 的相对两侧视觉 gutter 差不超过 1 logical point；同一个 `BattlefieldProjection` 必须同时驱动绘制与 hit test，任何 chrome 调整都不得建立第二套格子或拖拽几何。\n- Lobby 与 Settlement 必须声明 intentional occupied-content bounds、重复节奏和必要留白；“全部 Rect 均 contained”不能替代页面视觉重心与下半屏完成度检查。\n- 结果 banner 若保留，必须承载有限、可测的 outcome 语义；空装饰不能占据主要信息层级。胜/负文字使用 Noto Sans SC 静态 700 的 `display` 角色、有限 copy catalog 和角色级光学校正绘制，不能烘焙进美术或由 Settlement 私有偏移补偿。\n- Noto 中文覆盖、显式行策略、实际组合对比度、非颜色状态线索、九宫格完整 partition/UV、透明边与插画宽高比都属于失败即阻断的 release gate，不能通过缩字、fallback 或放宽阈值绕过。\n- active ArtSet 与每个 production candidate 都必须恰好满足 finite 56 槽及同一资源质量标准。原位更新保留路径和 `.meta` GUID；候选先隔离 preview，再单组原子激活并验证 Undo/Redo，失败保持 theme、scene、代码与布局不变。\n- 以上真实画布结论只覆盖普通 WebGL；抖音、微信或其他小游戏平台仍需各自转换、模拟器、真机与包体门禁。\n\n任何 Blocker/High、缺失有限 copy、默认 skin、回退资源、输入漂移或 release dependency 越界都必须失败关闭；不能在审查清单中作为“已知问题”保留。\n"}]}</script>
  <script>
    "use strict";

    const data = JSON.parse(document.getElementById("design-kb-data").textContent);
    const documents = data.documents.slice();
    const byPath = new Map(documents.map(function (document) { return [document.path, document]; }));
    const byId = new Map(documents.map(function (document) { return [document.id, document]; }));
    const children = new Map();
    const collapsed = new Set();
    let current = null;
    let searchTerm = "";
    let theme = "light";

    const elements = {
      title: document.getElementById("app-title"),
      count: document.getElementById("document-count"),
      digest: document.getElementById("digest"),
      search: document.getElementById("search"),
      tree: document.getElementById("tree"),
      documentTitle: document.getElementById("document-title"),
      documentPath: document.getElementById("document-path"),
      chips: document.getElementById("chips"),
      preview: document.getElementById("preview"),
      status: document.getElementById("status"),
      themeToggle: document.getElementById("theme-toggle"),
    };

    documents.forEach(function (document) {
      const parent = document.parent || "";
      const entries = children.get(parent) || [];
      entries.push(document);
      children.set(parent, entries);
    });
    children.forEach(function (entries) { entries.sort(compareDocuments); });

    elements.title.textContent = data.title;
    document.title = data.title;
    elements.count.textContent = documents.length + " 篇";
    elements.digest.textContent = data.contentDigest.slice(0, 12);
    applyTheme(readStoredTheme(), false);
    elements.themeToggle.addEventListener("click", function () {
      applyTheme(theme === "dark" ? "light" : "dark", true);
    });
    elements.search.addEventListener("input", function (event) {
      searchTerm = event.target.value.trim().toLowerCase();
      renderTree();
    });
    elements.preview.addEventListener("click", handlePreviewLink);
    renderTree();
    const first = (children.get("") || [])[0] || documents[0];
    if (first) selectDocument(first.path);

    function compareDocuments(left, right) {
      return left.order - right.order || left.title.localeCompare(right.title, "zh-CN") || left.path.localeCompare(right.path, "en");
    }

    function readStoredTheme() {
      try {
        const stored = window.localStorage ? window.localStorage.getItem("design-kb-theme") : "";
        return stored === "dark" ? "dark" : "light";
      } catch {
        return "light";
      }
    }

    function applyTheme(nextTheme, persist) {
      theme = nextTheme === "dark" ? "dark" : "light";
      document.body.dataset.theme = theme;
      elements.themeToggle.setAttribute("aria-checked", String(theme === "dark"));
      elements.themeToggle.setAttribute("title", theme === "dark" ? "切换到日间模式" : "切换到夜间模式");
      if (!persist) return;
      try {
        if (window.localStorage) window.localStorage.setItem("design-kb-theme", theme);
      } catch { /* Theme selection remains active for this page session. */ }
    }

    function renderTree() {
      elements.tree.replaceChildren();
      const visible = visibleDocumentIds();
      const roots = children.get("") || [];
      const rootList = document.createElement("ul");
      rootList.className = "tree-list root";
      roots.forEach(function (root) { appendTreeItem(rootList, root, visible); });
      if (!rootList.children.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = searchTerm ? "没有匹配的文档。" : "知识库没有根文档。";
        elements.tree.appendChild(empty);
      } else {
        elements.tree.appendChild(rootList);
      }
    }

    function appendTreeItem(list, documentRecord, visible) {
      if (!visible.has(documentRecord.id)) return;
      const item = document.createElement("li");
      item.className = "tree-item";
      const row = document.createElement("div");
      row.className = "tree-row";
      if (current && current.path === documentRecord.path) row.className += " active";
      const descendants = children.get(documentRecord.id) || [];
      const isCollapsed = collapsed.has(documentRecord.id) && !searchTerm;
      if (descendants.length) {
        const toggle = document.createElement("button");
        toggle.type = "button";
        toggle.className = "tree-toggle";
        toggle.setAttribute("aria-expanded", String(!isCollapsed));
        toggle.setAttribute("aria-label", (isCollapsed ? "展开" : "收起") + documentRecord.title + "的子文档");
        toggle.addEventListener("click", function () {
          if (collapsed.has(documentRecord.id)) collapsed.delete(documentRecord.id);
          else collapsed.add(documentRecord.id);
          renderTree();
        });
        row.appendChild(toggle);
      } else {
        const spacer = document.createElement("span");
        spacer.className = "tree-spacer";
        spacer.setAttribute("aria-hidden", "true");
        row.appendChild(spacer);
      }
      const button = document.createElement("button");
      button.type = "button";
      button.className = "tree-select" + (current && current.path === documentRecord.path ? " active" : "");
      const title = document.createElement("span");
      title.className = "tree-title";
      title.textContent = documentRecord.title;
      button.appendChild(title);
      button.addEventListener("click", function () { selectDocument(documentRecord.path); });
      row.appendChild(button);
      item.appendChild(row);
      if (descendants.length && !isCollapsed) {
        const nested = document.createElement("ul");
        nested.className = "tree-list";
        descendants.forEach(function (child) { appendTreeItem(nested, child, visible); });
        if (nested.children.length) item.appendChild(nested);
      }
      list.appendChild(item);
    }

    function visibleDocumentIds() {
      if (!searchTerm) return new Set(documents.map(function (document) { return document.id; }));
      const visible = new Set();
      documents.forEach(function (document) {
        const haystack = [document.title, document.id, document.status, document.path].join(" ").toLowerCase();
        if (!haystack.includes(searchTerm)) return;
        let cursor = document;
        while (cursor) {
          visible.add(cursor.id);
          cursor = cursor.parent ? byId.get(cursor.parent) : null;
        }
      });
      return visible;
    }

    function selectDocument(pathValue) {
      const next = byPath.get(pathValue);
      if (!next) return false;
      current = next;
      elements.documentTitle.textContent = next.title;
      elements.documentPath.textContent = next.path;
      elements.chips.replaceChildren();
      [
        "ID: " + next.id,
        "父文档: " + (next.parent || "根"),
        "状态: " + next.status,
        "顺序: " + next.order,
      ].forEach(function (label) {
        const chip = document.createElement("span");
        chip.className = "chip";
        chip.textContent = label;
        elements.chips.appendChild(chip);
      });
      elements.preview.innerHTML = renderMarkdown(stripFrontMatter(next.source));
      renderTree();
      window.scrollTo({ top: 0, behavior: "instant" });
      return true;
    }

    function relatedDocuments(documentRecord) {
      const ancestors = [];
      let cursor = documentRecord.parent ? byId.get(documentRecord.parent) : null;
      while (cursor) {
        ancestors.unshift(cursor);
        cursor = cursor.parent ? byId.get(cursor.parent) : null;
      }
      const directChildren = (children.get(documentRecord.id) || []).slice().sort(compareDocuments);
      const result = [];
      const seen = new Set();
      ancestors.concat([documentRecord], directChildren).forEach(function (entry) {
        if (!seen.has(entry.path)) {
          seen.add(entry.path);
          result.push(entry);
        }
      });
      return result;
    }

    function makeBundle(entries, heading) {
      const lines = [
        "# " + heading,
        "",
        "- Knowledge base: " + data.title,
        "- Content digest: " + data.contentDigest,
        "- Documents: " + entries.length,
      ];
      entries.forEach(function (entry) {
        lines.push("", "---", "", "## File: " + entry.path, "", "- Document ID: " + entry.id, "- Parent ID: " + (entry.parent || "(root)"), "", entry.source.trimEnd());
      });
      return lines.join("\n") + "\n";
    }

    function setStatus(message, type) {
      elements.status.textContent = message;
      elements.status.className = "status" + (type ? " " + type : "");
    }

    function handlePreviewLink(event) {
      const anchor = event.target.closest("a[data-doc-link]");
      if (!anchor || !current) return;
      event.preventDefault();
      const raw = anchor.dataset.docLink || "";
      const targetPath = resolveRelativePath(current.path, raw.split("#", 1)[0]);
      const target = byPath.get(targetPath);
      if (!target) {
        setStatus("未找到文档：" + targetPath, "warning");
        return;
      }
      selectDocument(target.path);
    }

    function resolveRelativePath(currentPath, relativePath) {
      const base = currentPath.split("/").slice(0, -1);
      const parts = base.concat(decodeURIComponent(relativePath).replace(/\\/g, "/").split("/"));
      const normalized = [];
      parts.forEach(function (part) {
        if (!part || part === ".") return;
        if (part === "..") normalized.pop();
        else normalized.push(part);
      });
      return normalized.join("/");
    }

    function stripFrontMatter(source) {
      const normalized = String(source || "").replace(/\r\n/g, "\n");
      if (!normalized.startsWith("---\n")) return normalized;
      const closing = normalized.indexOf("\n---\n", 4);
      return closing < 0 ? normalized : normalized.slice(closing + 5).replace(/^\n/, "");
    }

    function renderMarkdown(markdown) {
      const lines = String(markdown || "").replace(/\r\n/g, "\n").split("\n");
      const output = [];
      let index = 0;
      const fence = String.fromCharCode(96).repeat(3);
      while (index < lines.length) {
        const line = lines[index];
        if (!line.trim()) { index += 1; continue; }
        if (line.trimStart().startsWith(fence)) {
          const language = line.trim().slice(3).trim();
          const code = [];
          index += 1;
          while (index < lines.length && !lines[index].trimStart().startsWith(fence)) code.push(lines[index++]);
          if (index < lines.length) index += 1;
          output.push("<pre><code" + (language ? " class=\"language-" + escapeAttribute(language) + "\"" : "") + ">" + escapeHtml(code.join("\n")) + "</code></pre>");
          continue;
        }
        const heading = line.match(/^(#{1,6})\s+(.+)$/);
        if (heading) {
          const level = heading[1].length;
          output.push("<h" + level + " id=\"" + slugify(heading[2]) + "\">" + inlineMarkup(heading[2]) + "</h" + level + ">");
          index += 1;
          continue;
        }
        if (/^\s*(?:[-*_]\s*){3,}$/.test(line)) {
          output.push("<hr>");
          index += 1;
          continue;
        }
        if (/^>\s?/.test(line)) {
          const quote = [];
          while (index < lines.length && /^>\s?/.test(lines[index])) quote.push(lines[index++].replace(/^>\s?/, ""));
          output.push("<blockquote>" + quote.map(function (value) { return "<p>" + inlineMarkup(value) + "</p>"; }).join("") + "</blockquote>");
          continue;
        }
        if (/^\s*[-*+]\s+/.test(line)) {
          const items = [];
          while (index < lines.length && /^\s*[-*+]\s+/.test(lines[index])) items.push(lines[index++].replace(/^\s*[-*+]\s+/, ""));
          output.push("<ul>" + items.map(function (value) { return "<li>" + inlineMarkup(value) + "</li>"; }).join("") + "</ul>");
          continue;
        }
        if (/^\s*\d+[.)]\s+/.test(line)) {
          const items = [];
          while (index < lines.length && /^\s*\d+[.)]\s+/.test(lines[index])) items.push(lines[index++].replace(/^\s*\d+[.)]\s+/, ""));
          output.push("<ol>" + items.map(function (value) { return "<li>" + inlineMarkup(value) + "</li>"; }).join("") + "</ol>");
          continue;
        }
        if (index + 1 < lines.length && line.includes("|") && /^\s*\|?\s*:?-+:?\s*(?:\|\s*:?-+:?\s*)+\|?\s*$/.test(lines[index + 1])) {
          const rows = [line];
          index += 2;
          while (index < lines.length && lines[index].includes("|") && lines[index].trim()) rows.push(lines[index++]);
          const cells = rows.map(splitTableRow);
          output.push("<table><thead><tr>" + cells[0].map(function (cell) { return "<th>" + inlineMarkup(cell) + "</th>"; }).join("") + "</tr></thead><tbody>" + cells.slice(1).map(function (row) { return "<tr>" + row.map(function (cell) { return "<td>" + inlineMarkup(cell) + "</td>"; }).join("") + "</tr>"; }).join("") + "</tbody></table>");
          continue;
        }
        const paragraph = [line.trim()];
        index += 1;
        while (index < lines.length && lines[index].trim() && !isBlockStart(lines, index, fence)) paragraph.push(lines[index++].trim());
        output.push("<p>" + inlineMarkup(paragraph.join(" ")) + "</p>");
      }
      return output.join("\n");
    }

    function isBlockStart(lines, index, fence) {
      const line = lines[index];
      return line.trimStart().startsWith(fence) || /^(#{1,6})\s+/.test(line) || /^>\s?/.test(line) || /^\s*[-*+]\s+/.test(line) || /^\s*\d+[.)]\s+/.test(line) || /^\s*(?:[-*_]\s*){3,}$/.test(line) || (index + 1 < lines.length && line.includes("|") && /^\s*\|?\s*:?-+:?\s*(?:\|\s*:?-+:?\s*)+\|?\s*$/.test(lines[index + 1]));
    }

    function splitTableRow(line) {
      return line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(function (cell) { return cell.trim(); });
    }

    function inlineMarkup(value) {
      const tick = String.fromCharCode(96);
      const inlineCode = new RegExp(tick + "([^" + tick + "]+)" + tick, "g");
      return escapeHtml(String(value || ""))
        .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, renderLink)
        .replace(inlineCode, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/~~([^~]+)~~/g, "<del>$1</del>")
        .replace(/(^|[^*])\*([^*]+)\*/g, "$1<em>$2</em>");
    }

    function renderLink(match, label, href) {
      if (/^(?:https?:|mailto:|#)/i.test(href)) return "<a href=\"" + escapeAttribute(href) + "\">" + label + "</a>";
      const clean = href.split("#", 1)[0];
      if (clean.toLowerCase().endsWith(".md")) return "<a href=\"#\" data-doc-link=\"" + escapeAttribute(href) + "\">" + label + "</a>";
      return label;
    }

    function slugify(value) {
      const slug = String(value || "").toLowerCase().replace(/<[^>]+>/g, "").replace(/[^\p{L}\p{N}]+/gu, "-").replace(/^-|-$/g, "");
      return escapeAttribute(slug || "section");
    }

    function escapeHtml(value) {
      return String(value).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\"/g, "&quot;").replace(/'/g, "&#39;");
    }

    function escapeAttribute(value) {
      return escapeHtml(value).replace(/\u0060/g, "&#96;");
    }

    window.DesignKB = Object.freeze({
      data: data,
      selectPath: selectDocument,
      renderMarkdown: renderMarkdown,
      makeBundle: makeBundle,
      relatedPaths: function () { return current ? relatedDocuments(current).map(function (entry) { return entry.path; }) : []; },
    });
  </script>
  <script>
    "use strict";

    const WORKSPACE_CONFIG_PATH = "docs/design-kb.config.json";
    const WORKSPACE_DB_NAME = "design-kb-workspaces";
    const WORKSPACE_STORE_NAME = "projects";
    const WORKSPACE_ALLOWED_STATUSES = new Set(["draft", "active", "deprecated", "archived"]);
    const WORKSPACE_IGNORED_DIRECTORIES = new Set(["node_modules", "logs"]);
    const workspaceElements = {
      connect: document.getElementById("connect-project"),
      refresh: document.getElementById("refresh-project"),
      create: document.getElementById("new-document"),
      edit: document.getElementById("edit-document"),
      mode: document.getElementById("workspace-mode"),
      editor: document.getElementById("editor"),
      editorPath: document.getElementById("editor-path"),
      editorId: document.getElementById("editor-id"),
      editorParent: document.getElementById("editor-parent"),
      editorOrder: document.getElementById("editor-order"),
      editorStatus: document.getElementById("editor-status"),
      editorBody: document.getElementById("editor-body"),
      cancelEdit: document.getElementById("cancel-edit"),
    };
    let workspaceRootHandle = null;
    let workspaceConfig = null;
    let workspaceRememberedHandle = null;
    let workspaceEditorMode = "";
    let workspaceEditingPath = "";
    let workspaceOriginalSource = "";
    let workspaceEditorDirty = false;
    let workspaceRefreshing = false;
    const workspaceOriginalSelectDocument = selectDocument;

    selectDocument = function (pathValue) {
      if (workspaceEditorDirty && pathValue !== workspaceEditingPath && !workspaceConfirmDiscard()) return false;
      if (workspaceEditorMode) workspaceCloseEditor(false);
      const selected = workspaceOriginalSelectDocument(pathValue);
      workspaceUpdateControls();
      return selected;
    };

    workspaceElements.connect.addEventListener("click", workspaceConnectProject);
    workspaceElements.refresh.addEventListener("click", function () { workspaceRefreshProject(false); });
    workspaceElements.create.addEventListener("click", workspaceBeginNewDocument);
    workspaceElements.edit.addEventListener("click", workspaceBeginEdit);
    workspaceElements.editor.addEventListener("submit", workspaceSaveEditor);
    workspaceElements.cancelEdit.addEventListener("click", workspaceCancelEditor);
    [workspaceElements.editorPath, workspaceElements.editorId, workspaceElements.editorParent, workspaceElements.editorOrder, workspaceElements.editorStatus, workspaceElements.editorBody]
      .forEach(function (element) {
        element.addEventListener("input", function () { workspaceEditorDirty = true; });
        element.addEventListener("change", function () { workspaceEditorDirty = true; });
      });
    if (typeof window.addEventListener === "function") {
      window.addEventListener("focus", function () {
        if (workspaceRootHandle && !workspaceEditorDirty && !workspaceRefreshing) workspaceRefreshProject(true);
      });
    }
    workspaceUpdateControls();
    workspaceRestoreProject();

    function workspaceUpdateControls() {
      const connected = Boolean(workspaceRootHandle);
      workspaceElements.refresh.disabled = !connected;
      workspaceElements.create.disabled = !connected || Boolean(workspaceEditorMode);
      workspaceElements.edit.disabled = !connected || !current || Boolean(workspaceEditorMode);
      workspaceElements.connect.textContent = connected ? "重新绑定" : (workspaceRememberedHandle ? "继续访问当前项目" : "连接当前项目");
      workspaceElements.mode.textContent = connected ? "动态项目 · Markdown 直接读写" : "静态快照";
    }

    async function workspaceConnectProject() {
      try {
        if (!workspaceRootHandle && workspaceRememberedHandle) {
          const restored = await workspaceEnsurePermission(workspaceRememberedHandle, true);
          if (restored) {
            await workspaceLoadProject(workspaceRememberedHandle);
            await workspaceStoreHandle(workspaceRememberedHandle);
            return;
          }
        }
        if (typeof window.showDirectoryPicker !== "function") {
          throw new Error("当前浏览器不支持本地目录读写，请使用桌面版 Chrome 或 Edge。");
        }
        const pickerId = "dkb-" + String(data.projectId || "project").replace(/[^a-z0-9_-]/gi, "").slice(0, 24);
        const handle = await window.showDirectoryPicker({ id: pickerId, mode: "readwrite" });
        await workspaceLoadProject(handle);
        workspaceRememberedHandle = handle;
        await workspaceStoreHandle(handle);
      } catch (error) {
        if (error && error.name === "AbortError") {
          setStatus("已取消连接，继续显示静态快照。", "warning");
        } else {
          setStatus(workspaceErrorMessage(error), "warning");
        }
      }
    }

    async function workspaceRestoreProject() {
      try {
        const handle = await workspaceReadStoredHandle();
        if (!handle) return;
        workspaceRememberedHandle = handle;
        workspaceUpdateControls();
        if (await workspaceEnsurePermission(handle, false)) {
          await workspaceLoadProject(handle);
        } else {
          setStatus("已记住当前项目；点击“继续访问当前项目”恢复目录权限。", "warning");
        }
      } catch {
        setStatus("当前显示内嵌快照；连接项目后可读取和编辑最新 Markdown。", "");
      }
    }

    async function workspaceEnsurePermission(handle, request) {
      if (!handle || typeof handle.queryPermission !== "function") return Boolean(handle);
      const options = { mode: "readwrite" };
      if (await handle.queryPermission(options) === "granted") return true;
      if (request && typeof handle.requestPermission === "function") return (await handle.requestPermission(options)) === "granted";
      return false;
    }

    async function workspaceLoadProject(rootHandle, preferredPath) {
      const configText = await workspaceReadPath(rootHandle, WORKSPACE_CONFIG_PATH);
      let config;
      try { config = JSON.parse(configText); }
      catch { throw new Error("项目中的 " + WORKSPACE_CONFIG_PATH + " 不是有效 JSON。"); }
      if (String(config.projectId || "") !== String(data.projectId || "")) {
        throw new Error("所选目录不是这个知识库所属的项目。");
      }
      const contentRoots = Array.isArray(config.contentRoots) ? config.contentRoots.map(workspaceNormalizePath).filter(Boolean) : [];
      if (!contentRoots.length) throw new Error("项目配置没有有效的 contentRoots。");
      const exclude = Array.isArray(config.exclude) ? config.exclude.map(workspaceNormalizePath).filter(Boolean) : [];
      const normalizedConfig = { ...config, contentRoots: contentRoots, exclude: exclude };
      const failures = [];
      const nextDocuments = await workspaceScanDocuments(rootHandle, normalizedConfig, failures);
      failures.push(...workspaceValidateDocuments(nextDocuments));
      if (failures.length) throw new Error("动态读取失败：" + failures.slice(0, 4).join("；"));

      const selectedPath = preferredPath || (current && current.path) || "";
      workspaceRootHandle = rootHandle;
      workspaceConfig = normalizedConfig;
      workspaceApplyDocuments(nextDocuments, String(config.title || data.title), selectedPath);
      setStatus("已连接当前项目，共读取 " + documents.length + " 篇 Markdown。", "success");
      workspaceUpdateControls();
    }

    async function workspaceRefreshProject(silent) {
      if (!workspaceRootHandle || workspaceRefreshing) return false;
      if (workspaceEditorDirty) {
        if (!silent) setStatus("请先保存或取消当前编辑，再刷新项目。", "warning");
        return false;
      }
      workspaceRefreshing = true;
      try {
        const selectedPath = current && current.path;
        await workspaceLoadProject(workspaceRootHandle, selectedPath);
        if (!silent) setStatus("已重新读取项目 Markdown。", "success");
        return true;
      } catch (error) {
        setStatus(workspaceErrorMessage(error), "warning");
        return false;
      } finally {
        workspaceRefreshing = false;
      }
    }

    function workspaceApplyDocuments(nextDocuments, title, preferredPath) {
      documents.splice(0, documents.length, ...nextDocuments);
      data.documents = documents;
      data.title = title;
      data.contentDigest = workspaceDigest(documents);
      byPath.clear();
      byId.clear();
      children.clear();
      documents.forEach(function (record) {
        byPath.set(record.path, record);
        byId.set(record.id, record);
        const parent = record.parent || "";
        const entries = children.get(parent) || [];
        entries.push(record);
        children.set(parent, entries);
      });
      children.forEach(function (entries) { entries.sort(compareDocuments); });
      elements.title.textContent = data.title;
      document.title = data.title;
      elements.count.textContent = documents.length + " 篇";
      elements.digest.textContent = data.contentDigest.slice(0, 12);
      workspaceEditorDirty = false;
      workspaceCloseEditor(false);
      current = null;
      renderTree();
      const selected = byPath.get(preferredPath) || (children.get("") || [])[0] || documents[0];
      if (selected) workspaceOriginalSelectDocument(selected.path);
    }

    async function workspaceScanDocuments(rootHandle, config, failures) {
      const byScannedPath = new Map();
      for (const contentRoot of config.contentRoots) {
        try {
          const directory = await workspaceGetDirectory(rootHandle, contentRoot, false);
          await workspaceWalkDirectory(directory, contentRoot, config, byScannedPath, failures);
        } catch (error) {
          failures.push("缺少内容目录 " + contentRoot + "（" + workspaceErrorMessage(error) + "）");
        }
      }
      return [...byScannedPath.values()].sort(function (left, right) { return left.path.localeCompare(right.path, "en"); });
    }

    async function workspaceWalkDirectory(directoryHandle, relativeDirectory, config, output, failures) {
      const entries = [];
      for await (const pair of directoryHandle.entries()) entries.push(pair);
      entries.sort(function (left, right) { return left[0].localeCompare(right[0], "en"); });
      for (const pair of entries) {
        const name = pair[0];
        const handle = pair[1];
        if (name.startsWith(".") || WORKSPACE_IGNORED_DIRECTORIES.has(name.toLowerCase())) continue;
        const relative = relativeDirectory + "/" + name;
        if (workspaceIsExcluded(relative, config.exclude)) continue;
        if (handle.kind === "directory") {
          await workspaceWalkDirectory(handle, relative, config, output, failures);
          continue;
        }
        if (handle.kind !== "file" || !name.toLowerCase().endsWith(".md") || output.has(relative)) continue;
        const file = await handle.getFile();
        const source = (await file.text()).replace(/\r\n/g, "\n");
        const parsed = workspaceParseDocument(relative, source, handle, Number(file.lastModified || 0));
        failures.push(...parsed.failures);
        output.set(relative, parsed.document);
      }
    }

    function workspaceParseDocument(pathValue, source, fileHandle, lastModified) {
      const failures = [];
      const metadata = {};
      let body = source;
      if (!source.startsWith("---\n")) {
        failures.push(pathValue + " 缺少 front matter");
      } else {
        const closing = source.indexOf("\n---\n", 4);
        if (closing < 0) {
          failures.push(pathValue + " 的 front matter 没有结束标记");
        } else {
          const block = source.slice(4, closing);
          body = source.slice(closing + 5).replace(/^\n/, "");
          block.split("\n").forEach(function (rawLine) {
            if (!rawLine.trim() || rawLine.trimStart().startsWith("#")) return;
            const match = rawLine.match(/^([A-Za-z0-9_-]+):(?:\s*(.*))?$/);
            if (!match) failures.push(pathValue + " 的 front matter 行无效：" + rawLine);
            else metadata[match[1]] = workspaceDecodeScalar(match[2] || "");
          });
        }
      }
      ["id", "parent", "order", "status"].forEach(function (field) {
        if (!Object.prototype.hasOwnProperty.call(metadata, field)) failures.push(pathValue + " 缺少字段 " + field);
      });
      if (metadata.id && !/^[a-z0-9][a-z0-9-]*$/.test(metadata.id)) failures.push(pathValue + " 的 id 无效");
      if (metadata.order !== undefined && !/^-?\d+$/.test(metadata.order)) failures.push(pathValue + " 的 order 必须是整数");
      if (metadata.status && !WORKSPACE_ALLOWED_STATUSES.has(metadata.status)) failures.push(pathValue + " 的 status 无效");
      const titleMatch = body.match(/^#\s+(.+?)\s*$/m);
      if (!titleMatch) failures.push(pathValue + " 缺少一级标题");
      return {
        failures: failures,
        document: {
          path: pathValue,
          title: titleMatch ? titleMatch[1].trim() : pathValue.split("/").at(-1).replace(/\.md$/i, ""),
          id: metadata.id || "",
          parent: metadata.parent || "",
          order: Number(metadata.order || 0),
          status: metadata.status || "draft",
          source: source,
          body: body,
          fileHandle: fileHandle || null,
          lastModified: lastModified || 0,
        },
      };
    }

    function workspaceValidateDocuments(records) {
      const failures = [];
      const ids = new Map();
      const paths = new Map(records.map(function (record) { return [record.path, record]; }));
      records.forEach(function (record) {
        const entries = ids.get(record.id) || [];
        entries.push(record);
        ids.set(record.id, entries);
      });
      ids.forEach(function (entries, id) {
        if (!id || entries.length > 1) failures.push("文档 ID 重复或为空：" + (id || "(empty)"));
      });
      let roots = 0;
      records.forEach(function (record) {
        if (!record.parent) roots += 1;
        if (record.parent === record.id) failures.push(record.path + " 不能以自己作为父文档");
        if (record.parent && (ids.get(record.parent) || []).length !== 1) failures.push(record.path + " 的父文档不存在或不唯一：" + record.parent);
        const seen = new Set();
        let cursor = record;
        while (cursor && cursor.id) {
          if (seen.has(cursor.id)) { failures.push(record.path + " 存在父级循环"); break; }
          seen.add(cursor.id);
          cursor = cursor.parent && (ids.get(cursor.parent) || []).length === 1 ? ids.get(cursor.parent)[0] : null;
        }
        workspaceValidateLinks(record, paths, failures);
      });
      if (!roots) failures.push("知识库至少需要一个根文档");
      return [...new Set(failures)];
    }

    function workspaceValidateLinks(record, paths, failures) {
      const searchable = String(record.body || stripFrontMatter(record.source)).replace(/```[\s\S]*?```/g, "");
      const pattern = /\[[^\]]+\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g;
      for (const match of searchable.matchAll(pattern)) {
        const href = match[1];
        if (!href || href.startsWith("#") || /^[a-z][a-z0-9+.-]*:/i.test(href)) continue;
        let target;
        try { target = decodeURIComponent(href.split("#", 1)[0]); }
        catch { failures.push(record.path + " 包含无效链接：" + href); continue; }
        if (!target.toLowerCase().endsWith(".md")) continue;
        const resolved = workspaceResolvePath(record.path, target);
        if (!resolved || !paths.has(resolved)) failures.push(record.path + " 找不到链接目标：" + href);
      }
    }

    function workspaceBeginEdit() {
      if (!workspaceRootHandle || !current) return;
      workspaceOpenEditor("edit", current);
    }

    function workspaceBeginNewDocument() {
      if (!workspaceRootHandle || !workspaceConfig) return;
      let suffix = 1;
      let id = "new-document";
      while (byId.has(id)) id = "new-document-" + (++suffix);
      const parent = current ? current.id : "";
      const siblings = children.get(parent) || [];
      workspaceOpenEditor("new", {
        path: workspaceConfig.contentRoots[0] + "/" + id + ".md",
        id: id,
        parent: parent,
        order: siblings.length ? Math.max(...siblings.map(function (entry) { return entry.order; })) + 10 : 10,
        status: "draft",
        source: "---\nid: " + id + "\nparent: " + parent + "\norder: 10\nstatus: draft\n---\n\n# 新文档\n",
      });
    }

    function workspaceOpenEditor(mode, record) {
      workspaceEditorMode = mode;
      workspaceEditingPath = mode === "edit" ? record.path : "";
      workspaceOriginalSource = mode === "edit" ? record.source : "";
      workspaceEditorDirty = false;
      workspaceElements.editorPath.disabled = mode === "edit";
      workspaceElements.editorId.disabled = mode === "edit";
      workspaceElements.editorPath.value = record.path;
      workspaceElements.editorId.value = record.id;
      workspaceElements.editorOrder.value = String(record.order);
      workspaceElements.editorStatus.value = record.status;
      workspaceElements.editorBody.value = stripFrontMatter(record.source);
      workspacePopulateParents(mode === "edit" ? record.id : "", record.parent || "");
      elements.preview.hidden = true;
      workspaceElements.editor.hidden = false;
      elements.documentTitle.textContent = mode === "edit" ? "编辑：" + record.title : "新建文档";
      elements.documentPath.textContent = mode === "edit" ? record.path : "保存后加入当前知识库";
      workspaceUpdateControls();
    }

    function workspacePopulateParents(editingId, selectedParent) {
      workspaceElements.editorParent.replaceChildren();
      const rootOption = document.createElement("option");
      rootOption.value = "";
      rootOption.textContent = "（根文档）";
      workspaceElements.editorParent.appendChild(rootOption);
      documents.slice().sort(compareDocuments).forEach(function (record) {
        if (record.id === editingId) return;
        const option = document.createElement("option");
        option.value = record.id;
